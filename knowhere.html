function App(){
  const showToast=useToast();
  const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
  const load=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};

  /* Auth state */
  const[user,setUser]=useState(null);
  const[authChecked,setAuthChecked]=useState(false);

  /* Learning state */
  const[screen,setScreen]=useState('auth');
  const[editingFrom,setEditingFrom]=useState(null); // 'learning-prefs' when a single change was triggered from settings, vs full onboarding chain
  const[type,setType]=useState(null);
  const[neuro,setNeuro]=useState(null);
  const[repStyle,setRepStyle]=useState('visual');
  const[subject,setSubject]=useState(null);
  const[topic,setTopic]=useState(null);
  const[progress,setProgress]=useState([]);

  /* UI state */
  const[drawerOpen,setDrawerOpen]=useState(false);
  const bp=useBreakpoint();
  const[sideNavCollapsed,setSideNavCollapsed]=useState(()=>typeof window!=='undefined'&&window.innerWidth<=1024); /* rail range: start collapsed */
  /* The sidebar earns its place where navigating is the task. On a lesson the
     task is reading, so it drops to the rail and gives the content 208px back.
     Whatever you had before you entered is restored on the way out. */
  const preLessonNav=useRef(null);
  useEffect(()=>{
    if(screen==='lesson'){
      if(preLessonNav.current===null){
        preLessonNav.current=sideNavCollapsed;
        setSideNavCollapsed(true);
      }
    }else if(preLessonNav.current!==null){
      setSideNavCollapsed(preLessonNav.current);
      preLessonNav.current=null;
    }
  },[screen]);
  const[mUI,setMUI]=useState({drawer:false,sheet:false,prefs:false});
  const[nykSection,setNykSection]=useState('review'); /* Know You Know sub-section (review|test), driven from the sidenav */
  const[editProfile,setEditProfile]=useState(false);
  const[prefsSection,setPrefsSection]=useState('style');
  const goManageSubjects=()=>{setPrefsSection('subjects');setScreen('learning-prefs');};
  const[topicsFocus,setTopicsFocus]=useState(null);
  const[inviteInfo,setInviteInfo]=useState(null);
  const[flashcards,setFlashcards]=useState(()=>load('ls_flashcards',[]));
  const addFlashcard=(card)=>{
    const nf=[...flashcards,{id:Date.now()+Math.random(),status:'active',...card}];
    setFlashcards(nf);save('ls_flashcards',nf);
  };
  const removeFlashcard=(id)=>{const nf=flashcards.filter(c=>c.id!==id);setFlashcards(nf);save('ls_flashcards',nf);};
  const rateFlashcard=(id,rating)=>{
    // rating: 'nope' -> priority, 'kinda' -> active, 'gotit' -> archived
    const rc=flashcards.find(x=>x.id===id);
    if(rc){const rs=SUBJECTS.find(x=>x.name===rc.subject);if(rs)gapLog(rs.id,rc.topic,rating==='nope'?'nope':rating==='kinda'?'kinda':'got');}
    const status=rating==='nope'?'priority':rating==='kinda'?'active':'archived';
    const nf=flashcards.map(c=>c.id===id?{...c,status,lastRating:rating}:c);
    setFlashcards(nf);save('ls_flashcards',nf);
  };
  const[highlights,setHighlights]=useState(()=>load('ls_highlights',[]));
  const addHighlight=(h)=>{const nh=[...highlights,h];setHighlights(nh);save('ls_highlights',nh);};
  const removeHighlight=(id)=>{const nh=highlights.filter(x=>x.id!==id);setHighlights(nh);save('ls_highlights',nh);};
  const[waitState,setWaitState]=useState(null);
  const[resetToken,setResetToken]=useState(null);

  /* One-time repair. Cards saved before the library-merge fix stored an empty
     explanation, but the concept library still holds the text — match on
     subject + topic + concept title and backfill. Runs once, silently. */
  const flashcardRepairRef=useRef(false);
  useEffect(()=>{
    if(flashcardRepairRef.current)return;
    const broken=(flashcards||[]).filter(c=>c&&!flashcardBack(c));
    if(!broken.length)return;
    flashcardRepairRef.current=true;
    const slug=(v)=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const keyOf=(c)=>slug(c.subject)+'/'+slug(c.topic);
    const keys=[...new Set(broken.map(keyOf))];
    Promise.all(keys.map(k=>
      api.get('/topic-concepts/'+k).then(r=>[k,(r&&r.concepts)||[]]).catch(()=>[k,[]])
    )).then(pairs=>{
      const byKey=new Map(pairs);
      const norm=(v)=>String(v||'').toLowerCase().trim();
      let fixed=0;
      const next=(flashcards||[]).map(c=>{
        if(!c||flashcardBack(c))return c;
        const list=byKey.get(keyOf(c))||[];
        const hit=list.find(x=>norm(x.title)===norm(c.concept));
        if(!hit)return c;
        const text=String(hit.explanation||(hit.detail_points||[]).join(' \u00B7 ')||'').trim();
        if(!text)return c;
        fixed++;
        return{...c,explanation:text};
      });
      if(fixed>0){
        setFlashcards(next);
        save('ls_flashcards',next);
        console.log('[Knowhere] repaired '+fixed+' flashcard(s) from the concept library');
      }else{
        console.log('[Knowhere] '+broken.length+' empty flashcard(s), no library match — re-save those concepts');
      }
    }).catch(()=>{});
  },[flashcards]);

  const tc=(screen==='lesson'&&subject)?subject.color:'#7BEA5A'; /* subject accent only inside subject content — global UI stays brat green */

  /* On mount — check for existing token */
  useEffect(()=>{
    /* Invite links always win over cached sessions */
    if(new URLSearchParams(window.location.search).get('invite')){setAuthChecked(true);return;}
    const coParam=new URLSearchParams(window.location.search).get('checkout');
    const resetTok=new URLSearchParams(window.location.search).get('reset');
    if(resetTok){setResetToken(resetTok);window.history.replaceState({},'',window.location.pathname);setScreen('reset');setAuthChecked(true);return;}
    const token=localStorage.getItem('ls_token');
    if(!token){setAuthChecked(true);return;}
    api.get('/auth/me').then(res=>{
      if(res.user){
        setUser(res.user);
        if(res.user.role==='parent'){setScreen('parent-dashboard');setAuthChecked(true);return;}
        /* Load saved profile */
        const prof=res.user.profile;
        if(prof?.type&&prof?.neuro){
          setType(prof.type);setNeuro(prof.neuro);
          if(prof.repStyle)setRepStyle(prof.repStyle);
        }
        /* Load progress from backend */
        if(coParam!=='success'){
          api.get('/billing/status').then(bs=>{
            if(bs&&bs.access===false&&bs.status!=='none'){setScreen('sub-ended');}
          }).catch(()=>{});
        }
        api.get('/credits').then(cr=>{
          if(cr&&typeof cr.used==='number'){
            try{const s=JSON.parse(localStorage.getItem('ls_plan')||'{}');s.creditsUsed=cr.used;s.creditsTotal=cr.limit;localStorage.setItem('ls_plan',JSON.stringify(s));}catch(e){}
          }
        }).catch(()=>{});
        return api.get('/progress').then(pr=>{
          if(pr.progress)setProgress(pr.progress);
          const st=AU_STATES.find(x=>x.id===prof?.state);
          const nextScreen=coParam==='success'?(prof?.type?'dashboard':'welcome')
            :prof?.type?'dashboard'
            :!prof?.state?'state-select'
            :(st&&!st.live)?'waitlist'
            :prof?.subStatus==='active'?'welcome'
            :'plan-select';
          if(nextScreen==='waitlist')setWaitState(st);
          setScreen(nextScreen);
          setAuthChecked(true);
        });
      } else {
        localStorage.removeItem('ls_token');
        setAuthChecked(true);
      }
    }).catch(()=>{
      /* Backend offline — fall back to local storage */
      const prof=load('ls_profile',null);
      if(prof?.type&&prof?.neuro){setType(prof.type);setNeuro(prof.neuro);if(prof.repStyle)setRepStyle(prof.repStyle);setScreen('dashboard');}
      setProgress(load('ls_prog',[]));
      setAuthChecked(true);
    });
  },[]);

  const saveProgress=async(np)=>{
    setProgress(np);
    save('ls_prog',np);
  };

  const markComplete=async(subj,top)=>{
    const entry={subject:subj.id,topic:top,completedAt:Date.now()};
    const np=[...progress.filter(p=>!(p.subject===entry.subject&&p.topic===entry.topic)),entry];
    saveProgress(np);
    /* Sync to backend */
    api.post('/progress',{subject:subj.id,topic:top}).catch(()=>{});
  };

  /* Stripe checkout return — refresh profile, clean the URL */
  useEffect(()=>{
    const co=new URLSearchParams(window.location.search).get('checkout');
    if(!co)return;
    window.history.replaceState({},'',window.location.pathname);
    if(co==='success'){
      api.post('/billing/confirm',{}).then(r=>{
        const u=r&&r.user;
        if(u){
          setUser(u);
          const p=u.profile||{};
          localStorage.setItem('ls_plan',JSON.stringify({plan:p.plan||'core',billing:p.billing||'monthly',creditsUsed:p.creditsUsed||0,subStatus:p.subStatus||'active'}));
          /* Coming back from Stripe with nothing to show for it reads like the
             payment didn't land. Goaty fronts success toasts already, so this
             is the existing toast in a place the student is actually looking. */
          const _pl=p.plan||'core';
          showToast(
            _pl==='max'?"Max unlocked. Thirty custom concepts a month \u2014 pace yourself."
            :_pl==='pro'?"Pro unlocked. Add a concept is yours now. Go break something."
            :"You're all set. Back to it.",
            'success','top',5000);
        } else if(r&&r.ok===false&&r.reason!=='nothing pending'){
          setScreen('plan-select');
        }
      }).catch(()=>{});
    }
  },[]);

  const handleAuth=(authedUser, authMode, inviteExtra)=>{
    setUser(authedUser);
    const prof=authedUser.profile;
    if(authedUser.role==='parent'){
      if(authMode==='register-parent'&&inviteExtra){setInviteInfo(inviteExtra);setScreen('invite-sent');}
      else setScreen('parent-dashboard');
    } else if(authMode==='register'){
      setScreen('state-select');
    } else if(prof?.type&&prof?.neuro){
      setType(prof.type);setNeuro(prof.neuro);
      api.get('/progress').then(r=>{if(r.progress)setProgress(r.progress);});
      setScreen('dashboard');
    } else {
      const st=AU_STATES.find(x=>x.id===prof?.state);
      if(!prof?.state)setScreen('state-select');
      else if(st&&!st.live){setWaitState(st);setScreen('waitlist');}
      else if(prof?.subStatus==='active')setScreen('welcome');
      else setScreen('plan-select');
    }
    api.get('/billing/status').then(bs=>{
      if(bs&&bs.access===false&&bs.status!=='none'){setScreen('sub-ended');}
    }).catch(()=>{});
  };

  const handleLogout=()=>{
    localStorage.removeItem('ls_token');
    localStorage.removeItem('ls_profile');
    setUser(null);setType(null);setNeuro(null);setProgress([]);
    setScreen('auth');setDrawerOpen(false);
  };

  const saveProfile=async(t,n,rs)=>{
    setType(t);setNeuro(n);if(rs)setRepStyle(rs);
    save('ls_profile',{type:t,neuro:n,repStyle:rs||'visual'});
    if(user){
      const res=await api.put('/auth/profile',{profile:{type:t,neuro:n,repStyle:rs||'visual'}});
      if(res.user)setUser(res.user);
    }
  };

  const saveSubjects=(subjectIds)=>{
    save('ls_subjects',subjectIds);
    if(user){
      const merged={...user,profile:{...(user.profile||{}),subjects:subjectIds}};
      setUser(merged);save('ls_user',merged);
    }
    api.put('/auth/profile',{profile:{subjects:subjectIds}}).catch(()=>{});
  };

  if(!authChecked) return(
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{display:'flex',gap:5}}>
        {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:'#7BEA5A',animation:`pulse3 1.2s ease ${i*.2}s infinite`}}/>)}
      </div>
    </div>
  );

  const profileProps={user,onProfileOpen:()=>setDrawerOpen(true)};
  const showGlobalNav=['topics','dashboard','now-you-know','lesson'].includes(screen)&&type&&neuro;
  const isPreferenceScreen=['profile-home','learning-prefs','notifications','subscription'].includes(screen);

  return(
    <>
      <style>{`
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse3{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
        @keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:1}}
        @keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
        button:hover{opacity:.85}
        /* Disable copy-paste to protect IP — text stays selectable for highlights */
        .study-content{-webkit-user-select:text;user-select:text;}
        body{-webkit-user-select:none;user-select:none;}
        .study-content *{-webkit-user-select:text;user-select:text;}
        /* Highlight tooltip */
        .highlight-tooltip{position:absolute;z-index:500;background:#1A1A1A;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.6);pointer-events:auto;}
        .highlight-tooltip:hover{opacity:0.9;}
        /* Highlighted text spans */
        .knowhere-highlight{border-radius:3px;padding:0 1px;cursor:pointer;}
        .knowhere-highlight:hover{opacity:0.8;}
      `}</style>
      {/* ── Global Nav ── */}
     {['topics','lesson','dashboard','now-you-know','my-concepts','profile-home','learning-prefs','notifications','subscription'].includes(screen)&&type&&neuro&&bp!=='mobile'&&(
  <SideNav
    screen={screen} onNav={setScreen}
    subject={subject} topic={topic}
    onSelect={(s,t)=>{setSubject(s);setTopic(t);setScreen('lesson');}}
    progress={progress}
    collapsed={sideNavCollapsed}
    onToggle={()=>setSideNavCollapsed(c=>!c)}
    user={user} onProfileOpen={()=>setScreen('profile-home')} profileActive={isPreferenceScreen}
    flashcardCount={flashcards.length}
    onManageSubjects={goManageSubjects}
    nykSection={nykSection} onNykSection={sec=>{setNykSection(sec);setScreen('now-you-know');}}
  />
)}
{['topics','lesson','dashboard','now-you-know','my-concepts','profile-home','learning-prefs','notifications','subscription'].includes(screen)&&type&&neuro&&bp!=='mobile'&&(
  <BreadcrumbBar subject={subject} topic={topic} sideNavCollapsed={sideNavCollapsed} screen={screen} nykSection={nykSection}/>
)}
{bp!=='mobile'&&['topics','lesson','dashboard','now-you-know','my-concepts','profile-home','learning-prefs','notifications','subscription'].includes(screen)&&(
  <ProfileAvatar user={user} type={type} screen={screen} onNav={setScreen} onLogout={handleLogout}/>
)}
{bp!=='mobile'&&type&&neuro&&['topics','lesson','dashboard','now-you-know','my-concepts'].includes(screen)&&(
  <LibrarySearch user={user} onSelect={(s,t)=>{setSubject(s);setTopic(t);setScreen('lesson');}}/>
)}
{bp==='mobile'&&type&&neuro&&(
  <MobileChrome screen={screen} onNav={setScreen} user={user} type={type}
    progress={progress} flashcardCount={flashcards.length}
    mUI={mUI} setMUI={setMUI}
    onSelectSubject={(s)=>{setTopicsFocus(s);setScreen('topics');}}
    onProfileOpen={()=>setScreen('profile-home')}
    onLogout={handleLogout}/>
)}
{!['topics','lesson','dashboard','now-you-know','my-concepts','profile-home','learning-prefs','notifications','subscription'].includes(screen)&&showGlobalNav&&(
  <GlobalNav screen={screen} onNav={setScreen} tc='#EDEDE8' user={user}
    onProfileOpen={()=>setDrawerOpen(true)} flashcardCount={flashcards.length}/>
)}
      {/* ── Auth ── */}
      {screen==='auth'&&<AuthScreen onAuth={handleAuth}/>}
      {screen==='reset'&&<ResetScreen token={resetToken} onDone={()=>setScreen('auth')}/>}

      {/* ── State selection (new users) ── */}
      {screen==='state-select'&&<StateSelectScreen onLive={()=>setScreen('plan-select')} onWaitlist={(s)=>{setWaitState(s);setScreen('waitlist');}}/>}
      {screen==='waitlist'&&<WaitlistScreen state={waitState} onBack={()=>setScreen('state-select')} onLogout={handleLogout}/>}
      {screen==='sub-ended'&&<SubEndedScreen onLogout={handleLogout}/>}

      {/* ── Plan selection (new users) ── */}
      {screen==='plan-select'&&<PlanSelectScreen onSelect={()=>setScreen('welcome')}/>}

      {/* ── Onboarding ── */}
      {screen==='parent-dashboard'&&user&&(
        <ParentDashboard user={user} onLogout={handleLogout}/>
      )}
      {screen==='invite-sent'&&(
        <InviteSentScreen inviteInfo={inviteInfo} user={user} onContinue={()=>setScreen('parent-dashboard')}/>
      )}
      {screen==='welcome'&&<Welcome onStart={()=>setScreen('subjects')}/>}

      {screen==='subjects'&&(
        <SubjectSelectScreen initial={user?.profile?.subjects||[]}
          onBack={()=>setScreen('welcome')}
          onDone={ids=>{saveSubjects(ids);setScreen('quiz');}}/>
      )}

      {screen==='quiz'&&<Quiz editing={!!editingFrom}
        onBack={()=>{if(editingFrom){const d=editingFrom;setEditingFrom(null);setScreen(d);}else setScreen('subjects');}}
        onDone={t=>{
        setType(t);
        if(editingFrom){saveProfile(t,neuro,repStyle);setEditingFrom(null);setScreen(editingFrom);}
        else setScreen('neuro');
      }}/>}

      {screen==='neuro'&&type&&(
        <NeuroScreen type={type} neuro={neuro} editing={!!editingFrom}
          onBack={()=>{if(editingFrom){const d=editingFrom;setEditingFrom(null);setScreen(d);}else setScreen('quiz');}}
          onDone={n=>{
          setNeuro(n);
          if(editingFrom){saveProfile(type,n,repStyle);setEditingFrom(null);setScreen(editingFrom);}
          else setScreen('reveal');
        }}/>
      )}

      {/* repstyle removed from onboarding */}

      {screen==='reveal'&&type&&neuro&&(
        <Reveal type={type} neuro={neuro} repStyle={repStyle} onNext={()=>{saveProfile(type,neuro,repStyle);setScreen('dashboard');}}/>
      )}

<div role="main" style={{paddingLeft:bp==='mobile'?0:(['topics','lesson','dashboard','now-you-know','my-concepts','profile-home','learning-prefs','notifications','subscription'].includes(screen)?(sideNavCollapsed?72:280):0)+(['profile-home','learning-prefs','notifications','subscription'].includes(screen)?(sideNavCollapsed?72:230):0),transition:'padding-left .28s cubic-bezier(.4,0,.2,1)'}}>
      {/* ── App ── */}
      {screen==='topics'&&type&&neuro&&(
        <Topics key={topicsFocus?topicsFocus.id:'all'} initialActive={topicsFocus}
          type={type} neuro={neuro} progress={progress}
          onSelect={(s,t)=>{setSubject(s);setTopic(t);setScreen('lesson');}}
          curScreen={screen} onNav={setScreen}
          onManageSubjects={goManageSubjects}
          {...profileProps}/>
      )}

      {screen==='lesson'&&type&&neuro&&subject&&topic&&(
        <Lesson key={subject.id+"/"+(topic||"")} type={type} neuro={neuro} repStyle={repStyle} subject={subject} topic={topic} tc={tc}
          onBack={()=>setScreen('topics')}
          onDone={()=>markComplete(subject,topic)}
          onUndone={()=>saveProgress(progress.filter(p=>!(p.subject===subject.id&&p.topic===topic)))}
          topicComplete={progress.some(p=>p.subject===subject.id&&p.topic===topic)}
          onGoTopic={(t)=>{setTopic(t);setScreen('lesson');window.scrollTo({top:0});}}
          onAddFlashcard={addFlashcard} onRemoveFlashcard={removeFlashcard} flashcards={flashcards}
          onAddHighlight={addHighlight} onRemoveHighlight={removeHighlight} highlights={highlights}
          screen={screen} onNav={setScreen} sideNavCollapsed={sideNavCollapsed} bp={bp}
          {...profileProps}/>
      )}

      {screen==='now-you-know'&&type&&neuro&&(
        <NowYouKnow flashcards={flashcards} onRemove={removeFlashcard} onRate={rateFlashcard} tc={tc}
          type={type} neuro={neuro} subject={subject} repStyle={repStyle} section={nykSection} user={user}
          onStudy={()=>setScreen('topics')}
          highlights={highlights} onRemoveHighlight={removeHighlight}/>
      )}

      {screen==='my-concepts'&&type&&neuro&&(
        <MyConceptsPage user={user} onSelect={(s,t)=>{setSubject(s);setTopic(t);setScreen('lesson');}}/>
      )}

      {screen==='dashboard'&&type&&neuro&&(
        <Dashboard type={type} neuro={neuro} progress={progress} bp={bp}
          curScreen={screen} onNav={setScreen}
          onStudy={()=>setScreen('topics')}
          onCardsDue={()=>{setNykSection('review');setScreen('now-you-know');}}
          flashcards={flashcards}
          onOpenLesson={(s,t)=>{setSubject(s);setTopic(t);setScreen('lesson');}}
          onManageSubjects={goManageSubjects}
          onStudySubject={(s)=>{setTopicsFocus(s);setScreen('topics');}}
          {...profileProps}/>
      )}

      {screen==='profile-home'&&type&&neuro&&(
        <ProfileHome user={user} type={type} neuro={neuro} tc={tc}
          onBack={()=>setScreen('dashboard')}
          onNavArea={(s)=>setScreen(s)}
          onSaveProfile={async(updates)=>{
            const merged={...user,profile:{...(user.profile||{}),...updates}};
            setUser(merged);save('ls_user',merged);
            try{await api.put('/auth/profile',{profile:updates});}catch(e){}
          }}
          onPasswordChange={async(currentPassword,newPassword)=>{
            return api.put('/auth/password',{currentPassword,newPassword});
          }}
        />
      )}

      {screen==='learning-prefs'&&type&&neuro&&(
        <LearningPrefsHome key={prefsSection} initialSection={prefsSection} type={type} neuro={neuro} repStyle={repStyle} tc={tc} user={user}
          onBack={()=>setScreen('dashboard')}
          onNavArea={(s)=>setScreen(s)}
          onChangeType={()=>{setEditingFrom('learning-prefs');setScreen('quiz');}}
          onChangeNeuro={()=>{setEditingFrom('learning-prefs');setScreen('neuro');}}
          onChangeRepStyle={()=>{setEditingFrom('learning-prefs');setScreen('repstyle');}}
          onSaveSubjects={async(subjectIds,prioritySubjectIds)=>{
            const merged={...user,profile:{...(user.profile||{}),subjects:subjectIds,prioritySubjects:prioritySubjectIds}};
            setUser(merged);save('ls_user',merged);save('ls_subjects',subjectIds);
            try{await api.put('/auth/profile',{profile:{subjects:subjectIds,prioritySubjects:prioritySubjectIds}});}catch(e){}
          }}
        />
      )}

      {screen==='notifications'&&type&&neuro&&(
        <NotificationsHome user={user} tc={tc}
          onBack={()=>setScreen('dashboard')}
          onNavArea={(s)=>setScreen(s)}
          onSave={async(updates)=>{
            const merged={...user,profile:{...(user.profile||{}),notifications:{...(user.profile?.notifications||{}),...updates}}};
            setUser(merged);save('ls_user',merged);
            try{await api.put('/auth/profile',{profile:{notifications:merged.profile.notifications}});}catch(e){}
          }}
        />
      )}

      {screen==='subscription'&&type&&neuro&&(
        <SubscriptionHome tc={tc} onBack={()=>setScreen('dashboard')} onNavArea={(s)=>setScreen(s)}/>
      )}
      </div>

     {isPreferenceScreen&&bp!=='mobile'&&(
  <ProfileSideNav active={screen} onNavArea={(s)=>setScreen(s)} onLogout={handleLogout} collapsed={sideNavCollapsed}/>
)}
    <AppFooter/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App/></ToastProvider>);
</script>
</body>
</html>
