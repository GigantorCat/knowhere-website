/* ── Instant visual templates — no API calls, pure data-driven ────────
   Each takes small structured data extracted during lesson generation
   (visual_template + visual_data fields) and renders a 3-step instant
   stepper, with a soft glow/blur aesthetic and a larger frame. Falls
   back gracefully (returns null) if data is missing. ──────────────── */

function VizGlowDefs({tc,id="vgGlow"}){
  return(
    <defs>
      <radialGradient id={id} cx="50%" cy="42%" r="65%">
        <stop offset="0%" stopColor={tc} stopOpacity="0.16"/>
        <stop offset="100%" stopColor={tc} stopOpacity="0"/>
      </radialGradient>
    </defs>
  );
}

function VizShell({tc,children,steps,step,setStep,label}){
  return(
    <div style={{
      position:"relative",overflow:"hidden",
      background:`radial-gradient(ellipse 80% 70% at 50% 35%, ${tc}14 0%, transparent 70%), ${C.s2}`,
      border:`1px solid ${tc}20`,borderRadius:16,padding:"36px 28px",marginBottom:14,
      minHeight:380,display:"flex",flexDirection:"column",
    }}>
      {/* Step dots */}
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:8}} aria-label="Step progress">
        {steps.map((_,i)=>(
          <div key={i} style={{
            width:8,height:8,borderRadius:"50%",
            background:i===step?tc:C.faint,
            transform:i===step?"scale(1.3)":"scale(1)",
            boxShadow:i===step?`0 0 10px ${tc}80`:"none",
            transition:"all .25s ease",
          }}/>
        ))}
      </div>
      {label&&(
        <p style={{fontSize:11,fontWeight:700,color:tc,margin:"4px 0 0",letterSpacing:"0.12em",textTransform:"uppercase",textAlign:"center"}}>{label}</p>
      )}
      {/* Content */}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20,textAlign:"center",padding:"16px 0",position:"relative",zIndex:1}}>
        {children}
      </div>
      {/* Controls */}
      <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:8}}>
        <button onClick={()=>setStep(0)}
          style={{padding:"10px 22px",borderRadius:9,border:`1px solid ${C.b2}`,background:C.s1,color:C.text,fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"inherit"}}>
          Reset
        </button>
        <button onClick={()=>setStep(s=>Math.min(s+1,steps.length-1))}
          style={{padding:"10px 24px",borderRadius:9,border:"none",background:tc,color:"#080809",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:`0 0 16px ${tc}40`}}>
          {step===steps.length-1?"Done":"Next"}
        </button>
      </div>
    </div>
  );
}

function VizItem({label,sub,tc,highlight,icon}){
  return(
    <div style={{
      background:highlight?`${tc}15`:"rgba(255,255,255,0.03)",
      border:`1px solid ${highlight?tc:C.b2}`,
      borderRadius:12,padding:"16px 26px",
      minWidth:120,
      boxShadow:highlight?`0 0 24px ${tc}30`:"none",
      transition:"all .3s ease",
    }}>
      {icon&&<div style={{fontSize:22,marginBottom:6,color:highlight?tc:C.muted}}>{icon}</div>}
      <p style={{fontSize:15,fontWeight:600,color:highlight?tc:C.text,margin:0,lineHeight:1.3}}>{label}</p>
      {sub&&<p style={{fontSize:12,color:C.muted,margin:"4px 0 0",fontWeight:300}}>{sub}</p>}
    </div>
  );
}

/* ── Process: before → change → after ─────────────────────────────── */
function ProcessViz({data,tc}){
  const[step,setStep]=useState(0);
  if(!data?.before||!data?.change||!data?.after)return null;
  const steps=[
    {label:"Before",item:data.before},
    {label:"What happens",item:data.change,highlight:true},
    {label:"After",item:data.after},
  ];
  const s=steps[step];
  return(
    <VizShell tc={tc} steps={steps} step={step} setStep={setStep} label={s.label}>
      <VizItem label={s.item} tc={tc} highlight={s.highlight} icon={step===1?"⚡":undefined}/>
      {step===2&&data.before&&data.after&&(
        <div style={{display:"flex",alignItems:"center",gap:16,marginTop:6,flexWrap:"wrap",justifyContent:"center"}}>
          <VizItem label={data.before} tc={tc}/>
          <svg width="28" height="18" viewBox="0 0 28 18" fill="none" aria-hidden><path d="M2 9H25M25 9L17 2M25 9L17 16" stroke={tc} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          <VizItem label={data.after} tc={tc} highlight/>
        </div>
      )}
    </VizShell>
  );
}

/* ── System map: central concept + 2-4 connected factors,
   curved glowing connectors in the Raycast-orbit style ─────────────── */
function SystemMapViz({data,tc}){
  const[step,setStep]=useState(0);
  if(!data?.center||!Array.isArray(data?.factors)||data.factors.length<2)return null;
  const factors=data.factors.slice(0,4);
  const steps=[
    {label:"The system",focus:-1},
    {label:"What connects to it",focus:-1},
    {label:"How it responds",focus:0},
  ];
  const W=420,H=260;
  const cx=W/2,cy=H/2-6;
  const positions=factors.map((_,i)=>{
    const a=(i*(2*Math.PI/factors.length))-Math.PI/2;
    return{x:cx+150*Math.cos(a),y:cy+95*Math.sin(a)};
  });
  return(
    <VizShell tc={tc} steps={steps} step={step} setStep={setStep} label={steps[step].label}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:440,height:"auto"}} aria-hidden>
        <VizGlowDefs tc={tc}/>
        {step>=1&&positions.map((p,i)=>{
          const dimmed=step===2&&i!==0;
          const on=step===2&&i===0;
          // Curved connector — quadratic bezier bowing perpendicular to the line
          const dx=p.x-cx,dy=p.y-cy;
          const mx=(cx+p.x)/2,my=(cy+p.y)/2;
          const nx=mx-dy*0.12,ny=my+dx*0.12;
          return<path key={i} d={`M${cx},${cy} Q${nx},${ny} ${p.x},${p.y}`} fill="none"
            stroke={tc} strokeWidth={on?2.5:1} opacity={dimmed?0.15:on?0.8:0.4}
            style={{transition:"all .35s ease"}}/>;
        })}
        {/* Central hub with glow */}
        <circle cx={cx} cy={cy} r="60" fill={`url(#vgGlow)`}/>
        <circle cx={cx} cy={cy} r="48" fill={`${tc}1A`} stroke={tc} strokeWidth="1.4"/>
        <circle cx={cx} cy={cy} r="58" fill="none" stroke={tc} strokeWidth="0.7" opacity="0.3"/>
        <foreignObject x={cx-58} y={cy-30} width="116" height="60">
          <div style={{fontSize:14,fontWeight:700,color:tc,textAlign:"center",lineHeight:1.25,display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontFamily:"Geist,sans-serif",padding:"0 6px"}}>{data.center}</div>
        </foreignObject>
        {/* Factor nodes */}
        {step>=1&&positions.map((p,i)=>{
          const dimmed=step===2&&i!==0;
          const on=step===2&&i===0;
          return(
            <g key={i} style={{transition:"opacity .35s",opacity:dimmed?0.3:1}}>
              <circle cx={p.x} cy={p.y} r={on?44:38} fill={on?`${tc}22`:"rgba(255,255,255,0.04)"} stroke={on?tc:"rgba(255,255,255,0.14)"} strokeWidth={on?1.8:1}/>
              <foreignObject x={p.x-50} y={p.y-28} width="100" height="56">
                <div style={{fontSize:11,fontWeight:on?700:500,color:on?tc:"rgba(237,236,232,0.75)",textAlign:"center",lineHeight:1.3,display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontFamily:"Geist,sans-serif",padding:"0 4px"}}>{factors[i].name}</div>
              </foreignObject>
            </g>
          );
        })}
      </svg>
      {step===2&&factors[0]?.effect&&(
        <p style={{fontSize:14,color:C.text,margin:0,fontWeight:300,maxWidth:380,lineHeight:1.65}}>{factors[0].effect}</p>
      )}
    </VizShell>
  );
}

/* ── Comparison: A vs B ──────────────────────────────────────────────*/
function ComparisonViz({data,tc}){
  const[step,setStep]=useState(0);
  if(!data?.a?.name||!data?.b?.name||!data?.difference)return null;
  const steps=[
    {label:data.a.name,which:"a"},
    {label:data.b.name,which:"b"},
    {label:"The key difference",which:"both"},
  ];
  const s=steps[step];
  return(
    <VizShell tc={tc} steps={steps} step={step} setStep={setStep} label={s.label}>
      {s.which!=="both"?(
        <VizItem label={data[s.which].name} sub={data[s.which].detail} tc={tc} highlight/>
      ):(
        <>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",justifyContent:"center"}}>
            <VizItem label={data.a.name} sub={data.a.detail} tc={tc}/>
            <div style={{display:"flex",alignItems:"center",color:C.muted,fontSize:13,fontWeight:600}}>vs</div>
            <VizItem label={data.b.name} sub={data.b.detail} tc={tc}/>
          </div>
          <p style={{fontSize:14,color:C.text,margin:"4px 0 0",fontWeight:300,maxWidth:380,lineHeight:1.65}}>{data.difference}</p>
        </>
      )}
    </VizShell>
  );
}

/* ── Router: picks the right viz based on concept.visual_template ──── */
/* ── Field/Force relation: two bodies + a connecting quantity (distance,
   charge separation, etc) whose relationship to a force/field is the
   concept. 5-step choreography:
   1. Constant/intro text (kinetic-type reveal)
   2. Both bodies + quantity label shown
   3. Connecting line highlighted/thickened
   4. Bodies pulled inward with attraction arrows
   5. Bodies pushed outward, connecting line thins (inverse relationship) ── */
function FieldRelationViz({data,tc}){
  const[step,setStep]=useState(0);
  const[sliderR,setSliderR]=useState(100); // 0-200, live distance for step 4
  useEffect(()=>{if(step!==4)setSliderR(100);},[step]);
  if(!data?.a?.name||!data?.b?.name||!data?.quantity)return null;
  const{a,b,quantity,constant,relationship}=data;

  const steps=[
    {label:"The constant"},
    {label:"The setup"},
    {label:"The connection"},
    {label:"Always attractive"},
    {label:"Inverse relationship"},
  ];

  // Layout — two body circles with a gap that varies by step
  const W=420,H=220,cy=H/2;
  const r=44;
  // Steps 0-3 use fixed gaps for the narrative beats; step 4 is live from the slider
  const fixedGapByStep=[170,170,170,140];
  const isLive=step===4;
  const gap=isLive?sliderR:fixedGapByStep[step];
  const ax=W/2-gap/2,bx=W/2+gap/2;

  // Inverse-square: force relative to a reference distance of 100
  const force=Math.pow(100/gap,2);
  const forceClamped=Math.min(force,4); // cap visual scaling for very close distances

  const lineWidth=isLive?(1+forceClamped*2.5):step===2?4:step===4?1:2;
  const lineOpacity=isLive?Math.min(0.25+forceClamped*0.25,1):step===2?1:step===4?0.35:0.6;
  const glowOpacity=isLive?Math.min(forceClamped*0.18,0.5):0;

  const Body=({x,label,sub,filled})=>(
    <g style={{transition:isLive?"none":"transform .6s cubic-bezier(.22,.61,.36,1)"}}>
      <circle cx={x} cy={cy} r={r} fill={filled?`${tc}1A`:"rgba(255,255,255,0.03)"} stroke={tc} strokeWidth="1.6" style={{transition:isLive?"none":"all .6s"}}/>
      <circle cx={x} cy={cy} r="3" fill={tc}/>
      <text x={x} y={cy-r-14} textAnchor="middle" fontSize="16" fontWeight="700" fill={tc} fontFamily="Geist,sans-serif">{label}</text>
      {sub&&<text x={x} y={cy+r+22} textAnchor="middle" fontSize="11" fill={C.muted} fontFamily="Geist,sans-serif">{sub}</text>}
    </g>
  );

  return(
    <VizShell tc={tc} steps={steps} step={step} setStep={setStep} label={steps[step].label}>

      {/* Step 0 — constant / intro, kinetic-type style */}
      {step===0&&(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,maxWidth:380}}>
          <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:"0.35em"}}>
            {(constant||relationship||"").split(" ").map((word,i)=>(
              <span key={i} style={{
                fontSize:18,fontWeight:600,color:C.text,
                opacity:0,animation:`kineticIn .5s ease forwards`,animationDelay:`${i*70}ms`,
              }}>{word}</span>
            ))}
          </div>
          <style>{`@keyframes kineticIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}`}</style>
        </div>
      )}

      {/* Steps 1-4 — the diagram */}
      {step>0&&(
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:420,height:"auto"}} aria-hidden>
          {/* Force glow — only visible in live mode, grows as bodies get closer */}
          {isLive&&(
            <>
              <defs>
                <radialGradient id="forceGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stopColor={tc} stopOpacity={glowOpacity}/>
                  <stop offset="100%" stopColor={tc} stopOpacity="0"/>
                </radialGradient>
              </defs>
              <circle cx={W/2} cy={cy} r="90" fill="url(#forceGlow)"/>
            </>
          )}
          {/* Connecting line */}
          <line x1={ax+r} y1={cy} x2={bx-r} y2={cy} stroke={tc} strokeWidth={lineWidth} opacity={lineOpacity} style={{transition:isLive?"none":"all .6s ease"}}/>
          {/* Quantity marker (r) */}
          <circle cx={W/2} cy={cy} r="22" fill={tc} style={{transition:isLive?"none":"all .6s"}}/>
          <text x={W/2} y={cy+6} textAnchor="middle" fontSize="16" fontWeight="700" fill="#080809" fontFamily="Geist,sans-serif">{quantity}</text>

          {/* Attraction arrows — step 3 */}
          {step===3&&(
            <>
              <path d={`M${ax+r+4},${cy-30} L${ax+r+18},${cy-30}`} stroke={tc} strokeWidth="2" markerEnd="url(#arrowIn)" style={{animation:"arrowPulse 1.2s ease infinite"}}/>
              <path d={`M${bx-r-18},${cy-30} L${bx-r-4},${cy-30}`} stroke={tc} strokeWidth="2" markerEnd="url(#arrowInRev)" style={{animation:"arrowPulse 1.2s ease infinite"}}/>
              <defs>
                <marker id="arrowIn" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill={tc}/></marker>
                <marker id="arrowInRev" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8 Z" fill={tc}/></marker>
              </defs>
              <style>{`@keyframes arrowPulse{0%,100%{opacity:.4}50%{opacity:1}}`}</style>
            </>
          )}

          <Body x={ax} label={a.name} sub={step===1?a.detail:undefined} filled={step>=2&&step!==4}/>
          <Body x={bx} label={b.name} sub={step===1?b.detail:undefined} filled={step>=2&&step!==4}/>
        </svg>
      )}

      {/* Step 4 — live slider + stat readout */}
      {isLive&&(
        <div style={{width:"100%",maxWidth:380,display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:11,fontWeight:700,color:tc,letterSpacing:"0.08em",textTransform:"uppercase",flexShrink:0}}>{quantity}</span>
            <input type="range" aria-label="Adjust value" min="50" max="200" step="1" value={sliderR}
              onChange={e=>setSliderR(Number(e.target.value))}
              style={{flex:1,accentColor:tc,cursor:"pointer"}}
              aria-label={`Adjust distance ${quantity}`}/>
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center"}}>
            <div style={{background:C.s1,border:`1px solid ${C.b2}`,borderRadius:10,padding:"10px 18px",minWidth:90,textAlign:"center"}}>
              <p style={{fontSize:10,color:C.muted,margin:"0 0 4px",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase"}}>{quantity}</p>
              <p style={{fontSize:18,fontWeight:700,color:C.text,margin:0,fontFamily:"monospace"}}>{(sliderR/100).toFixed(1)}×</p>
            </div>
            <div style={{background:`${tc}15`,border:`1px solid ${tc}`,borderRadius:10,padding:"10px 18px",minWidth:90,textAlign:"center",boxShadow:`0 0 20px ${tc}30`}}>
              <p style={{fontSize:10,color:tc,margin:"0 0 4px",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase"}}>Force</p>
              <p style={{fontSize:18,fontWeight:700,color:tc,margin:0,fontFamily:"monospace"}}>{force.toFixed(2)}×</p>
            </div>
          </div>
        </div>
      )}

      {/* Caption text per step */}
      {isLive&&relationship&&(
        <p style={{fontSize:13,color:C.muted,margin:0,fontWeight:300,maxWidth:340,lineHeight:1.6}}>{relationship} — drag the slider and watch the force readout.</p>
      )}
      {step===2&&(a.detail||b.detail)&&(
        <p style={{fontSize:13,color:C.muted,margin:0,fontWeight:300,maxWidth:340,lineHeight:1.6}}>Force acts along the line joining the two centres.</p>
      )}
      {step===3&&(
        <p style={{fontSize:13,color:C.muted,margin:0,fontWeight:300,maxWidth:340,lineHeight:1.6}}>Always attractive — never repulsive.</p>
      )}
    </VizShell>
  );
}


/* ── "Know This" live widget — A/B test against instant templates ────
   Implements the prompt-factory.ts system prompt: AI generates a full
   interactive HTML widget (headline + interactive card + stats + toggle
   + Knowdrop + footer) per concept, rendered via blob-URL iframe.
   Shows a visible timer so latency is felt directly. ─────────────── */

// Slugify — must match backend's slugify() for cache key consistency
function slugify(s){
  return String(s).toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,80);
}

/* ── ConceptVisualSmart ────────────────────────────────────────────
   Renders the instant template immediately (zero wait). In the
   background, fetches the cached/generated "Know This" widget for
   this concept (keyed by subject/topic/concept-title, generic and
   shared across all students). If/when it arrives, silently
   cross-fades to the richer interactive widget. No loading states,
   no buttons — pure progressive enhancement. ──────────────────── */
function ConceptVisualSmart({concept,subject,topic,tc,conceptId,highlights=[],onAddHighlight,onRemoveHighlight,footer}){
  const bpFB=useBreakpoint();
  const hlRef=useRef(highlights);hlRef.current=highlights;
  const addHiRef=useRef(onAddHighlight);addHiRef.current=onAddHighlight;
  const rmHiRef=useRef(onRemoveHighlight);rmHiRef.current=onRemoveHighlight;
  const cidRef=useRef(conceptId);cidRef.current=conceptId;
  const[richHtml,setRichHtml]=useState(null);
  const[show,setShow]=useState(false);
  const iframeRef=useRef(null);

  useEffect(()=>{
    if(!concept.visual_template && !concept.isCustom)return;
    setRichHtml(null);setShow(false);
    let cancelled=false;

    const subjSlug=slugify(subject.name);
    const topicSlug=slugify(topic);
    const conceptSlug=slugify(concept.title);
    const pointsStr=(concept.detail_points||[]).join("|");
    const params=new URLSearchParams({
      title:concept.title,
      explanation:concept.explanation||"",
      points:pointsStr,
      tc,
      /* Custom widgets are addressed by concept id, not title slug: the
         student paid a credit for this one, so it gets its own permanent
         address that no other student's identically-titled concept can
         land on and nothing renames out from under it. */
      ...(concept.isCustom?{source:'community',cid:String(conceptId||concept.id||'')}:{}), 
    });

    api.get(`/widgets/${subjSlug}/${topicSlug}/${conceptSlug}?${params.toString()}`)
      .then(d=>{
        if(cancelled)return;
        if(d?.html){
          // Inject CSS to hide the widget's own eyebrow (we show it in our card header)
          // and strip the "THE KNOWDROP" label (redundant with our UI context)
          let h=d.html;
          const hideCSS=`<style>
            .eyebrow{display:none!important;}
            .knowdrop-label,.card-label span:first-child{display:none!important;}
          </style>`;
          h=h.replace("<style>",hideCSS+"<style>");
          setRichHtml(h);
        }
      })
      .catch(()=>{}); // silent — instant template stays, no error shown to student

    return()=>{cancelled=true;};
  },[concept.title,subject.name,topic,tc]);

  useEffect(()=>{
    if(!richHtml||!iframeRef.current)return;
    const iframe=iframeRef.current;
    const blob=new Blob([richHtml],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    iframe.src=url;
    let ro=null;
    const setup=()=>{
      try{
        const doc=iframe.contentDocument;
        if(!doc?.body)return;
        try{
          if(!doc.getElementById("kwMobFix")){
            const st=doc.createElement("style");st.id="kwMobFix";
            let css="body{padding-bottom:30px!important;margin-bottom:0!important}"+
                    /* The generated widgets end with a scroll-hint rule and a
                       pulsing dot. Inside a framed card that reads as debris,
                       and the dot is more useful leading the KNOW THIS label. */
                    "hr{display:none!important}"+
                    "@keyframes kwDot{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}"+
                    ".know-this-tag::before,.kt-know .tag::before{content:'';display:inline-block;"+
                      "width:7px;height:7px;border-radius:50%;background:currentColor;"+
                      "margin-right:9px;vertical-align:middle;animation:kwDot 1.3s ease infinite}"+
                    ".kw-foot{display:none!important}"+
                    "body>*:last-child{margin-bottom:0!important;padding-bottom:0!important}";
            if(window.innerWidth<=640){
              css+="h1{font-size:clamp(16px,4.5vw,25px)!important;font-weight:800!important;line-height:1.15!important}";
            }
            st.textContent=css;
            if(doc.head)doc.head.appendChild(st);
            /* kwTrimTail: the generated widgets finish with a scroll hint —
               sometimes an <hr>, sometimes a bordered div, usually followed by
               a small pulsing dot, occasionally both inside a wrapper. Rather
               than guess at the markup, walk back from the end and drop any
               element that carries no text and is too short to be content.
               Stops at the first real block so nothing meaningful is hidden. */
            try{
              let node=doc.body?doc.body.lastElementChild:null, guard=0;
              while(node&&guard++<4){
                const prev=node.previousElementSibling;
                const txt=(node.textContent||"").replace(/[\s\u2193\u2191\u00b7\u2022]/g,"");
                const h=node.getBoundingClientRect().height;
                if(txt.length===0&&h<48){ node.style.display="none"; node=prev; continue; }
                break;
              }
            }catch(eTail){}
            const last=doc.body?doc.body.lastElementChild:null;
            if(last&&!last.classList.contains("kw-foot")){
              const cand=Array.prototype.slice.call(last.querySelectorAll("*")).concat([last]);
              const hasSmallPulse=cand.some(el=>{
                const cs=doc.defaultView.getComputedStyle(el);
                if(!/pulse|bob/i.test(cs.animationName||""))return false;
                const r=el.getBoundingClientRect();
                return r.width<24&&r.height<24;
              });
              if(hasSmallPulse&&last.textContent.replace(/\s|\u2193/g,"").length<4){
                last.style.display="none";
                /* a divider immediately above the hint belongs to it */
                const prev=last.previousElementSibling;
                if(prev){
                  const pc=doc.defaultView.getComputedStyle(prev);
                  const thin=prev.getBoundingClientRect().height<3;
                  if(prev.tagName==="HR"||(thin&&pc.borderTopWidth!=="0px")) prev.style.display="none";
                }
              }
            }
          }
        }catch(eInj){}
        try{
          if(!doc.getElementById("kwHiFix")){
            const hst=doc.createElement("style");hst.id="kwHiFix";
            hst.textContent=".kwHi{background:#FFFFFF;color:#080809;border-radius:2px;cursor:pointer}"+
              ".kwHiTip{position:absolute;z-index:9999;background:#FFFFFF;color:#080809;border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.4);white-space:nowrap}";
            if(doc.head)doc.head.appendChild(hst);
            doc.addEventListener("copy",ev=>ev.preventDefault());

            const paint=()=>{
              try{
                (hlRef.current||[]).filter(h=>h.conceptId===cidRef.current).forEach(h=>{
                  if(doc.querySelector('[data-kwhi="'+h.id+'"]'))return;
                  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null);
                  let n;
                  while((n=walker.nextNode())){
                    if(n.parentElement&&n.parentElement.closest(".kwHi,script,style"))continue;
                    const idx=n.nodeValue.indexOf(h.text);
                    if(idx===-1)continue;
                    const r=doc.createRange();
                    r.setStart(n,idx);r.setEnd(n,idx+h.text.length);
                    const m=doc.createElement("mark");
                    m.className="kwHi";m.setAttribute("data-kwhi",h.id);
                    try{r.surroundContents(m);}catch(se){}
                    break;
                  }
                });
              }catch(pe){}
            };
            paint();
            setTimeout(paint,700);

            let tip=null;
            const clearTip=()=>{if(tip&&tip.parentNode)tip.parentNode.removeChild(tip);tip=null;};
            const placeTip=(label,rect,onClick)=>{
              clearTip();
              tip=doc.createElement("button");
              tip.className="kwHiTip";tip.textContent=label;
              tip.style.left=Math.max(8,rect.left+rect.width/2-55+doc.defaultView.scrollX)+"px";
              tip.style.top=Math.max(8,rect.top-46+doc.defaultView.scrollY)+"px";
              tip.addEventListener("click",onClick);
              doc.body.appendChild(tip);
            };

            const onSelEnd=()=>{
              setTimeout(()=>{
                const sel=doc.defaultView.getSelection();
                if(!sel||sel.isCollapsed){return;}
                const txt=sel.toString().trim();
                if(txt.length<3)return;
                const rect=sel.getRangeAt(0).getBoundingClientRect();
                placeTip("\u2726 Highlight",rect,()=>{
                  if(addHiRef.current)addHiRef.current({id:Date.now(),conceptId:cidRef.current,text:txt,createdAt:new Date().toISOString()});
                  clearTip();
                  try{sel.removeAllRanges();}catch(sre){}
                  setTimeout(paint,80);
                });
              },10);
            };
            doc.addEventListener("mouseup",onSelEnd);
            doc.addEventListener("touchend",onSelEnd);

            doc.addEventListener("mousedown",ev=>{
              if(tip&&ev.target!==tip)clearTip();
              const mk=ev.target&&ev.target.closest?ev.target.closest(".kwHi"):null;
              if(mk){
                placeTip("Remove highlight",mk.getBoundingClientRect(),()=>{
                  const hid=mk.getAttribute("data-kwhi");
                  if(rmHiRef.current)rmHiRef.current(isNaN(Number(hid))?hid:Number(hid));
                  const parent=mk.parentNode;
                  while(mk.firstChild)parent.insertBefore(mk.firstChild,mk);
                  if(parent)parent.removeChild(mk);
                  clearTip();
                });
              }
            });
          }
        }catch(eHi){}
        /* Strip the generator's decorative "pulsing dot footer". The widget
           style guide specifies one; the build instruction says to omit it.
           The model obeys inconsistently, so some cached widgets carry a
           stray divider + pulsing dot at the bottom. Harmless, but it reads
           as a stuck loading state — especially sitting right above Exam
           Knowhow. Removed at render so reviewed files are never touched.
           Targets only: a text-free wrapper whose single child is an empty,
           small, circular, animated div. The "live tag" indicator survives
           because its wrapper carries label text. */
        try{
          const win=doc.defaultView;
          doc.querySelectorAll('div,footer,section').forEach(el=>{
            if(el.children.length!==1)return;
            if((el.textContent||'').trim())return;
            const dot=el.firstElementChild;
            if(!dot||dot.children.length)return;
            const r=dot.getBoundingClientRect();
            if(!(r.width>0&&r.width<=14&&r.height<=14))return;
            const cs=win.getComputedStyle(dot);
            if(!cs.animationName||cs.animationName==='none')return;
            if(parseFloat(cs.borderRadius)<r.width/2-1)return;
            el.remove();
          });
        }catch(eDot){}
        const minH=window.innerWidth<=640?220:380;
        const apply=()=>{
          const h=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight);
          if(h>0)iframe.style.height=Math.max(h,minH)+"px";
        };
        apply();
        if(window.ResizeObserver){ro=new ResizeObserver(apply);ro.observe(doc.body);}
        [50,200,500,1000].forEach(t=>setTimeout(apply,t));
        // Fade in once ready
        requestAnimationFrame(()=>setShow(true));
      }catch(e){
        /* A malformed widget must not take the whole block down with it.
           Reveal anyway — a broken visual is survivable, an invisible
           Exam Knowhow underneath it is not. */
        console.warn('[widget] setup failed for',concept.title,e);
        requestAnimationFrame(()=>setShow(true));
      }
    };
    iframe.addEventListener("load",setup);
    return()=>{iframe.removeEventListener("load",setup);ro?.disconnect();URL.revokeObjectURL(url);};
  },[richHtml]);

  return(
    <div style={{position:"relative"}}>
      <div style={{opacity:show?0:1,transition:"opacity .4s ease",pointerEvents:show?"none":"auto",position:show?"absolute":"static",inset:0,width:"100%"}}>
        <ConceptVisual concept={concept} tc={tc}/>
      </div>
      {concept.isCustom&&!richHtml&&(
        <div style={{background:C.s2,border:`1px solid ${tc}18`,borderRadius:16,padding:'32px',marginBottom:14,display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
          <div style={{display:'flex',gap:5}}>{[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:'50%',background:tc,animation:`pulse3 1.2s ease ${i*.2}s infinite`}}/>)}</div>
          <div style={{fontSize:12,color:C.muted,fontFamily:'monospace',letterSpacing:'0.08em'}}>generating knowscape…</div>
        </div>
      )}
      {richHtml&&(
        <div style={{opacity:show?1:0,transition:"opacity .4s ease",background:C.s2,border:`1px solid ${tc}18`,borderRadius:16,overflow:"hidden",marginBottom:(show&&!footer)?14:0,maxHeight:show?"none":0,
          borderBottomLeftRadius:footer?0:16,borderBottomRightRadius:footer?0:16,borderBottom:footer?'none':`1px solid ${tc}18`}}>
          <iframe ref={iframeRef} title={concept.title} sandbox="allow-scripts allow-same-origin"
            style={{width:"100%",minHeight:380,border:"none",display:"block",background:"transparent"}}/>
        </div>
      )}
      {/* Exam Knowhow sits OUTSIDE the widget wrapper. It reads as one artefact
          with the widget above it (matched borders, joined corners), but its
          visibility is no longer tied to whether the widget managed to boot. */}
      {richHtml&&footer&&(
        <div style={{background:C.s2,border:`1px solid ${tc}18`,borderTop:show?'none':`1px solid ${tc}18`,
          borderRadius:16,borderTopLeftRadius:show?0:16,borderTopRightRadius:show?0:16,
          overflow:"hidden",marginBottom:14}}>{footer}</div>
      )}
      {!richHtml&&footer&&(
        <div style={{background:C.s2,border:`1px solid ${tc}18`,borderRadius:16,overflow:"hidden",marginBottom:14}}>{footer}</div>
      )}
    </div>
  );
}

function ConceptVisual({concept,tc}){
  const t=concept.visual_template;
  const d=concept.visual_data;
  if(!t||!d)return null;
  if(t==="process")return<ProcessViz data={d} tc={tc}/>;
  if(t==="system_map")return<SystemMapViz data={d} tc={tc}/>;
  if(t==="comparison")return<ComparisonViz data={d} tc={tc}/>;
  if(t==="field_relation")return<FieldRelationViz data={d} tc={tc}/>;
  return null;
}


/* ── Auditory mode — TTS ─────────────────────────────── */
function AudioPlayer({text,tc}){
  const[playing,setPlaying]=useState(false);
  const[speed,setSpeed]=useState(1);
  const uttRef=useRef(null);
  const speak=()=>{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=speed;u.onstart=()=>setPlaying(true);u.onend=()=>setPlaying(false);
    uttRef.current=u;window.speechSynthesis.speak(u);
  };
  const stop=()=>{window.speechSynthesis?.cancel();setPlaying(false);};
  useEffect(()=>()=>window.speechSynthesis?.cancel(),[]);
  const mc='#4A9EFF';
  return(
    <div style={{background:`${mc}08`,border:`1px solid ${mc}20`,borderRadius:10,padding:'12px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:12}}>
      <div style={{display:'flex',gap:3,alignItems:'center',height:28}}>
        {Array.from({length:12}).map((_,i)=><div key={i} style={{width:2.5,borderRadius:2,background:mc,height:playing?`${8+Math.sin(Date.now()/200+i)*8}px`:'3px',opacity:playing?.7:.3,transition:'height .1s'}}/>)}
      </div>
      <button onClick={playing?stop:speak}
        style={{width:36,height:36,borderRadius:'50%',border:'none',background:mc,color:'#080809',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,boxShadow:`0 0 14px ${mc}40`}}>
        {playing?'⏹':'▶'}
      </button>
      <div style={{flex:1}}>
        <p style={{fontSize:11,color:mc,margin:'0 0 2px',fontWeight:600}}>Listen to explanation</p>
        <p style={{fontSize:11,color:C.muted,margin:0,fontWeight:300}}>{playing?'Playing…':'Click play'}</p>
      </div>
      <select value={speed} onChange={e=>{setSpeed(parseFloat(e.target.value));stop();}}
        style={{background:C.s1,border:`1px solid ${C.b1}`,color:C.text,fontSize:11,borderRadius:6,padding:'3px 6px',fontFamily:'inherit',cursor:'pointer'}}>
        {[0.75,1,1.25,1.5].map(s=><option key={s} value={s}>{s}×</option>)}
      </select>
    </div>
  );
}

/* ── Inline chat ─────────────────────────────────────── */
function InlineChat({type,neuro,subject,topic,concept,tc,onClose}){
  const[msgs,setMsgs]=useState([{role:"assistant",content:`What would you like to know about **${concept}**?`}]);
  const[inp,setInp]=useState("");
  const[loading,setLoading]=useState(false);
  const endRef=useRef(null);
  const sys=`Year 12 ${subject.name} tutor. Topic: "${concept}" in ${topic}. Type ${type.num}: ${type.driver}. Keep answers focused, 2-3 paragraphs.`;
  const send=async()=>{
    if(!inp.trim()||loading)return;
    const um={role:"user",content:inp.trim()};
    const nm=[...msgs,um];
    setMsgs(nm);setInp("");setLoading(true);
    const d=await api.post("/ai/chat",{system:sys,messages:nm.slice(-6),max_tokens:600});
    setMsgs([...nm,{role:"assistant",content:d.text||"Something went wrong."}]);
    setLoading(false);
  };
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
  const fmt=(t)=>t.replace(/\*\*(.*?)\*\*/g,`<strong style="color:${tc};font-weight:600">$1</strong>`).replace(/\n/g,"<br/>");
  return(
    <div style={{background:C.s2,border:`1px solid ${tc}25`,borderRadius:10,marginTop:12,overflow:"hidden",animation:'fadeUp .2s ease'}}>
      <div style={{padding:"9px 14px",borderBottom:`1px solid ${C.b1}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:11,fontWeight:600,color:tc,letterSpacing:"0.07em",textTransform:"uppercase"}}>Ask a question</span>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14,lineHeight:1,padding:4}}>✕</button>
      </div>
      <div style={{maxHeight:180,overflowY:"auto",padding:"10px 14px",display:"flex",flexDirection:"column",gap:7}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",flexDirection:m.role==="user"?"row-reverse":"row",gap:6}}>
            <div style={{maxWidth:"90%",padding:"8px 12px",borderRadius:m.role==="user"?"10px 10px 3px 10px":"10px 10px 10px 3px",background:m.role==="user"?`${tc}15`:C.s3,border:`1px solid ${m.role==="user"?tc+"28":C.b1}`,fontSize:12,color:C.text,lineHeight:1.6,fontWeight:300}} dangerouslySetInnerHTML={{__html:fmt(m.content)}}/>
          </div>
        ))}
        {loading&&<div style={{display:"flex",gap:4,padding:"8px 12px",background:C.s3,borderRadius:"10px 10px 10px 3px",width:"fit-content"}}>
          {[0,1,2].map(i=><div key={i} style={{width:4,height:4,borderRadius:"50%",background:tc,animation:`pulse3 1.2s ease ${i*.2}s infinite`}}/>)}
        </div>}
        <div ref={endRef}/>
      </div>
      <div style={{padding:"7px 10px",borderTop:`1px solid ${C.b1}`,display:"flex",gap:6}}>
        <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Ask anything…"
          style={{flex:1,padding:"7px 10px",borderRadius:7,border:`1px solid ${C.b1}`,background:C.s1,color:C.text,fontSize:12,fontFamily:"inherit",outline:"none",fontWeight:300}}/>
        <button onClick={send} disabled={!inp.trim()||loading}
          style={{padding:"7px 12px",borderRadius:7,border:"none",background:tc,color:"#080809",fontSize:12,fontWeight:600,cursor:"pointer",opacity:!inp.trim()||loading?.4:1}}>→</button>
      </div>
    </div>
  );
}


/* ══════════════════════════════════════════════════════
   ADD CONCEPT MODAL
══════════════════════════════════════════════════════ */
function AddConceptModal({topic,subject,type,neuro,repStyle,tc,onClose,onDone,lessonData,setLessonData}){
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState(null);
  const modalRef=useRef(null);
  useEffect(()=>{if(modalRef.current)modalRef.current.scrollIntoView({behavior:'smooth',block:'center'});},[]);

  const generate=async()=>{
    if(!input.trim()) return;
    setLoading(true);setErr(null);
    const tn=type?.num,td=type?.driver||'growth';
    const sys=`You are generating a Year 12 ${subject?.name} concept card for a student.
Student: Enneagram Type ${tn} (${type?.name}): ${type?.trait}. Style: ${repStyle}. Neuro: ${neuro?.label||'standard'}.
Topic: "${topic}". Student wants to understand: "${input}".
Formatting rules (strict):
- Plain text only. NEVER use markdown headings (no #, no ##) anywhere.
- Each label below starts its own line, written bare: "SUMMARY:" not "## SUMMARY:" and not "**SUMMARY:**".
- Do not wrap values in square brackets.
- TITLE must be 3-6 words. Never a sentence, never longer than 60 characters.
Reply in EXACTLY this format with these labels only:
TITLE: [concept name, 3-6 words]
SUMMARY: [one punchy sentence — the core idea]
EXPLAIN: [2 paragraphs. Bold key terms like this: **term**. Vivid, direct, Year 12 level.]
POINTS: [exactly 3 items separated by pipe: point one | point two | point three]
REFRAME: [1-2 sentences personalised for Type ${tn} using a concrete analogy matching driver: ${td}]
INSIGHT: [one sharp key insight sentence]
EXAMTIP: [one specific exam technique or trap to avoid]`;
    try{
      const d=await api.post('/ai/custom-concept',{system:sys,messages:[{role:'user',content:`Build concept: "${input}" within topic: ${topic}`}],max_tokens:700});
      if(d.error){setErr(d.error);setLoading(false);return;}
      const txt=d.text||'';
      /* Label parser. The old version only broke on a label at the start of a
         line, so when the model decorated its labels ("## SUMMARY:") every
         field after TITLE was swallowed into the title — mammoth headings, and
         "For your brain" absorbing INSIGHT and EXAMTIP.

         Two passes: normalise any decoration around a label into a bare
         newline + "LABEL: ", then split on those positions. Asterisks inside
         the body are never touched, so **bolded terms** survive intact. */
      const _norm=String(txt).replace(/[#*>\-]*[ \t]*\b(TITLE|SUMMARY|EXPLAIN|POINTS|REFRAME|INSIGHT|EXAMTIP)\b[ \t]*[#*]*[ \t]*:[ \t]*(?:\*+(?=[ \t\n]))?[ \t]*/g,'\n$1: ');
      const _fields=(()=>{
        const out={};
        const rx=/(?:^|\n)(TITLE|SUMMARY|EXPLAIN|POINTS|REFRAME|INSIGHT|EXAMTIP):[ \t]?/g;
        const hits=[];let m;
        while((m=rx.exec(_norm))!==null)hits.push({key:m[1],at:m.index,from:m.index+m[0].length});
        hits.forEach((h,i)=>{
          const end=(i+1<hits.length)?hits[i+1].at:_norm.length;
          let v=_norm.slice(h.from,end);
          v=v.replace(/^[ \t#>]+/,'').replace(/[\s#]+$/,'').trim();
          v=v.replace(/^\[|\]$/g,'').trim();
          if(!out[h.key])out[h.key]=v;
        });
        return out;
      })();
      const get=(k)=>String(_fields[k]||'').trim();
      const pointsRaw=get('POINTS');
      const detail_points=pointsRaw.split('|').map(p=>p.replace(/^-\s*/,'').trim()).filter(Boolean);
      const newConcept={
        /* Timestamp alone collides when two students submit in the same
           millisecond, and the id is now a filesystem address. */
        id:'custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10),
        /* A runaway title means the model ignored the format; fall back to
           what the student typed rather than rendering an essay as a heading. */
        title:(()=>{const t=get('TITLE');return (t&&t.length<=80&&!/\n/.test(t))?t:input;})(),
        summary:get('SUMMARY'),
        explanation:get('EXPLAIN'),
        detail_points,
        reframe:get('REFRAME'),
        key_insight:get('INSIGHT'),
        exam_relevance:get('EXAMTIP'),
        isCustom:true,
      };
      setLessonData(prev=>{
        const newIdx=(prev?.concepts||[]).length;
        setTimeout(()=>document.getElementById('sec-c'+newIdx)?.scrollIntoView({behavior:'smooth',block:'start'}),200);
        return {...prev,concepts:[...(prev?.concepts||[]),newConcept]};
      });
      /* Persist to server so it reloads next time */
      try{
        const subSlug=(subject?.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        const topSlug=(topic||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        await api.post(`/user/concepts/${subSlug}/${topSlug}`,{concept:newConcept});
      }catch(e){ /* silent */ }
      try{const s=JSON.parse(localStorage.getItem('ls_plan')||'{}');if(d.credits){s.creditsUsed=d.credits.used;s.creditsTotal=d.credits.limit;}else{s.creditsUsed=(s.creditsUsed||0)+1;}localStorage.setItem('ls_plan',JSON.stringify(s));}catch(e){}
      onDone();
    }catch(e){setErr('Backend not responding.');setLoading(false);}
  };

  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:200,background:'rgba(8,8,9,0.88)',backdropFilter:'blur(8px)',animation:'fadeIn .18s ease',display:'flex',alignItems:'flex-start',justifyContent:'center',overflowY:'auto',padding:'5vh 20px 60px'}}>
      <div ref={modalRef} onClick={e=>e.stopPropagation()} style={{background:'#111113',border:'1px solid rgba(123,234,90,0.3)',borderRadius:20,width:'min(60vw,680px)',flexShrink:0,boxShadow:'0 0 80px rgba(123,234,90,0.15)',animation:'fadeUp .22s ease',marginTop:'auto',marginBottom:'auto'}}>
        <div style={{padding:'20px 24px 16px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
            <div>
              <div style={{fontFamily:'monospace',fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:'#7BEA5A',marginBottom:5}}>Add a concept · {topic}</div>
              <div style={{fontSize:17,fontWeight:700,letterSpacing:'-0.02em',color:'#EDEDE8'}}>What do you want to crack?</div>
              <div style={{fontSize:13,color:'#6B6B6B',marginTop:4,fontWeight:300}}>Describe it in a few words — we'll build the full concept card.</div>
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',color:'#6B6B6B',cursor:'pointer',fontSize:18,lineHeight:1,padding:4,flexShrink:0}}>✕</button>
          </div>
        </div>
        <div style={{padding:'20px 24px 24px'}}>
          {!loading&&(
            <>
              <div style={{display:'flex',gap:10}}>
                <input autoFocus value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()}
                  placeholder={`e.g. a concept or question you have about ${topic}…`}
                  style={{flex:1,padding:'12px 16px',borderRadius:10,border:'1px solid rgba(255,255,255,0.1)',background:'rgba(255,255,255,0.04)',color:'#EDEDE8',fontSize:14,fontFamily:'inherit',outline:'none'}}/>
                <button onClick={generate} disabled={!input.trim()} style={{padding:'12px 22px',borderRadius:10,border:'none',background:input.trim()?'#7BEA5A':'rgba(123,234,90,0.2)',color:input.trim()?'#080809':'rgba(123,234,90,0.4)',fontSize:14,fontWeight:700,cursor:input.trim()?'pointer':'not-allowed',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                  Build it →
                </button>
              </div>
              <p style={{fontSize:11,color:'#6B6B6B',marginTop:10,fontFamily:'monospace',letterSpacing:'0.04em'}}>1 credit · generates a full concept card with Know This, For Your Brain + Exam Knowhow</p>
              {err&&<div style={{padding:'12px 14px',borderRadius:10,background:'rgba(255,96,96,.06)',border:'1px solid rgba(255,96,96,.2)',fontSize:13,color:'#FF8080',marginTop:12}}>{err}</div>}
            </>
          )}
          {loading&&(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16,padding:'40px 0'}}>
              <div style={{display:'flex',gap:5}}>{[0,1,2].map(i=><div key={i} style={{width:7,height:7,borderRadius:'50%',background:'#7BEA5A',animation:`pulse3 1.2s ease ${i*.2}s infinite`}}/>)}</div>
              <div style={{fontSize:13,color:'#6B6B6B',fontWeight:300}}>Building your concept card…</div>
              <div style={{fontSize:11,color:'rgba(123,234,90,0.5)',fontFamily:'monospace',marginTop:4}}>Know This · For Your Brain · Exam Knowhow</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Auditory Digital concept mode ───────────────────── */
function AdConceptMode({concept,tc,onComplete}){
  const[phase,setPhase]=useState('read'); // read | speak | done
  const[transcript,setTranscript]=useState('');
  const[listening,setListening]=useState(false);
  const recRef=useRef(null);

  const startListening=()=>{
    if(!window.webkitSpeechRecognition&&!window.SpeechRecognition){
      setPhase('type'); return;
    }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();
    rec.continuous=true;rec.interimResults=true;
    rec.onresult=(e)=>{
      const t=Array.from(e.results).map(r=>r[0].transcript).join('');
      setTranscript(t);
    };
    rec.onend=()=>{setListening(false);if(transcript.length>10)setPhase('done');};
    rec.start();
    recRef.current=rec;
    setListening(true);
  };
  const stopListening=()=>{recRef.current?.stop();setListening(false);if(transcript.length>10)setPhase('done');};
  useEffect(()=>()=>recRef.current?.stop(),[]);

  return(
    <div style={{background:C.s2,border:`1px solid ${C.b1}`,borderRadius:10,padding:"16px",marginBottom:14}}>
      <p style={{fontSize:11,fontWeight:700,color:"#FF6B47",margin:"0 0 10px",letterSpacing:"0.08em",textTransform:"uppercase"}}>Talk it out</p>

      {/* Phase 1: Read */}
      <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:8,padding:"12px 14px",marginBottom:12}}>
        <p style={{fontSize:11,color:C.muted,margin:"0 0 6px",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>Read this</p>
        <p style={{fontSize:14,color:C.text,margin:0,lineHeight:1.7,fontWeight:300}}>{concept.explanation}</p>
      </div>

      {/* Phase 2: Speak back */}
      {phase==='read'&&(
        <button onClick={()=>setPhase('speak')}
          style={{width:"100%",padding:"10px",borderRadius:8,border:`1px solid ${"#FF6B47"}40`,background:"rgba(255,107,71,0.08)",color:"#FF6B47",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
          Got it — now explain it back →
        </button>
      )}
      {(phase==='speak'||phase==='type')&&(
        <div>
          <p style={{fontSize:12,color:C.muted,margin:"0 0 10px",fontWeight:300}}>
            Now explain {concept.title} in your own words — as if teaching a friend.
          </p>
          {phase==='speak'?(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={listening?stopListening:startListening}
                style={{display:"flex",alignItems:"center",gap:6,padding:"10px 18px",borderRadius:8,border:"none",background:listening?"#FF6B47":"rgba(255,107,71,0.15)",color:listening?"#080809":"#FF6B47",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all .2s"}}>
                {listening?"⏹ Stop":"🎤 Start speaking"}
              </button>
              <button onClick={()=>setPhase('type')} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:12,fontFamily:"inherit",padding:"4px 8px"}}>
                Type instead
              </button>
            </div>
          ):(
            <div style={{display:"flex",gap:8}}>
              <input value={transcript} onChange={e=>setTranscript(e.target.value)}
                placeholder="Type your explanation…"
                style={{flex:1,padding:"9px 12px",borderRadius:8,border:`1px solid ${C.b1}`,background:C.s1,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none",fontWeight:300}}/>
              <button onClick={()=>transcript.trim()&&setPhase('done')}
                style={{padding:"9px 16px",borderRadius:8,border:"none",background:"#FF6B47",color:"#080809",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                Done →
              </button>
            </div>
          )}
          {transcript&&<p style={{fontSize:12,color:C.muted,margin:"8px 0 0",fontStyle:"italic",fontWeight:300}}>Heard: {transcript}</p>}
        </div>
      )}
      {phase==='done'&&(
        <div style={{display:"flex",alignItems:"flex-start",gap:8,padding:"10px 14px",background:"rgba(255,107,71,0.08)",border:"1px solid rgba(255,107,71,0.25)",borderRadius:8}}>
          <span style={{fontSize:16}}>🎤</span>
          <div>
            <p style={{fontSize:12,fontWeight:600,color:"#FF6B47",margin:"0 0 3px"}}>Your explanation captured</p>
            <p style={{fontSize:13,color:C.text,margin:0,fontWeight:300,fontStyle:"italic"}}>{transcript}</p>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Review & Test panel ─────────────────────────────── */
function ReviewPanel({lessonData,type,neuro,subject,topic,repStyleMode,tc,onClose}){
  /* Correct and incorrect must not be the subject accent: on a pink or red
   subject an accent "correct" reads as decoration, or worse, as a warning.
   Verdict colours stay fixed across every subject. */
  const RIGHT_GREEN='#4ADE80';
  const[quizData,setQuizData]=useState(null);
  const[loading,setLoading]=useState(false);
  const[answers,setAnswers]=useState({});
  const[checked,setChecked]=useState(false);
  const[adInput,setAdInput]=useState('');
  const[adMsgs,setAdMsgs]=useState([]);
  const[adLoading,setAdLoading]=useState(false);
  const adEndRef=useRef(null);

  const generateQuiz=()=>{
    setLoading(true);
    const modeInstructions={
      visual:'Create 3 multiple-choice questions where options reference visual/diagrammatic concepts. Frame questions around "which diagram shows...", "what does this structure represent..."',
      auditory:'Create 3 questions that test auditory/conceptual understanding. Frame as if explaining aloud.',
      kinesthetic:'Create 3 practical application questions. Frame as "what would happen if...", "how would you apply..."',
      ad:'Create 3 open-ended discussion questions that require the student to reason through their answer. Frame as "explain why...", "walk me through..."',
    };
    const prompt="Create a quiz for "+topic+" in "+subject.name+" for Type "+type.num+" learner.\n"+
      (modeInstructions[repStyleMode]||modeInstructions.visual)+"\n"+
      "Return ONLY this format:\n"+
      "Q1: [question]\nA: [option 1]\nB: [option 2]\nC: [option 3]\nD: [option 4]\nANSWER: [A/B/C/D]\nEXPLAIN: [why correct]\n"+
      "Q2: [question]\nA: [option]\nB: [option]\nC: [option]\nD: [option]\nANSWER: [A/B/C/D]\nEXPLAIN: [why]\n"+
      "Q3: [question]\nA: [option]\nB: [option]\nC: [option]\nD: [option]\nANSWER: [A/B/C/D]\nEXPLAIN: [why]\n"+
      "Use REAL Year 12 "+subject.name+" content.";
    api.post("/ai/chat",{system:"Year 12 tutor creating curriculum-accurate quizzes.",messages:[{role:"user",content:prompt}],max_tokens:800})
      .then(d=>{
        const text=d.text||"";
        const qs=[];
        const blocks=text.split(/Q\d+:/).filter(b=>b.trim());
        blocks.forEach((block,i)=>{
          const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);
          const q={id:'q'+(i+1),question:'',options:{},answer:'',explain:''};
          lines.forEach(l=>{
            if(!q.question&&!l.match(/^[ABCD]:|ANSWER:|EXPLAIN:/))q.question=l;
            else if(l.match(/^A:/))q.options.A=l.slice(2).trim();
            else if(l.match(/^B:/))q.options.B=l.slice(2).trim();
            else if(l.match(/^C:/))q.options.C=l.slice(2).trim();
            else if(l.match(/^D:/))q.options.D=l.slice(2).trim();
            else if(l.match(/^ANSWER:/))q.answer=l.slice(7).trim();
            else if(l.match(/^EXPLAIN:/))q.explain=l.slice(8).trim();
          });
          if(q.question&&q.options.A)qs.push(q);
        });
        setQuizData(qs.length>0?qs:null);
        setLoading(false);
      }).catch(()=>setLoading(false));
  };

  const sendAd=async()=>{
    if(!adInput.trim()||adLoading)return;
    const um={role:"user",content:adInput};
    const nm=[...adMsgs,um];
    setAdMsgs(nm);setAdInput('');setAdLoading(true);if(nm.length>=3&&onComplete)setTimeout(()=>onComplete(),100);
    const sys="You are evaluating a Year 12 student explaining "+topic+". Give encouraging, specific feedback on accuracy and depth. Correct any misconceptions.";

/* ── QuickQuestion — inline single-question knowledge check ─────────
   Generates one MCQ on-demand for a concept. Shows inline under the
   concept card, no navigation. Correct answer marks concept as done. */
function QuickQuestion({concept,type,subject,topic,tc,onClose,onCorrect}){
  const[q,setQ]=useState(null);
  const[selected,setSelected]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const sys=`Year 12 ${subject.name} tutor. Generate exactly ONE multiple-choice question testing understanding of the concept provided. Return valid JSON only, no markdown: {"question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"answer":0} where answer is the 0-based index of the correct option. Make it exam-style, appropriately challenging for Year 12.`;
    const prompt=`Concept: ${concept.title}\nContent: ${concept.explanation}\nGenerate one MCQ testing genuine understanding (not just recall).`;
    api.post("/ai/chat",{system:sys,messages:[{role:"user",content:prompt}],max_tokens:400})
      .then(d=>{
        try{
          const raw=(d.text||"").replace(/```json?|```/g,"").trim();
          setQ(JSON.parse(raw));
        }catch{setQ({question:"Could not generate question. Try asking a question instead.",options:[],answer:-1});}
        setLoading(false);
      }).catch(()=>{setLoading(false);});
  },[concept.title]);

  const handleSelect=(idx)=>{
    if(selected!==null)return;
    setSelected(idx);
    gapLog(subject?.id,topic,idx===q?.answer?'right':'wrong');
    if(idx===q?.answer)setTimeout(onCorrect,1200);
  };

  const isCorrect=selected===q?.answer;
  const isWrong=selected!==null&&!isCorrect;

  return(
    <div style={{background:C.s2,border:`1px solid ${tc}30`,borderRadius:12,padding:"20px",marginBottom:14,marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <p style={{fontSize:11,fontWeight:700,color:tc,margin:0,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"'JetBrains Mono',monospace"}}>Quick check</p>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16,lineHeight:1,padding:2}}>✕</button>
      </div>
      {loading?(
        <LoadingState tc={tc} compact/>
      ):q&&(
        <>
          <p style={{fontSize:15,color:C.text,margin:"0 0 16px",lineHeight:1.6,fontWeight:400}}>{q.question}</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {(q.options||[]).map((opt,idx)=>{
              const isThis=selected===idx;
              const correct=idx===q.answer&&selected!==null;
              const wrong=isThis&&isWrong;
              return(
                <button key={idx} onClick={()=>handleSelect(idx)} disabled={selected!==null}
                  style={{textAlign:"left",padding:"12px 16px",borderRadius:9,border:`1px solid ${correct?"#4ade80":wrong?"#f87171":isThis?tc:C.b2}`,
                    background:correct?"rgba(74,222,128,0.1)":wrong?"rgba(248,113,113,0.1)":isThis?`${tc}12`:"transparent",
                    color:correct?"#4ade80":wrong?"#f87171":C.text,
                    fontSize:14,fontWeight:isThis?600:400,cursor:selected!==null?"default":"pointer",fontFamily:"inherit",transition:"all .2s"}}>
                  {opt}
                </button>
              );
            })}
          </div>
          {selected!==null&&(
            <p style={{fontSize:13,color:isCorrect?"#4ade80":"#f87171",margin:"12px 0 0",fontWeight:600,textAlign:"center"}}>
              {isCorrect?"Correct! Marking concept as understood ✓":"Not quite — review the concept and try again"}
            </p>
          )}
        </>
      )}
    </div>
  );
}

function getUnstuckOptions(type,repStyle,neuro){
  const typeNum=type?.num;
  const base=[
    {id:'analogy',emoji:'🌍',label:'Real-world analogy',desc:"Show me this concept in everyday life"},
    {id:'simple',emoji:'✂️',label:'Strip it back',desc:"Explain it like I'm 12. No jargon."},
    {id:'visual',emoji:'🎨',label:'Draw it out',desc:"A visual diagram of the concept"},
    {id:'steps',emoji:'🪜',label:'Step by step',desc:"Walk me through it one piece at a time"},
    {id:'goat',emoji:'🐐',label:'Goat mode',desc:"Explain it like a chaotic goat video — unhinged but it actually sticks"},
  ];
  const typeExtras={1:{id:'precise',emoji:'📐',label:'The exact mechanism',desc:'Precise, technically correct version'},2:{id:'story',emoji:'💬',label:'Tell me a story',desc:'Explain through people and relationships'},3:{id:'exam',emoji:'🏆',label:'How this gets marks',desc:"What do I need for the exam?"},4:{id:'meaning',emoji:'🎭',label:'Why does this exist?',desc:'Deeper meaning and context'},5:{id:'deep',emoji:'🔬',label:'Go deep',desc:"Full detail, all the layers"},6:{id:'map',emoji:'🗺️',label:'Show me the full map',desc:'How does this connect to everything?'},7:{id:'wild',emoji:'🎲',label:'Wildcard connection',desc:'Connect this to something unexpected'},8:{id:'blunt',emoji:'💥',label:'Just be blunt',desc:"What's the actual point?"},9:{id:'calm',emoji:'🌊',label:'Slow and gentle',desc:'One idea, then the next.'}};
  const repExtra=repStyle==='kinesthetic'?{id:'try',emoji:'🛠️',label:'Give me something to do',desc:'An activity or problem to try'}:repStyle==='auditory_digital'?{id:'logic',emoji:'🧮',label:'Walk me through the logic',desc:'Reason it out step by step'}:repStyle==='auditory'?{id:'spoken',emoji:'🎙️',label:'Talk me through it',desc:'Conversational, like a podcast'}:null;
  const hasADHD=neuro?.id?.includes('adhd'),hasASD=neuro?.id?.includes('asd')||neuro?.id==='2e';
  const neuroExtra=hasADHD?{id:'short',emoji:'⚡',label:'30-second version',desc:'Fast, punchy, one key thing'}:hasASD?{id:'rules',emoji:'📋',label:'Give me the rules',desc:'Explicit patterns, clear structure'}:null;
  return[...base,...[typeExtras[typeNum],repExtra,neuroExtra].filter(Boolean)];
}
function getUnstuckQuestion(type){
  const m={1:"What would help you get this right?",2:"How should I connect this to something meaningful?",3:"What angle gets you there fastest?",4:"What kind of explanation would make this click?",5:"How deep do you want to go?",6:"What would help you feel solid on this?",7:"What spin would make this interesting?",8:"How do you want me to break this down?",9:"What pace works best right now?"};
  return m[type?.num]||"How would you like me to explain this?";
}

              {diagramText&&(()=>{let diag=null;try{diag=JSON.parse(diagramText);}catch(e){}if(!diag?.nodes)return null;const nodes=diag.nodes||[],edges=diag.edges||[];const NW=185,NH=54,PX=185,PY=96,OX=100,OY=29;const totalW=NW+OX*2+80,totalH=nodes.length*PY+OY*2;const pos={};nodes.forEach((n,i)=>{pos[n.id]={x:OX+NW/2,y:OY+i*PY+NH/2};});return(<div style={{marginBottom:14,borderRadius:12,background:'rgba(0,0,0,0.35)',border:`1px solid ${tc}20`,padding:'16px',display:'flex',justifyContent:'center'}}><svg width={totalW} height={totalH} viewBox={`0 0 ${totalW} ${totalH}`} style={{display:'block',maxWidth:'100%'}}><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 z" fill={tc}/></marker></defs>{edges.map((e,i)=>{const fi=nodes.findIndex(n=>n.id===e.from),ti=nodes.findIndex(n=>n.id===e.to);const f=pos[e.from],t=pos[e.to];if(!f||!t)return null;const adj=Math.abs(fi-ti)===1,down=ti>fi;let pathD,mx,my;if(adj){const sy=f.y+(down?NH/2:-NH/2),ey=t.y+(down?-NH/2:NH/2);pathD=`M${f.x},${sy} L${f.x},${ey}`;mx=f.x+8;my=(sy+ey)/2;}else{const sy=f.y,ey=t.y,skip=Math.abs(fi-ti),useRight=(skip%2===0),margin=30+skip*18;const rx=useRight?f.x+NW/2+margin:f.x-NW/2-margin;const side=useRight?f.x+NW/2:f.x-NW/2,tside=useRight?t.x+NW/2:t.x-NW/2;pathD=`M${side},${sy} C${rx},${sy} ${rx},${ey} ${tside},${ey}`;mx=rx+(useRight?18:-18);my=(sy+ey)/2;}return(<g key={i}><path d={pathD} fill="none" stroke={tc} strokeWidth="1.5" strokeOpacity="0.7" markerEnd="url(#arr)"/>{e.label&&<g><rect x={mx-e.label.length*3-6} y={my-9} width={e.label.length*6+12} height={16} rx="8" fill={tc} opacity="0.9"/><text x={mx} y={my+2} textAnchor="middle" fill="#080809" fontSize="9" fontWeight="600">{e.label}</text></g>}</g>);})}){nodes.map(n=>{const p=pos[n.id];return(<g key={n.id}><rect x={p.x-NW/2} y={p.y-NH/2} width={NW} height={NH} rx="10" fill={`${tc}12`} stroke={tc} strokeWidth="1.5" strokeOpacity="0.8"/><text x={p.x} y={p.y-(n.sub?7:3)} textAnchor="middle" fill="#FFFFFF" fontSize="11" fontWeight="700">{n.label}</text>{n.sub&&<text x={p.x} y={p.y+9} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="9">{n.sub}</text>}</g>);})})</svg></div>);})()}
              {(resultOpt!=='visual'||!diagramText)&&<div style={{fontSize:13,lineHeight:1.75,color:'#EDECE8',fontWeight:300,marginBottom:gifQuery?14:18}} dangerouslySetInnerHTML={{__html:fmt(cleanResult)||''}}/>}
              {gifQuery&&<GiphyGif query={gifQuery} tc={tc}/>}
              <div style={{display:'flex',gap:8,marginTop:18}}>
                <button onClick={reset} style={{flex:1,padding:'11px',borderRadius:10,border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:'#6B6B6B',fontSize:13,fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>← Try another angle</button>
                <button onClick={onClose} style={{flex:1,padding:'11px',borderRadius:10,border:'none',background:tc,color:'#080809',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Got it ✓</button>
              </div>
            </>);
          })()}
          {err&&<div style={{padding:'12px 14px',borderRadius:10,background:'rgba(255,96,96,.06)',border:'1px solid rgba(255,96,96,.2)',fontSize:13,color:'#FF8080'}}>{err}</div>}
        </div>
