/* ── Scroll-triggered float-in wrapper ──────────────── */
function ScrollFloat({children,style}){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting)setVisible(true);
    },{threshold:0.15});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return(
    <div ref={ref} style={{
      ...style,
      opacity:visible?1:0,
      transform:visible?"translateY(0)":"translateY(40px)",
      transition:"opacity .8s cubic-bezier(.22,.61,.36,1), transform .8s cubic-bezier(.22,.61,.36,1)",
    }}>
      {children}
    </div>
  );
}

/* ── Parallax layer — moves slower than scroll ────────── */
function ParallaxLayer({children,speed=0.3,style}){
  const ref=useRef(null);
  const[offset,setOffset]=useState(0);
  useEffect(()=>{
    const onScroll=()=>{
      const el=ref.current?.parentElement;
      if(!el)return;
      const rect=el.getBoundingClientRect();
      // offset based on how far the parent has scrolled past viewport top
      setOffset(-rect.top*speed);
    };
    window.addEventListener("scroll",onScroll,{passive:true});
    onScroll();
    return()=>window.removeEventListener("scroll",onScroll);
  },[speed]);
  return(
    <div ref={ref} style={{...style,transform:`translateY(${offset}px)`,willChange:"transform"}}>
      {children}
    </div>
  );
}

/* ── Horizontal text reveal — slides in from left with clip ──────── */
function ScrollRevealH({children,style,duration=0.9}){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting)setVisible(true);
    },{threshold:0.2});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return(
    <div ref={ref} style={{...style,overflow:"hidden"}}>
      <div style={{
        transform:visible?"translateX(0)":"translateX(-80px)",
        opacity:visible?1:0,
        transition:`transform ${duration}s cubic-bezier(.16,1,.3,1), opacity ${duration}s ease`,
      }}>
        {children}
      </div>
    </div>
  );
}

/* ── Simple fade-in ───────────────────────────────────────────────── */
function ScrollFade({children,style}){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting)setVisible(true);
    },{threshold:0.15});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return(

    </div>

}

/* ── Stagger reveal — children fade up one after another ──────────── */
function ScrollStagger({children,style,gap=80}){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting)setVisible(true);
    },{threshold:0});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  const items=React.Children.toArray(children);
  return(
    <div ref={ref} style={style}>
      {items.map((child,i)=>(
        <div key={i} style={{
          opacity:visible?1:0,
          transform:visible?"translateY(0)":"translateY(32px)",
          transition:`opacity .7s cubic-bezier(.22,.61,.36,1) ${Math.min(i*gap,600)}ms, transform .7s cubic-bezier(.22,.61,.36,1) ${Math.min(i*gap,600)}ms`,
        }}>
          {child}
        </div>
      ))}
    </div>
  );
}

/* ── Sticky shrinking header ──────────────────────────────────────────
   fullContent: shown full-screen, scrolls away normally
   barContent: becomes sticky (pinned under global nav) once the full
   content has scrolled past, and STAYS pinned for the rest of `children`
   (e.g. the entire concepts section below) ─────────────────────────── */
   function hexToRgb(hex){
  const h=hex.replace('#','');
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}

/* ── SubjectBloomCanvas ─────────────────────────────────────
   Signature bloom: a phyllotaxis seed-head of dust assembles
   from a scatter, breathes, then fully disintegrates (ash
   rising) before reforming. Each subject grows into its own
   polar silhouette. Colour is driven by the app palette (tc),
   not the bloom module's own — one palette, one source.
   Design: Animal. Port: vanilla canvas, no deps.
──────────────────────────────────────────────────────────── */

// App subject id -> bloom signature key (two ids differ)
const BLOOM_ALIAS={'phys-ed':'physical-ed','history-revolutions':'modern-history'};

// arms / skew per signature — controls the fine ripple + spiral offset
const BLOOM_ARMS={
  'biology':[5,0.34],'chemistry':[6,0.28],'physics':[3,0.50],'psychology':[7,0.22],
  'foundation-maths':[4,0.40],'general-maths':[4,0.36],'maths-methods':[6,0.30],
  'specialist-maths':[8,0.24],'english':[5,0.44],'modern-history':[9,0.18],
  'geography':[6,0.32],'economics':[5,0.38],'business-management':[6,0.26],
  'accounting':[4,0.30],'health-hd':[5,0.42],'physical-ed':[3,0.46],'visual-comm':[7,0.36],
};

// Polar signature: radius multiplier per angle. This is the silhouette.
const BLOOM_ENV={
  'biology':function(a){return 1+0.24*Math.sin(2*a)+0.07*Math.sin(6*a);},
  'chemistry':function(a){var m=((a%1.0472)+1.0472)%1.0472;return 0.866/Math.cos(m-0.5236);},
  'physics':function(a){return 1+0.30*Math.cos(3*a);},
  'psychology':function(a){return 1+0.15*Math.sin(3*a+0.6)+0.13*Math.sin(5*a);},
  'foundation-maths':function(a){return 1+0.24*Math.cos(4*a);},
  'general-maths':function(a){return 1+0.22*Math.cos(5*a);},
  'maths-methods':function(a){return 1+0.28*Math.cos(6*a);},
  'specialist-maths':function(a){return 1+0.30*Math.cos(8*a);},
  'english':function(a){return 1+0.26*Math.cos(2*a)+0.13*Math.cos(a);},
  'modern-history':function(a){return 1+0.08*Math.cos(12*a);},
  'geography':function(a){return 1+0.14*Math.sin(3*a)+0.10*Math.sin(7*a+1.2);},
  'economics':function(a){return 1+0.28*Math.cos(a-0.9);},
  'business-management':function(a){return 0.94+0.14*Math.pow(Math.abs(Math.cos(5*a)),0.35);},
  'accounting':function(a){return 0.9+0.3*Math.pow(Math.abs(Math.cos(a)),1.6);},
  'health-hd':function(a){return 0.95-0.42*Math.cos(a+Math.PI/2);},
  'physical-ed':function(a){return 0.92+0.32*Math.abs(Math.sin(1.5*a));},
  'visual-comm':function(a){return 0.82/Math.pow(Math.pow(Math.abs(Math.cos(a)),3.2)+Math.pow(Math.abs(Math.sin(a)),3.2),1/3.2);},
};

// ── Tuning. Retuned from the 240px banner spec for a 100dvh hero. ──
const BLOOM_OPTS={
  intensity:0.72,   // overall alpha
  cycle:17,         // seconds: assemble -> hold -> dissolve -> empty
  anchor:0.50,      // mark centre, fraction of width
  vAnchor:0.64,     // mark centre, fraction of height (lower third)
  scale:0.66,       // mark size / hero height
  grain:1.05,       // particle size
  density:1.5,      // particle count multiplier (base 1500)
  coreFade:0.10,    // dim grains near the centre (0 = off)
  // ── phase timing, as fractions of one cycle ──
  stagger:0.07,     // spread of per-grain start delays (was 0.15 — lower = snappier)
  fill:0.20,        // assemble ramp length (was 0.26)
  hold:0.68,        // point at which disintegration begins
};

function SubjectBloomCanvas({subjectId,tc}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current;if(!cv||!cv.getContext)return;
    const key=BLOOM_ALIAS[subjectId]||subjectId;
    const envFn=BLOOM_ENV[key]||BLOOM_ENV['biology'];
    const arm=BLOOM_ARMS[key]||BLOOM_ARMS['biology'];
    const ARMS=arm[0],SKEW=arm[1];

    const hx=(tc||'#5AADD4').replace('#','');
    const nn=parseInt(hx,16)||0;
    const col={r:(nn>>16)&255,g:(nn>>8)&255,b:nn&255};

    const O=BLOOM_OPTS;
    const GOLDEN=2.39996;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    const clamp=(v)=>v<0?0:v>1?1:v;
    const ease=(v)=>{v=clamp(v);return v*v*(3-2*v);};
    const env=(a)=>{const f=envFn(a);return f<0.45?0.45:f>1.4?1.4:f;};

    let W=0,H=0,cx=0,cy=0,s=0,P=[],lastCt=0;
    const t0=performance.now();let raf=0,last=0;

    function build(){
      const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
      W=r.width;H=r.height;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      cx=W*O.anchor;cy=H*O.vAnchor;s=H*O.scale;
      const N=Math.round(1500*O.density),R=s*0.52;
      P=[];
      for(let i=0;i<N;i++){
        const f=(i+0.5)/N;
        const a=i*GOLDEN*(1+SKEW*0.04);
        const rad=Math.sqrt(f)*R*env(a)*(0.97+0.03*Math.sin(a*ARMS));
        const x=Math.cos(a)*rad,y=Math.sin(a)*rad*0.84;
        const bx=cx+x,by=cy+y;
        const sw=clamp(bx/W)*0.66+clamp(1-by/H)*0.34;
        const ang=Math.atan2(y,x)+(Math.random()-0.5)*1.1;
        const out=s*(0.5+Math.random()*0.7);
        P.push({
          bx0:bx,by0:by,ang:Math.atan2(y,x),rad:Math.sqrt(x*x+y*y),rf:f,
          seed:Math.random(),acc:i%19===0,
          fd:(1-sw)*O.stagger+Math.random()*0.02,
          bd:sw*0.14+Math.random()*0.02,
          sx:bx+(Math.random()-0.5)*W*0.9,
          sy:cy+(Math.random()-0.5)*H*1.7,
          ex:bx+Math.cos(ang)*out,
          ey:by+Math.sin(ang)*out*0.8,
        });
      }
    }

    function target(p,t,f){
      const a=p.ang+t*0.045*f+f*0.12*Math.sin(t*0.6+p.rf*3);
      const r=p.rad*(1+0.035*f*Math.sin(t*1.0-p.rf*4));
      return[cx+Math.cos(a)*r,cy+Math.sin(a)*r*0.9];
    }

    function frame(now){
      raf=requestAnimationFrame(frame);
      if(now-last<36)return;last=now;
      const rc=cv.getBoundingClientRect();
      if(!rc.width)return;
      if(rc.bottom<-80||rc.top>window.innerHeight+80)return;
      if(Math.abs(rc.width-W)>0.5||Math.abs(rc.height-H)>0.5||!P.length){build();if(!P.length)return;}

      const t=(now-t0)/1000;
      const ct=(t%O.cycle)/O.cycle;
      const FS=0,FD=O.fill,HOLD=O.hold,BS=O.hold,BD=0.15;
      if(ct<lastCt)for(let q=0;q<P.length;q++){
        P[q].sx=P[q].bx0+(Math.random()-0.5)*W*0.9;
        P[q].sy=cy+(Math.random()-0.5)*H*1.7;
      }
      lastCt=ct;
      const ring=((t*0.18)%1.5);

      const ctx=cv.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';

      for(let i=0;i<P.length;i++){
        const p=P[i];let x,y,alpha,formed;
        if(reduce){const tr=target(p,0,1);x=tr[0];y=tr[1];alpha=1;formed=1;}
        else if(ct<HOLD){
          const fp=clamp((ct-FS-p.fd)/FD);formed=ease(fp);
          const tA=target(p,t,formed);
          x=p.sx+(tA[0]-p.sx)*formed;y=p.sy+(tA[1]-p.sy)*formed;
          alpha=clamp(fp*1.3);
          const tb=(1-formed)*H*0.10;
          x+=Math.sin(t*0.9+p.seed*30)*tb;y+=Math.cos(t*1.1+p.seed*24)*tb;
        }else{
          const bp=clamp((ct-BS-p.bd)/BD),g=ease(bp);formed=1;
          const tB=target(p,t,1);
          x=tB[0]+(p.ex-tB[0])*g;y=tB[1]+(p.ey-tB[1])*g;
          const tb2=g*H*0.14;
          x+=Math.sin(t*1.0+p.seed*30)*tb2;
          y+=Math.cos(t*1.3+p.seed*25)*tb2-g*g*H*0.22;
          alpha=Math.pow(1-g,1.4)*(1-ease((ct-0.92)/0.08));
        }
        x+=Math.sin(t*0.7+p.seed*6.28)*H*0.004;
        y+=Math.cos(t*0.6+p.seed*6.28)*H*0.004;

        const dr=Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))/(s*0.55);
        const hl=Math.exp(-Math.pow(dr-ring,2)/0.012);
        const tw=0.6+0.4*Math.sin(t*1.2+p.seed*6.28);

        let cr=col.r,cg=col.g,cb=col.b;
        if(p.acc){cr+=(255-cr)*0.6;cg+=(255-cg)*0.6;cb+=(255-cb)*0.6;}
        cr+=(255-cr)*hl*0.5;cg+=(255-cg)*hl*0.5;cb+=(255-cb)*hl*0.5;

        let a=(p.acc?1.4:1.0)*(0.6+0.4*tw)*(0.8+0.5*hl)*alpha*O.intensity;
        // dim the middle so the headline reads over it
        if(O.coreFade>0)a*=(1-O.coreFade)+O.coreFade*clamp(dr/0.9);
        if(a>0.8)a=0.8;
        if(a<=0.007)continue;
        const sz=(p.acc?1.45:1.0)*O.grain*(1+0.4*hl)*(0.6+0.4*formed);
        ctx.fillStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+','+a.toFixed(3)+')';
        ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
      }
      ctx.globalCompositeOperation='source-over';
    }

    build();
    const onResize=()=>build();
    window.addEventListener('resize',onResize);
    raf=requestAnimationFrame(frame);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);};
  },[subjectId,tc]);

  return <canvas ref={ref} aria-hidden="true" style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',pointerEvents:'none',zIndex:0}}/>;
}

function FlowFieldCanvas({tc}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current;if(!cv)return;
    const[r,g,b]=hexToRgb(tc);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    let ps=[],W=0,H=0,t=0,last=performance.now(),raf;
    const m={x:-999,y:-999,inside:false};
    function noise(x,y,t){return Math.sin(x*1.7+t)*0.6+Math.sin(y*1.9-t*0.8)*0.6+Math.sin((x+y)*1.3+t*0.5)*0.5+Math.sin((x-y)*0.9-t*0.3)*0.4;}
    function reset(){ps=[];for(let i=0;i<460;i++)ps.push({x:Math.random()*W,y:Math.random()*H});}
    function resize(){const rc=cv.getBoundingClientRect();W=rc.width;H=rc.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(ps.length===0)reset();}
    function onMove(e){const rc=cv.getBoundingClientRect();m.x=e.clientX-rc.left;m.y=e.clientY-rc.top;m.inside=true;} function onLeave(){m.inside=false;m.x=-999;m.y=-999;} window.addEventListener('mousemove',onMove);window.addEventListener('mouseleave',onLeave);
    
    window.addEventListener('resize',resize);resize();
    function loop(now){
      const dt=Math.min((now-last)/1000,0.05);last=now;t+=dt;
      const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='rgba(8,10,15,0.06)';ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=`rgba(${r},${g},${b},0.85)`;ctx.lineWidth=1;ctx.beginPath();
      for(const p of ps){
        const a=noise(p.x*0.012,p.y*0.012,t*0.25)*Math.PI*2;
        let vx=Math.cos(a)*22,vy=Math.sin(a)*22;
        if(m.inside){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<95&&d>0.1){vx+=dx/d*70;vy+=dy/d*70;}}
        const nx=p.x+vx*dt,ny=p.y+vy*dt;
        ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);
        p.x=nx;p.y=ny;
        if(p.x<0||p.x>W||p.y<0||p.y>H||Math.random()<0.003){p.x=Math.random()*W;p.y=Math.random()*H;}
      }
      ctx.stroke();ctx.globalCompositeOperation='source-over';
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseleave',onLeave);};
  },[tc]);
  return <canvas ref={ref} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',pointerEvents:'auto',zIndex:0,opacity:0.7}}/>;
}

function ConvergenceCanvas({tc}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current;if(!cv)return;
    const[r,g,b]=hexToRgb(tc);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const M=72;let P=null,raf,W=0,H=0,t=0,last=performance.now();
    function build(){
      P=[];
      for(let i=0;i<M;i++){
        const a=i/M*Math.PI*2*3.0,rr=56+20*Math.sin(i*1.7);
        P.push({hx:22+Math.random()*(W-44),hy:20+Math.random()*(H-40),a,r:rr});
      }
    }
    function resize(){
      const rc=cv.getBoundingClientRect();
      W=rc.width;H=rc.height;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      P=null;
    }
    window.addEventListener('resize',resize);resize();
    function loop(now){
      const dt=Math.min((now-last)/1000,0.05);last=now;t+=dt;
      if(!W)return raf=requestAnimationFrame(loop);
      const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
      if(!P)build();
      ctx.clearRect(0,0,W,H);
      const cx=W*0.72,cy=H*0.5;
      const conv=Math.pow((Math.sin(t*0.42)*0.5+0.5),1.4);
      const rot=t*0.25;
      const pts=P.map(p=>{
        const tx=cx+Math.cos(p.a+rot)*p.r*(0.55+0.45*conv);
        const ty=cy+Math.sin(p.a+rot)*p.r*(0.55+0.45*conv);
        return[p.hx+(tx-p.hx)*conv,p.hy+(ty-p.hy)*conv];
      });
      ctx.save();ctx.globalCompositeOperation='lighter';
      if(conv>0.45){
        const al=(conv-0.45)/0.55;
        const D=48;
        ctx.strokeStyle=`rgba(${r},${g},${b},1)`;ctx.lineWidth=1;
        for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
          const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1],d2=dx*dx+dy*dy;
          if(d2<D*D){ctx.globalAlpha=al*(1-Math.sqrt(d2)/D)*0.5;ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[j][0],pts[j][1]);ctx.stroke();}
        }
        ctx.globalAlpha=1;
      }
      if(conv>0.6){
        const al=(conv-0.6)/0.4*0.55;
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,90);
        grd.addColorStop(0,`rgba(${r},${g},${b},${al})`);
        grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
      }
      for(let i=0;i<pts.length;i++){
        const gl=ctx.createRadialGradient(pts[i][0],pts[i][1],0,pts[i][0],pts[i][1],5);
        gl.addColorStop(0,`rgba(${r},${g},${b},${0.7+0.3*conv})`);
        gl.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=gl;ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],5,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
      const vig=ctx.createRadialGradient(cx,cy,H*0.2,cx,cy,H*0.95);
      vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.45)');
      ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
  },[tc]);
  return <canvas ref={ref} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',pointerEvents:'auto',zIndex:0,opacity:1}}/>;
}
function ShrinkHeader({fullContent,barContent,barBackground,tc,children,heroHeight="100dvh"}){
  const bpSH=useBreakpoint();
  const heroRef=useRef(null);
  const[stuck,setStuck]=useState(false);
  const[heroProgress,setHeroProgress]=useState(0); // 0=full visible,1=fully scrolled past

  useEffect(()=>{
    const onScroll=()=>{
      const el=heroRef.current;
      if(!el)return;
      const rect=el.getBoundingClientRect();
      // hero progress: 0 when top of hero at top of viewport, 1 when bottom of hero reaches top
      const total=rect.height;
      const p=Math.min(Math.max(-rect.top/total,0),1);
      setHeroProgress(p);
      setStuck(rect.bottom<=54);
    };
    window.addEventListener("scroll",onScroll,{passive:true});
    onScroll();
    return()=>window.removeEventListener("scroll",onScroll);
  },[]);

  return(
    <div style={{position:"relative"}}>
      {/* Full-screen hero — normal flow */}
      <div ref={heroRef} style={{position:"relative",height:heroHeight,overflow:"hidden",background:`${tc||'#7BEA5A'}CC`,backdropFilter:'blur(16px)',borderBottom:`1px solid ${tc||'#7BEA5A'}44`,margin:"0 calc(-50vw + 50%)",width:"100vw"}}>
       <ConvergenceCanvas tc={tc||'#7BEA5A'}/>
        <div style={{position:"absolute",inset:0,opacity:1-Math.min(heroProgress*2.5,1),display:"flex",alignItems:"center"}}>
          {fullContent}
        </div>
      </div>

      {/* Sticky bar — pinned once hero scrolls past, stays pinned through children */}
      <div data-kn-chrome="stickybar" style={{
        position:"sticky",top:bpSH==="mobile"?54:52,zIndex:30,
        height:64,
        marginTop:-64, /* overlap so bar appears right as hero ends */
        marginLeft:"calc(-50vw + 50%)",marginRight:"calc(-50vw + 50%)",
        width:"100vw",
        background:`${tc||'#7BEA5A'}CC`,backdropFilter:'blur(16px)',borderBottom:`1px solid ${tc||'#7BEA5A'}44`,
        display:"flex",alignItems:"center",
        opacity:stuck?1:0,
        pointerEvents:stuck?"auto":"none",
        transition:"opacity .25s ease",
        boxShadow:stuck?"0 4px 24px rgba(0,0,0,0.15)":"none",
      }}>
        {barContent}
      </div>

      {/* Spacer to compensate for the overlap above, then the actual content */}
      <div style={{marginTop:64}}>
        {children}
      </div>
    </div>
  );
}

/* ── Smart analogy animation — generated from text ──── */
function AnalogyAnimSmart({analogy,subjectId,tc}){
  const[t,setT]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setT(p=>(p+1)%360),50);return()=>clearInterval(id);},[]);
  const r=t*Math.PI/180;
  const W=320,H=200,cx=W/2,cy=H/2;

  // Detect analogy theme from keywords
  const a=(analogy||"").toLowerCase();
  const isLego=a.includes("lego")||a.includes("brick")||a.includes("snap")||a.includes("click");
  const isChain=a.includes("chain")||a.includes("polymer")||a.includes("monomer");
  const isKey=a.includes("key")||a.includes("lock")||a.includes("door");
  const isTrain=a.includes("train")||a.includes("carriage")||a.includes("track");
  const isDance=a.includes("dance")||a.includes("party")||a.includes("dj");
  const isWave=a.includes("wave")||a.includes("ripple")||a.includes("ocean")||a.includes("sound");
  const isHelix=a.includes("helix")||a.includes("spiral")||a.includes("dna")||a.includes("ladder");
  const isPH=a.includes("ph ")||a.includes("acid")||a.includes("base")||a.includes("proton");
  const isPlanet=a.includes("orbit")||a.includes("planet")||a.includes("gravity")||a.includes("sun");
  const isVolt=a.includes("voltage")||a.includes("current")||a.includes("circuit")||a.includes("battery");
  const isBalance=a.includes("balance")||a.includes("seesaw")||a.includes("equilibrium")||a.includes("tug");

  const Defs=()=>(
    <defs>
      <radialGradient id="glowMain" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stopColor={tc} stopOpacity="0.22"/>
        <stop offset="100%" stopColor={tc} stopOpacity="0"/>
      </radialGradient>
      <radialGradient id="glowSide" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stopColor="#4A9EFF" stopOpacity="0.16"/>
        <stop offset="100%" stopColor="#4A9EFF" stopOpacity="0"/>
      </radialGradient>
    </defs>
  );

  // Orbiting-node layout — central glowing hub with curved connectors to
  // surrounding labelled nodes. Used as the base for several analogy types.
  const OrbitScene=({centerLabel,centerIcon,nodes,glowId="glowMain"})=>{
    const positions=nodes.map((_,i)=>{
      const ang=(i*(2*Math.PI/nodes.length))-Math.PI/2;
      return{x:cx+108*Math.cos(ang),y:cy+62*Math.sin(ang)};
    });
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
        <Defs/>
        <rect width={W} height={H} fill={`url(#${glowId})`}/>
        {positions.map((p,i)=>{
          // Curved connector — quadratic bezier bowing toward center
          const mx=(cx+p.x)/2,my=(cy+p.y)/2;
          const dx=p.x-cx,dy=p.y-cy;
          const bow=12;
          const nx=mx-dy*0.15,ny=my+dx*0.15;
          return<path key={i} d={`M${cx},${cy} Q${nx},${ny} ${p.x},${p.y}`} fill="none" stroke={tc} strokeWidth="1" opacity="0.35"/>;
        })}
        {/* Central hub */}
        <circle cx={cx} cy={cy} r="38" fill={`${tc}1A`} stroke={tc} strokeWidth="1.2"/>
        <circle cx={cx} cy={cy} r="46" fill="none" stroke={tc} strokeWidth="0.6" opacity="0.3"/>
        <foreignObject x={cx-44} y={cy-22} width="88" height="44">
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:2}}>
            {centerIcon&&<div style={{fontSize:16}}>{centerIcon}</div>}
            <div style={{fontSize:10,fontWeight:700,color:tc,textAlign:"center",lineHeight:1.2,fontFamily:"Geist,sans-serif"}}>{centerLabel}</div>
          </div>
        </foreignObject>
        {/* Orbiting nodes */}
        {positions.map((p,i)=>{
          const pulse=0.5+Math.sin(r*0.6+i)*0.08;
          return(
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="30" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" strokeWidth="1" opacity={pulse+0.4}/>
              <foreignObject x={p.x-34} y={p.y-18} width="68" height="36">
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:1}}>
                  {nodes[i].icon&&<div style={{fontSize:13}}>{nodes[i].icon}</div>}
                  <div style={{fontSize:9,fontWeight:500,color:"rgba(237,236,232,0.7)",textAlign:"center",lineHeight:1.2,fontFamily:"Geist,sans-serif"}}>{nodes[i].label}</div>
                </div>
              </foreignObject>
            </g>

        })}
      </svg>

  };

  // LEGO / brick snapping
  if(isLego||isChain){
    const bricks=5;
    return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      {Array.from({length:bricks}).map((_,i)=>{
        const progress=Math.min(1,t/(30*(i+1)));

          <rect x={x} y={86+off} width="44" height="28" rx="6" fill={`${tc}20`} stroke={tc} strokeWidth="1.4"/>
          <rect x={x+8} y={78+off} width="11" height="9" rx="3" fill={`${tc}30`} stroke={tc} strokeWidth="1.2"/>
          <rect x={x+24} y={78+off} width="11" height="9" rx="3" fill={`${tc}30`} stroke={tc} strokeWidth="1.2"/>
          {connected&&progress>0.8&&<line x1={x+44} y1={100+off} x2={x+58*progress} y2={100+off} stroke={tc} strokeWidth="1.4" strokeDasharray="4 3" opacity="0.5"/>}
        </g>;
      })}
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">monomers snapping into a polymer chain</text>
    </svg>;
  }

  // Key and lock — orbit scene with key/lock as the two nodes

      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      <path d={`M${cx-60},${cy} Q${cx},${cy-20} ${cx+60},${cy}`} fill="none" stroke={tc} strokeWidth="1" opacity="0.35"/>
      {/* Lock */}
      <g transform={`translate(${cx+60},${cy})`}>
        <rect x="-26" y="-18" width="52" height="40" rx="8" fill={`${tc}1A`} stroke={tc} strokeWidth="1.2"/>
        <path d="M-12 -18 Q-12 -32 0 -32 Q12 -32 12 -18" fill="none" stroke={tc} strokeWidth="1.2"/>
        <circle cx="0" cy="0" r="5" fill="none" stroke={tc} strokeWidth="1.2"/>
        <text x="0" y="34" textAnchor="middle" fontSize="9" fill="rgba(237,236,232,0.7)" fontFamily="Geist,sans-serif">base</text>
      </g>
      {/* Key */}
      <g transform={`translate(${cx-60+inserted*55},${cy}) rotate(${angle})`}>
        <circle cx="0" cy="0" r="13" fill={`${tc}1A`} stroke={tc} strokeWidth="1.2"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke={tc} strokeWidth="0.9"/>
        <line x1="13" y1="0" x2="48" y2="0" stroke={tc} strokeWidth="1.2"/>
        <line x1="34" y1="0" x2="34" y2="7" stroke={tc} strokeWidth="1.2"/>
        <line x1="43" y1="0" x2="43" y2="9" stroke={tc} strokeWidth="1.2"/>
        <text x="0" y="34" textAnchor="middle" fontSize="9" fill="rgba(237,236,232,0.7)" fontFamily="Geist,sans-serif">acid</text>
      </g>
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">acid (key) finds base (lock) — proton transfer</text>
    </svg>;
  }

  // Train carriages
  if(isTrain){
    return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      {[0,1,2,3].map((i)=>{
        const x=24+i*72+Math.sin(r*0.3+i*0.5)*2;
        return<g key={i}>
          <rect x={x} y={86} width="58" height="34" rx="7" fill={`${tc}1A`} stroke={tc} strokeWidth="1.3"/>
          <rect x={x+8} y={94} width="16" height="12" rx="3" fill={`${tc}28`} stroke={tc} strokeWidth="0.9"/>
          <rect x={x+32} y={94} width="16" height="12" rx="3" fill={`${tc}28`} stroke={tc} strokeWidth="0.9"/>
          <circle cx={x+15} cy={124} r="5" fill="none" stroke={tc} strokeWidth="1.3"/>
          <circle cx={x+43} cy={124} r="5" fill="none" stroke={tc} strokeWidth="1.3"/>
          {i<3&&<line x1={x+58} y1={103} x2={x+72} y2={103} stroke={tc} strokeWidth="2" strokeLinecap="round"/>}
        </g>;
      })}
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">carriages (monomers) linked into a train (polymer)</text>
    </svg>;
  }

  // pH / dance floor / protons — orbit scene
  if(isDance||isPH){
    const nodes=[
      {label:"H⁺",icon:"⊕"},{label:"base",icon:"○"},
      {label:"H⁺",icon:"⊕"},{label:"base",icon:"○"},
    ];
    return OrbitScene({centerLabel:"pH scale",centerIcon:"⇄",nodes,glowId:"glowMain"});
  }

  // Balance / equilibrium / tug-of-war
  if(isBalance){
    const tilt=Math.sin(r*0.3)*8;
    const lx=cx-80*Math.cos(tilt*Math.PI/180),ly=cy-80*Math.sin(tilt*Math.PI/180)*0.35;

      <line x1={lx} y1={ly} x2={rx2} y2={ry} stroke={tc} strokeWidth="2"/>

      <polyline points={pts} fill="none" stroke={tc} strokeWidth="2.2" opacity="0.75"/>
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">wave propagation</text>
    </svg>;
  }

  // Planet / orbit / gravity
  if(isPlanet){
    return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      <circle cx={cx} cy={cy} r="22" fill={`${tc}30`} stroke={tc} strokeWidth="1.4"/>
      <ellipse cx={cx} cy={cy} rx="90" ry="40" fill="none" stroke={tc} strokeWidth="0.8" opacity="0.35"/>
      {[0,1,2].map(i=>{
        const a=r/20+i*2*Math.PI/3;
        return<circle key={i} cx={cx+90*Math.cos(a)} cy={cy+40*Math.sin(a)} r={6+i*3} fill={`${tc}35`} stroke={tc} strokeWidth="1"/>;
      })}
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">gravity well — objects orbit the central force</text>
    </svg>;
  }

  // Voltage / circuit / battery
  if(isVolt){
    const sparkX=60+(t%140)*(W-120)/140;
    return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      <rect x="40" y={cy-18} width="44" height="36" rx="7" fill={`${tc}1A`} stroke={tc} strokeWidth="1.3"/>
      <line x1="40" y1={cy-10} x2="32" y2={cy-10} stroke={tc} strokeWidth="2"/><line x1="40" y1={cy+10} x2="32" y2={cy+10} stroke={tc} strokeWidth="2.6"/>
      <path d={`M84 ${cy} L${W-84} ${cy}`} stroke={tc} strokeWidth="1.2" strokeDasharray="7 4" opacity="0.4"/>
      <circle cx={sparkX} cy={cy} r="5" fill={tc} opacity="0.9"/>
      <rect x={W-84} y={cy-18} width="44" height="36" rx="7" fill={`${tc}15`} stroke={tc} strokeWidth="1.3"/>
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">electrons flowing through the circuit</text>
    </svg>;
  }

  // DNA / helix / ladder
  if(isHelix){
    const p1=[...Array(30)].map((_,i)=>`${20+i*((W-40)/29)},${cy+Math.sin(r/15+i*.5)*38}`).join(" ");
    const p2=[...Array(30)].map((_,i)=>`${20+i*((W-40)/29)},${cy-Math.sin(r/15+i*.5)*38}`).join(" ");
    return<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}} aria-hidden>
      <Defs/>
      <rect width={W} height={H} fill="url(#glowMain)"/>
      <polyline points={p1} fill="none" stroke={tc} strokeWidth="2" opacity="0.75"/>
      <polyline points={p2} fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1.6"/>
      {[...Array(8)].map((_,i)=>{const fi=Math.floor(i*(29/7));const x=20+fi*((W-40)/29);const y1=cy+Math.sin(r/15+fi*.5)*38;const y2=cy-Math.sin(r/15+fi*.5)*38;return<line key={i} x1={x} y1={y1} x2={x} y2={y2} stroke="rgba(255,255,255,0.15)" strokeWidth="0.8"/>;  })}
      <text x={cx} y={H-18} textAnchor="middle" fontSize="10" fill="rgba(255,255,255,0.3)" fontFamily="Geist,sans-serif">DNA double helix — base pairs as rungs</text>
    </svg>;
  }

  // Generic fallback — orbit scene with neutral nodes
  return OrbitScene({centerLabel:"core idea",centerIcon:"◎",nodes:[
    {label:"factor A",icon:"○"},{label:"factor B",icon:"○"},{label:"factor C",icon:"○"},
  ],glowId:"glowSide"});

/* ── Analogy tableau — renders the actual entities/action from the

  if(/es$/.test(k)){push(k.slice(0,-1));push(k.slice(0,-2));}
  else if(/s$/.test(k))push(k.slice(0,-1));
  if(/ing$/.test(k)){const b=k.slice(0,-3);push(b);push(b+'e');if(/(.)\1$/.test(b))push(b.slice(0,-1));}

const GOAT_MOTION_RX=[

  ['fall',    /fall|falling|drop|dropping|collapse|decay|decline|sink|sinking|tumble|crash|down\b|gravity|lower/],

  ['headbutt',/headbutt|butt|collide|collision|clash|smash|impact|crash into|hit|strike|react|reaction|bond|repel|attract|force/],
  ['squeeze', /squeeze|squeezing|through|gap|narrow|tight|fit|fits|slot|wedge|lock|key|door|entrance|gate|barrier|filter|membrane|pore|select|specific|exact|shape/],
  ['balance', /balance|balancing|equilibrium|steady|stable|poise|teeter|edge|tightrope|hold/],
  ['still',   /still|calm|quiet|rest|resting|idle|motionless|frozen|pause|wait|sleep|nothing/],
  ['herd',    /herd|flock|group|crowd|many|swarm|population|collective|together|bulk|mass|stampede|all of them/],
  ['scatter', /scatter|scattering|spread|spreading|disperse|diffuse|random|chaos|everywhere|entropy|apart/],
  ['follow',  /follow|following|chain|queue|line|sequence|order|one after|cascade|propagate|relay|conga/],
  ['escape',  /escape|escaping|break out|breakout|release|released|free|freed|emit|leak|flee|run away|exit/],
  ['spin',    /spin|spinning|cycle|cycling|loop|rotate|circle|repeat|around|orbit|turn/],
  ['eat',     /eat|eating|chew|chewing|consume|absorb|uptake|swallow|devour|munch|feed/],
  ['faint',   /faint|fainting|collapse|freeze up|shut down|fail|stiff|topple|keel/],
  ['scream',  /scream|screaming|yell|shout|signal|noise|loud|alarm|call|emit a/],
  ['play',    /play|playing|bounce|bouncing|frolic|silly|chaos|energy|excited|hyper|zoom/]
];
const GOAT_ENERGY_RX=[
  ['chaotic',/chaos|chaotic|random|wild|frantic|messy|erratic|violent|explosive/],
  ['fast',   /fast|quick|rapid|sudden|instant|sharp|snap|zoom|race|rush|burst/],
  ['calm',   /calm|slow|gentle|quiet|still|steady state|rest|peaceful|patient|drift/]

const GOAT_CAST_RX=[
  ['herd',/herd|flock|group|crowd|many|swarm|population|several|all|collective|stampede|goats\b/],
  ['pair',/two|pair|both|each other|one another|opposite|versus|\bvs\b|partner|couple/]

function itwGoatRead(text){
  const s=(text||'').toLowerCase();
  const motion=GOAT_MOTION_RX.filter(r=>r[1].test(s)).map(r=>r[0]);
  const e=GOAT_ENERGY_RX.find(r=>r[1].test(s));
  const c=GOAT_CAST_RX.find(r=>r[1].test(s));
  return {motion,energy:e?e[0]:null,cast:c?c[0]:'solo',raw:s};
}

/* No match is not a reason to show a static emoji. Hash the lesson so the
   same page always gets the same goat rather than reshuffling on re-render. */
function itwGoatFallback(seed){
  const s=String(seed||'');let h=0;
  for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}
  return GOAT_CLIPS[Math.abs(h)%GOAT_CLIPS.length].url;
}

/* Weighted scorer. Motion dominates — it is the thing the analogy is actually
   describing. Cast and energy only break ties between otherwise equal clips. */
function itwGoatMatch(text){
  const want=itwGoatRead(text);
  if(!want.motion.length&&!want.energy)return null;
  let best=null,bestScore=0;
  for(const c of GOAT_CLIPS){
    let score=0;
    (c.motion||[]).forEach(m=>{if(want.motion.indexOf(m)>=0)score+=4;});
    if(want.cast&&c.cast===want.cast)score+=2;
    if(want.energy&&c.energy===want.energy)score+=1;
    (c.tags||[]).forEach(t=>{if(t&&want.raw.indexOf(t)>=0)score+=1;});

  return bestScore>=4?best.url:null;
}

        const rr=wd.el.getBoundingClientRect();const r={x:rr.left-rect.left,y:rr.top-rect.top,w:rr.width,h:rr.height};const cx=r.x+r.w/2,cy=r.y+r.h/2;
        if(wd.type==='glow'||wd.type==='move'||wd.type==='water'||wd.type==='ghost'){ctx.save();ctx.globalCompositeOperation='lighter';const rad=Math.max(r.w,r.h)*0.85*(1+0.12*Math.sin(t*2)),g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad),c=wd.type==='glow'?'255,220,140':wd.type==='water'?'120,200,255':wd.type==='ghost'?'200,215,255':'210,225,255';g.addColorStop(0,'rgba('+c+',0.2)');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.fill();ctx.restore();}
        const rate={fire:70,smoke:12,cold:24,wind:7,spark:55,heat:15,water:16,gold:20,glitch:9}[wd.type]||0;
        if(rate){acc['r'+i]=(acc['r'+i]||0)+rate*dt;while(acc['r'+i]>=1){acc['r'+i]--;emit(wd.type,r);}}
        if(wd.type){acc['e'+i]=(acc['e'+i]||0)+dt*2.2;while(acc['e'+i]>=1){acc['e'+i]--;emitEmoji(wd.type,r.x+Math.random()*r.w,r.y+r.h*0.4);}}
        if(wd.type==='beat'){acc['b'+i]=(acc['b'+i]||0)+dt;if(acc['b'+i]>=0.5){acc['b'+i]-=0.5;P.push({t:'ring',x:cx,y:cy,r:Math.min(r.w,r.h)*0.35,life:0,max:0.8,col:accent});}}
      }
      const keep=[];
      for(const p of P){p.life+=dt;const a=1-p.life/p.max;if(a<=0)continue;
        switch(p.t){
          case 'fire':p.vy-=26*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;{const rd=p.r*(0.5+a*0.6);ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rd);g.addColorStop(0,'rgba(255,'+Math.round(120+120*a)+',80,'+(0.9*a)+')');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rd,0,7);ctx.fill();}break;
          case 'smoke':p.vy-=5*dt;p.x+=p.vx*dt+Math.sin(t+p.s)*5*dt;p.y+=p.vy*dt;p.r+=9*dt;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(198,193,186,'+(0.13*a)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();break;
          case 'cold':p.vy+=9*dt;p.x+=Math.sin(t*2+p.s)*7*dt;p.y+=p.vy*dt;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(160,214,255,'+(0.75*a)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();break;
          case 'wind':p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(200,235,227,'+(0.5*a)+')';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.len,p.y);ctx.stroke();break;
          case 'spark':p.vy+=190*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(190,225,255,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();break;
          case 'heatdot':p.x+=p.vx*dt+Math.sin(t*3+p.s)*6*dt;p.y+=p.vy*dt;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,160,70,'+(0.5*a)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();break;
          case 'drop':p.vy+=45*dt;p.x+=p.vx*dt+Math.sin(t*3+p.s)*4*dt;p.y+=p.vy*dt;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(120,205,255,'+(0.8*a)+')';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*0.8,p.r*1.3,0,0,7);ctx.fill();break;
          case 'twinkle':{p.x+=p.vx*dt;p.y+=p.vy*dt;const tw=a*(0.4+0.6*Math.abs(Math.sin(t*9+p.s)));ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,214,120,'+tw+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();break;}
          case 'shard':p.x+=p.dx*dt;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba('+p.col+','+(0.8*a)+')';ctx.fillRect(p.x,p.y,p.w,p.h);break;
          case 'ring':p.r+=90*dt;ctx.globalCompositeOperation='lighter';ctx.strokeStyle=itwHexA(p.col,0.5*a);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();break;
          case 'emoji':p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;ctx.globalCompositeOperation='source-over';ctx.save();ctx.globalAlpha=Math.min(1,a*1.4);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.font=p.size+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.char,0,0);ctx.restore();break;
        }
        keep.push(p);
      }
      ctx.globalCompositeOperation='source-over';partsRef.current=keep.slice(-300);
    };
    raf=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf);io.disconnect();partsRef.current=[];};
  },[analogy,reduce,accent]);

  wordRefs.current=[];

    <div ref={wrapRef} style={{position:'relative',width:'100%',background:`radial-gradient(ellipse 80% 70% at 50% 35%, ${accent}14 0%, transparent 70%), ${C.s1}`,border:`1px solid ${C.b1}`,borderRadius:16,overflow:'hidden',minHeight:goatOn?440:300,transition:'min-height .25s ease',display:'flex',alignItems:'center',marginBottom:32}}>

        {words.map((w,k)=>{
