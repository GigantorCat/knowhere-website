/* ══════════════════════════════════════════════════════
   AUTH SCREENS — Login / Register
══════════════════════════════════════════════════════ */
function ResetScreen({token,onDone}){
  const[p1,setP1]=useState('');
  const[p2,setP2]=useState('');
  const[err,setErr]=useState('');
  const[ok,setOk]=useState(false);
  const[busy,setBusy]=useState(false);
  const submit=async()=>{
    if(busy)return;
    setErr('');
    if(p1.length<8){setErr('Password needs at least 8 characters.');return;}
    if(p1!==p2){setErr("Those passwords don't match.");return;}
    setBusy(true);
    try{
      const r=await api.post('/auth/reset',{token,password:p1});
      if(r.ok)setOk(true);else setErr(r.error||'Something went wrong.');
    }catch(e){setErr('Could not reach the server.');}
    setBusy(false);
  };
  const inp={width:'100%',padding:'12px 14px',borderRadius:10,border:`1px solid ${C.b2}`,background:C.s1,color:C.text,fontSize:14,fontFamily:'inherit',boxSizing:'border-box'};
  return(
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px',position:'relative',overflow:'hidden'}}>
      <GlowOrb color="#7BEA5A" x="30%" y="20%" size={420} opacity={.07}/>
      <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:400,textAlign:'center'}}>
        <Logo size="lg"/>
        <div style={{fontFamily:'monospace',fontSize:11,letterSpacing:'0.16em',textTransform:'uppercase',color:'#7BEA5A',marginTop:24,marginBottom:8}}>Password reset</div>
        {ok?(
          <div>
            <h2 style={{fontSize:26,fontWeight:700,letterSpacing:'-0.02em',margin:'0 0 12px'}}>New password locked in.</h2>
            <p style={{fontSize:14,color:C.muted,fontWeight:300,lineHeight:1.6,marginBottom:24}}>You're all set — sign in with the new one.</p>
            <Btn color="#7BEA5A" size="lg" onClick={onDone} style={{fontWeight:600,minWidth:200}}>Sign in →</Btn>
          </div>
        ):(
          <div style={{textAlign:'left'}}>
            <h2 style={{fontSize:26,fontWeight:700,letterSpacing:'-0.02em',margin:'0 0 16px',textAlign:'center'}}>Choose a new password</h2>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <input type="password" aria-label="New password" value={p1} onChange={e=>setP1(e.target.value)} placeholder="New password (min 8 characters)" style={inp}/>
              <input type="password" aria-label="Confirm new password" value={p2} onChange={e=>setP2(e.target.value)} placeholder="Type it again" style={inp} onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </div>
            {err&&<div style={{marginTop:12,padding:'10px 12px',borderRadius:7,background:'rgba(255,80,80,0.08)',border:'1px solid rgba(255,80,80,0.2)',fontSize:12,color:'#FF8080'}}>{err}</div>}
            <Btn color="#7BEA5A" size="lg" disabled={busy||!p1||!p2} onClick={submit} style={{width:'100%',marginTop:16,fontWeight:600}}>{busy?'…':'Set new password →'}</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

function AuthScreen({onAuth}){
  const[mode,setMode]=useState('login');
  const[role,setRole]=useState('student');
  const[name,setName]=useState('');
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[kidName,setKidName]=useState('');
  const[kidEmail,setKidEmail]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[invite,setInvite]=useState(null);   /* {code,childName,parentName} when arriving via invite link */
  const[inviteErr,setInviteErr]=useState('');
  const[forgot,setForgot]=useState(false);
  const[forgotSent,setForgotSent]=useState(false);
  const[forgotBusy,setForgotBusy]=useState(false);

  /* Invite link redemption: ?invite=CODE */
  useEffect(()=>{
    const code=new URLSearchParams(window.location.search).get('invite');
    if(!code)return;
    api.get('/auth/invite/'+encodeURIComponent(code)).then(r=>{
      if(r.invite)setInvite({code,...r.invite});
      else setInviteErr(r.error||'This invite link has expired or was already used.');
    }).catch(()=>setInviteErr('Could not reach the server to check your invite.'));
  },[]);

  const submit=async()=>{
    setErr('');setLoading(true);
    try{
      if(invite){
        const res=await api.post('/auth/invite/'+encodeURIComponent(invite.code)+'/accept',{password:pass});
        if(res.error){setErr(res.error);setLoading(false);return;}
        localStorage.setItem('ls_token',res.token);
        window.history.replaceState({},'',window.location.pathname);
        onAuth(res.user,'register');
        return;
      }
      if(mode==='register'&&role==='parent'){
        const res=await api.post('/auth/register-parent',{name,email,password:pass,childName:kidName,childEmail:kidEmail});
        if(res.error){setErr(res.error);setLoading(false);return;}
        localStorage.setItem('ls_token',res.token);
        onAuth(res.user,'register-parent',res.invite);
        return;
      }
      const body=mode==='register'?{name,email,password:pass}:{email,password:pass};
      const res=await api.post(`/auth/${mode}`,body);
      if(res.error){setErr(res.error);setLoading(false);return;}
      localStorage.setItem('ls_token',res.token);
      onAuth(res.user, mode);
    }catch(e){setErr('Could not connect to server. Is the backend running?');setLoading(false);}
  };

  const inp={
    width:'100%',padding:'11px 14px',borderRadius:8,
    border:`1px solid ${C.b2}`,background:C.s1,
    color:C.text,fontSize:14,fontFamily:'inherit',
    outline:'none',fontWeight:300,letterSpacing:'-0.005em',
    boxSizing:'border-box',
  };
  const lbl={fontSize:11,color:C.muted,fontWeight:500,letterSpacing:'0.04em',textTransform:'uppercase',display:'block',marginBottom:5};
  const canSubmit=invite
    ?pass.length>=8
    :mode==='login'?(email&&pass)
    :role==='parent'?(name&&email&&pass&&kidName&&kidEmail)
    :(name&&email&&pass);

  if(forgot)return(
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px',position:'relative',overflow:'hidden'}}>
      <GlowOrb color="#7BEA5A" x="30%" y="20%" size={420} opacity={.07}/>
      <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:400,textAlign:'center'}}>
        <Logo size="lg"/>
        <div style={{fontFamily:'monospace',fontSize:11,letterSpacing:'0.16em',textTransform:'uppercase',color:'#7BEA5A',marginTop:24,marginBottom:8}}>Password reset</div>
        {forgotSent?(
          <div>
            <h2 style={{fontSize:26,fontWeight:700,letterSpacing:'-0.02em',margin:'0 0 12px'}}>Check your email.</h2>
            <p style={{fontSize:14,color:C.muted,fontWeight:300,lineHeight:1.6,marginBottom:24}}>If an account exists for {email||'that address'}, a reset link is on its way. It expires in 60 minutes.</p>
            <Btn variant="ghost" size="sm" onClick={()=>setForgot(false)}>← Back to sign in</Btn>
          </div>
        ):(
          <div>
            <h2 style={{fontSize:26,fontWeight:700,letterSpacing:'-0.02em',margin:'0 0 8px'}}>Forgot your password?</h2>
            <p style={{fontSize:14,color:C.muted,fontWeight:300,lineHeight:1.6,marginBottom:20}}>No stress — enter your email and we'll send a reset link.</p>
            <input type="email" aria-label="Email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com"
              style={{width:'100%',padding:'12px 14px',borderRadius:10,border:`1px solid ${C.b2}`,background:C.s1,color:C.text,fontSize:14,fontFamily:'inherit',marginBottom:14,boxSizing:'border-box'}}
              onKeyDown={e=>{if(e.key==='Enter'&&email&&!forgotBusy){setForgotBusy(true);api.post('/auth/forgot',{email}).then(()=>{setForgotSent(true);setForgotBusy(false);}).catch(()=>{setForgotSent(true);setForgotBusy(false);});}}}/>
            <Btn color="#7BEA5A" size="lg" disabled={!email||forgotBusy} onClick={()=>{setForgotBusy(true);api.post('/auth/forgot',{email}).then(()=>{setForgotSent(true);setForgotBusy(false);}).catch(()=>{setForgotSent(true);setForgotBusy(false);});}} style={{width:'100%',fontWeight:600}}>{forgotBusy?'…':'Send reset link →'}</Btn>
            <div style={{marginTop:14}}>
              <button onClick={()=>setForgot(false)} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline',fontFamily:'inherit'}}>← Back to sign in</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100dvh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 20px',position:'relative',overflow:'hidden'}}>
      <GlowOrb color="#7BEA5A" x="30%" y="20%" size={400} opacity={.07}/>
      <GlowOrb color="#7BEA5A" x="75%" y="70%" size={350} opacity={.06}/>
      <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:400}}>
        <div style={{textAlign:'center',marginBottom:32}}>
          <Logo/>
          <p style={{fontSize:13,color:C.muted,marginTop:8,fontWeight:300}}>Year 12 learning, personalised to you</p>
        </div>
        <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:14,padding:'28px 24px'}}>

          {invite?(
            <div>
              <div style={{textAlign:'center',marginBottom:18}}>
                <span style={{fontSize:26}}>👋</span>
                <h3 style={{fontSize:18,fontWeight:600,color:C.text,margin:'8px 0 6px',letterSpacing:'-0.02em'}}>Hey {invite.childName?.split(' ')[0]||'there'}!</h3>
                <p style={{fontSize:13,color:C.muted,fontWeight:300,lineHeight:1.5,margin:0}}>{invite.parentName||'Your parent'} set you up with Knowhere. Pick a password and you're in.</p>
              </div>
              <label style={lbl}>Set your password</label>
              <input type="password" aria-label="Password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Min 8 characters" style={inp}
                onKeyDown={e=>e.key==='Enter'&&canSubmit&&submit()}/>
              {err&&<div style={{marginTop:12,padding:'10px 12px',borderRadius:7,background:'rgba(255,80,80,0.08)',border:'1px solid rgba(255,80,80,0.2)',fontSize:12,color:'#FF8080'}}>{err}</div>}
              <Btn onClick={submit} disabled={loading||!canSubmit} color="#7BEA5A" size="lg" style={{width:'100%',marginTop:16,fontWeight:600}}>
                {loading?'…':"Let's go →"}
              </Btn>
              <p style={{marginTop:12,marginBottom:0,fontSize:11,lineHeight:1.55,color:C.faint,textAlign:'center'}}>
                By creating your account you agree to our <a href="https://knowhere.me/terms.html" target="_blank" rel="noopener" style={{color:C.muted,textDecoration:'underline'}}>Terms of Use</a> and <a href="https://knowhere.me/privacy.html" target="_blank" rel="noopener" style={{color:C.muted,textDecoration:'underline'}}>Privacy Policy</a>.
              </p>
            </div>
          ):(
          <div>
            {inviteErr&&<div style={{marginBottom:14,padding:'10px 12px',borderRadius:7,background:'rgba(252,184,21,0.08)',border:'1px solid rgba(252,184,21,0.25)',fontSize:12,color:'#FCB815'}}>{inviteErr}</div>}
            <div style={{display:'flex',gap:4,background:C.bg,borderRadius:8,padding:4,marginBottom:mode==='register'?14:24}}>
              {['login','register'].map(m=>(
                <button key={m} onClick={()=>{setMode(m);setErr('');}} style={{
                  flex:1,padding:'7px',borderRadius:6,border:'none',
                  background:mode===m?C.s2:'transparent',
                  color:mode===m?C.text:C.muted,
                  fontSize:13,fontWeight:mode===m?500:400,cursor:'pointer',fontFamily:'inherit',
                  transition:'all .15s',letterSpacing:'-0.01em',
                }}>{m==='login'?'Sign in':'Create account'}</button>
              ))}
            </div>

            {mode==='register'&&(
              <div style={{marginBottom:20}}>
                <label style={lbl}>Who's signing up?</label>
                <div style={{display:'flex',gap:8}}>
                  {[['student','🎓','I\u2019m the student'],['parent','🧑\u200d🦱','I\u2019m a parent']].map(([r,ic,t])=>(
                    <button key={r} onClick={()=>setRole(r)} style={{
                      flex:1,padding:'11px 8px',borderRadius:9,cursor:'pointer',fontFamily:'inherit',
                      border:`1px solid ${role===r?'#7BEA5A':C.b2}`,
                      background:role===r?'rgba(189,216,54,0.08)':C.bg,
                      color:role===r?C.text:C.muted,fontSize:12.5,fontWeight:role===r?600:400,
                      transition:'all .15s',display:'flex',alignItems:'center',justifyContent:'center',gap:6,
                    }}><span>{ic}</span>{t}</button>
                  ))}
                </div>
              </div>
            )}

            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {mode==='register'&&(
                <div>
                  <label style={lbl}>{role==='parent'?'Your name':'Name'}</label>
                  <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={inp}/>
                </div>
              )}
              <div>
                <label style={lbl}>{mode==='register'&&role==='parent'?'Your email':'Email'}</label>
                <input type="email" aria-label="Email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" style={inp}
                  onKeyDown={e=>e.key==='Enter'&&submit()}/>
              </div>
              <div>
                <label style={lbl}>Password</label>
                <input type="password" aria-label="Password" value={pass} onChange={e=>setPass(e.target.value)} placeholder={mode==='register'?'Min 8 characters':'••••••••'} style={inp}
                  onKeyDown={e=>e.key==='Enter'&&submit()}/>
              </div>
              {mode==='login'&&(
                <button onClick={()=>{setForgot(true);setForgotSent(false);setErr('');}} style={{background:'none',border:'none',padding:0,textAlign:'right',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline',fontFamily:'inherit',alignSelf:'flex-end'}}>Forgot password?</button>
              )}
              {mode==='register'&&role==='parent'&&(
                <div style={{marginTop:6,padding:'14px 14px 12px',borderRadius:10,border:`1px dashed ${C.b2}`,background:C.bg}}>
                  <p style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',margin:'0 0 10px'}}>Your Year 12 student</p>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <div>
                      <label style={lbl}>Their name</label>
                      <input value={kidName} onChange={e=>setKidName(e.target.value)} placeholder="First name is fine" style={inp}/>
                    </div>
                    <div>
                      <label style={lbl}>Their email</label>
                      <input type="email" aria-label="Your child's email" value={kidEmail} onChange={e=>setKidEmail(e.target.value)} placeholder="them@email.com" style={inp}/>
                    </div>
                  </div>
                  <p style={{fontSize:11,color:C.faint,fontWeight:300,margin:'10px 0 0',lineHeight:1.4}}>We'll create an invite so they can set their own password and pick their subjects.</p>
                </div>
              )}
            </div>

            {err&&(
              <div style={{marginTop:12,padding:'10px 12px',borderRadius:7,background:'rgba(255,80,80,0.08)',border:'1px solid rgba(255,80,80,0.2)',fontSize:12,color:'#FF8080'}}>{err}</div>
            )}

            <Btn onClick={submit} disabled={loading||!canSubmit}
              color="#7BEA5A" size="lg" style={{width:'100%',marginTop:16,fontWeight:600}}>
              {loading?'…':mode==='login'?'Sign in →':role==='parent'?'Create accounts →':'Create account →'}
            </Btn>
            {mode==='register'&&(
              <p style={{marginTop:12,marginBottom:0,fontSize:11,lineHeight:1.55,color:C.faint,textAlign:'center'}}>
                By creating an account you agree to our <a href="https://knowhere.me/terms.html" target="_blank" rel="noopener" style={{color:C.muted,textDecoration:'underline'}}>Terms of Use</a> and <a href="https://knowhere.me/privacy.html" target="_blank" rel="noopener" style={{color:C.muted,textDecoration:'underline'}}>Privacy Policy</a>.
              </p>
            )}
          </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════

══════════════════════════════════════════════════════ */
function SubEndedScreen({onLogout}){
  const[busy,setBusy]=useState(false);
  const[v,setV]=useState(false);
  useEffect(()=>{setTimeout(()=>setV(true),60);},[]);
  let stored={};try{stored=JSON.parse(localStorage.getItem('ls_plan')||'{}');}catch(e){}
  const planId=stored.plan||'pro',billing=stored.billing||'monthly';
  const plan=PLANS.find(p=>p.id===planId);
  const planName=(plan&&plan.name)||'your plan';
  const resub=async()=>{
    if(busy)return;
    setBusy(true);
    try{
      const r=await api.post('/billing/checkout',{plan:planId,billing,returnUrl:window.location.origin+window.location.pathname});
      if(r.url){window.location.href=r.url;return;}
      alert(r.error||'Checkout unavailable right now.');
    }catch(e){alert('Could not reach the server.');}
    setBusy(false);
  };
  const portal=async()=>{
    try{const r=await api.post('/billing/portal',{returnUrl:window.location.origin+window.location.pathname});if(r.url)window.location.href=r.url;}catch(e){}
  };
  return(
    <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 20px',position:'relative',overflow:'hidden'}}>
      <GlowOrb color="#7BEA5A" x="30%" y="18%" size={420} opacity={.07}/>
      <GlowOrb color="#7BEA5A" x="76%" y="74%" size={360} opacity={.06}/>
      <div style={{position:'relative',zIndex:1,width:'100%',maxWidth:460,textAlign:'center',opacity:v?1:0,transform:v?'none':'translateY(16px)',transition:'all .5s cubic-bezier(.16,1,.3,1)'}}>
        <Logo size="lg"/>
        <div style={{fontFamily:'monospace',fontSize:11,letterSpacing:'0.16em',textTransform:'uppercase',color:'#7BEA5A',marginTop:24,marginBottom:8}}>Plan ended</div>
        <h2 style={{fontSize:32,fontWeight:700,letterSpacing:'-0.02em',margin:'0 0 12px'}}>Your brain misses this.</h2>
        <p style={{fontSize:14,color:C.muted,fontWeight:300,lineHeight:1.6,marginBottom:28}}>Your subscription has ended, so the good stuff is paused. Everything you built — progress, flashcards, custom concepts — is saved and waiting exactly where you left it.</p>
        <div style={{marginBottom:16}}>
          <Btn color="#7BEA5A" size="lg" onClick={resub} style={{minWidth:220,fontWeight:600}}>{busy?'Heading to checkout…':`Restart ${planName} →`}</Btn>
        </div>
        <div style={{display:'flex',gap:16,justifyContent:'center'}}>
          <button onClick={portal} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline',fontFamily:'inherit'}}>Billing history</button>
          <button onClick={onLogout} style={{background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',textDecoration:'underline',fontFamily:'inherit'}}>Sign out</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   TOAST — bottom-drawer semantic notification system.
   Usage: useToast() returns showToast(msg, type)
   Types: 'success' | 'error' | 'warning' | 'info'
══════════════════════════════════════════════════════ */
const ToastContext=React.createContext(null);

function ToastProvider({children}){
  const[toasts,setToasts]=useState([]);
  /* place: 'bottom' (default) or 'top'. Top is for the moments the student
     came back to the app FOR \u2014 an upgrade landing, say \u2014 where the bottom
     bar is the wrong place to look. ms lets those linger a beat longer. */
  const showToast=useCallback((message,type='success',place='bottom',ms=3200)=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,message,type,place}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),ms);
  },[]);
  return(
    <ToastContext.Provider value={showToast}>
      {children}
      {['bottom','top'].map(place=>(
      <div key={place} style={{position:'fixed',...(place==='top'?{top:0,paddingTop:20}:{bottom:0,paddingBottom:24}),left:0,right:0,zIndex:999,pointerEvents:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        {toasts.filter(t=>(t.place||'bottom')===place).map(t=>{
          const cfg={
            /* Goaty fronts success and error — the two the student actually
               feels. Warning and info keep their glyphs: he'd be wallpaper
               if he turned up on every toast. */
            success:{bg:'#1A2E1A',border:'#2E6B2E',icon:<GoatMark expr="delighted" size={26} goatee/>,accent:'#4ADE80'},
            error:{bg:'#2E1A1A',border:'#6B2E2E',icon:<GoatMark expr="side eye" size={26} goatee="#F87171"/>,accent:'#F87171'},
            warning:{bg:'#2E261A',border:'#6B5A2E',icon:<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L1.5 15.5h15L9 2z" stroke="#FBBF24" strokeWidth="1.4" strokeLinejoin="round"/><path d="M9 8v3.5M9 13.5v.5" stroke="#FBBF24" strokeWidth="1.6" strokeLinecap="round"/></svg>,accent:'#FBBF24'},
            info:{bg:'#1A222E',border:'#2E4A6B',icon:<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="#60A5FA" strokeWidth="1.4"/><path d="M9 8v5M9 6v.5" stroke="#60A5FA" strokeWidth="1.6" strokeLinecap="round"/></svg>,accent:'#60A5FA'},
          }[t.type]||{bg:'#1A2E1A',border:'#2E6B2E',icon:null,accent:'#4ADE80'};
          return(
            <div key={t.id} style={{
              pointerEvents:'auto',
              display:'flex',alignItems:'center',gap:12,
              padding:'14px 20px',
              background:cfg.bg,
              border:`1px solid ${cfg.border}`,
              borderRadius:14,
              maxWidth:420,width:'calc(100% - 48px)',
              boxShadow:'0 8px 32px rgba(0,0,0,0.6)',
              animation:((t.place||'bottom')==='top'?'toastInTop':'toastIn')+' .25s cubic-bezier(.16,1,.3,1)',
            }}>
              {cfg.icon}
              <p style={{fontSize:14,fontWeight:500,color:cfg.accent,margin:0,lineHeight:1.4}}>{t.message}</p>
            </div>
          );
        })}
      </div>
      ))}
      <style>{`@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      @keyframes toastInTop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}`}</style>
    </ToastContext.Provider>
  );
}
function useToast(){return React.useContext(ToastContext)||((msg)=>{});}

function LogoDust({color='#EDECE8',width=80,height=71,count=1400}){
  const ref=useRef(null);
  useEffect(()=>{
    const canvas=ref.current;
    if(!canvas)return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;

    const dpr=Math.min(window.devicePixelRatio||1,2);
    /* particles travel ~90px over a full life, so the field needs real room
       or they clip at the edge while still bright */
    const PAD=72;
    const W=width+PAD*2, H=height+PAD*2;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    const ctx=canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);

    /* sample the silhouette once */
    const mask=document.createElement('canvas');
    mask.width=Math.round(width); mask.height=Math.round(height);
    const mctx=mask.getContext('2d');
    const sx=width/74.42, sy=height/65.92;
    mctx.setTransform(sx,0,0,sy,0,0);
    mctx.fillStyle='#fff';
    try{ KN_LOGO_PARTS.forEach(pt=>{ mctx.fill(new Path2D(pt[2])); }); }
    catch(e){ /* Path2D unsupported — leave the loader as-is */ return; }

    const seeds=[];
    const img=mctx.getImageData(0,0,mask.width,mask.height).data;
    for(let y=0;y<mask.height;y+=1){
      for(let x=0;x<mask.width;x+=1){
        if(img[(y*mask.width+x)*4+3]>60) seeds.push([x,y]);
      }
    }
    if(!seeds.length)return;

    const rgb=(()=>{const h=String(color).replace('#','');
      return h.length===6?[0,2,4].map(k=>parseInt(h.slice(k,k+2),16)):[237,236,232];})();

    const spawn=p=>{
      const [x,y]=seeds[(Math.random()*seeds.length)|0];
      p.x=PAD+x; p.y=PAD+y;
      p.vx=(Math.random()-0.35)*0.22;         /* drifts slightly right */
      p.vy=-(0.16+Math.random()*0.42);        /* and upward */
      p.r=0.14+Math.random()*Math.random()*0.48;  /* skewed small: most sub-pixel */
      p.life=0; p.max=42+Math.random()*74;
      p.wob=Math.random()*Math.PI*2;
      p.alpha=0.55+Math.random()*0.45;
    };
    const parts=Array.from({length:count},()=>{const p={};spawn(p);p.life=Math.random()*p.max;return p;});

    let raf, t=0, dead=false;
    const tick=()=>{
      if(dead)return;
      t+=0.016;
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      for(const p of parts){
        p.life++;
        if(p.life>p.max){spawn(p);continue;}
        p.wob+=0.05;
        p.x+=p.vx+Math.sin(p.wob)*0.09;       /* turbulence, not a straight rise */
        p.y+=p.vy;
        p.vy-=0.0016;                          /* slight lift as it thins out */
        const k=p.life/p.max;
        const a=p.alpha*(k<0.12?k/0.12:(1-k)*(1-k));
        ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
        const d=p.r*2; ctx.fillRect(p.x,p.y,d,d);
      }
      ctx.globalCompositeOperation='source-over';
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>{dead=true;cancelAnimationFrame(raf);};
  },[color,width,height,count]);

  return <canvas ref={ref} aria-hidden="true"
    style={{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',
      width:width+144,height:height+144,pointerEvents:'none'}}/>;
}

/* Line icons drawn to sit beside Goaty: same 52px box, same confident
   single-weight stroke, no fill. currentColor so they inherit brat green. */
function PrefIcon({name,size=44}){
  const P={
    fingerprint:(<g fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 22c0-5.5 4.5-10 10-10s10 4.5 10 10v6"/>
      <path d="M17 24a5 5 0 0 1 10 0v8"/>
      <path d="M22 24v11"/>
      <path d="M32 32c0 4-1 7-2.5 9.5"/>
      <path d="M17 32v5c0 3-.6 5.5-1.8 7.5"/>
      <path d="M27 33c0 6-1 9-2.5 11.5"/>
      <path d="M7.5 24a15 15 0 0 1 27-8"/></g>),
    brain:(<g fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M22 12.5a5 5 0 0 0-9 3 4.6 4.6 0 0 0-3.5 7A5 5 0 0 0 11 31a4.8 4.8 0 0 0 4 7.5c1.4 1.9 3.4 3 5.5 3 .9 0 1.5-.7 1.5-1.6z"/>
      <path d="M22 12.5a5 5 0 0 1 9 3 4.6 4.6 0 0 1 3.5 7A5 5 0 0 1 33 31a4.8 4.8 0 0 1-4 7.5c-1.4 1.9-3.4 3-5.5 3-.9 0-1.5-.7-1.5-1.6z"/>
      <path d="M17 20.5c1.5.4 2.6 1.4 3 2.8M27 20.5c-1.5.4-2.6 1.4-3 2.8M16 30c1.8 0 3.2 1 4 2.4M28 30c-1.8 0-3.2 1-4 2.4"/></g>),
    lightbulb:(<g fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M22 8.5c-6 0-10.5 4.5-10.5 10.2 0 3.7 1.8 6.2 3.6 8.3 1.3 1.5 2.1 2.7 2.4 4.5h9c.3-1.8 1.1-3 2.4-4.5 1.8-2.1 3.6-4.6 3.6-8.3C32.5 13 28 8.5 22 8.5z"/>
      <path d="M17.5 35.5h9M19 39.5h6"/>
      <path d="M22 19v12"/><path d="M18.5 22.5l3.5 3 3.5-3"/></g>),
  }[name];
  if(!P)return null;
  return <svg width={size} height={size} viewBox="0 0 44 50" aria-hidden style={{display:'block'}}>{P}</svg>;
}

function StyleRow({label,value,detail,tc,onChange,icon}){

/* "Nah, goat." is deliberately one tap and permanent — a confirm dialog on
   an escape hatch is a trap. This is the safety net: nobody gets punished
   for a fast tap on a bad day. Clearing `seen` too, so he starts over
   rather than reappearing with nothing left to say. */
function GoatRow({tc}){
  const[st,setSt]=useState(()=>goatLoad());
  const showToast=useToast();
  const on=st.enabled!==false;
  const flip=()=>{
    const next=on
      ?{...st,enabled:false}
      :{...st,enabled:true,seen:{},lastFiredAt:0};
    goatSave(next);setSt(next);
    goatRT.sessionCount=0;goatRT.perScreen={};goatRT.active=null;
    showToast(on?'The Goat is asleep':'The Goat is awake');
  };
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,padding:'14px 0'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:12,minWidth:0}}>
        <GoatMark expr={on?'one brow':'sleepy'} size={52} goatee style={{marginTop:2}}/>
        <div style={{minWidth:0}}>
          <p style={{fontSize:11,fontWeight:600,color:C.muted,letterSpacing:'0.06em',textTransform:'uppercase',margin:'0 0 4px'}}>The Goat</p>
          <p style={{fontSize:15,fontWeight:600,color:C.text,margin:'0 0 2px'}}>{on?"Showing you what's not bleeting obvious":'Out cold'}</p>
          <p style={{fontSize:12.5,color:C.muted,margin:0,fontWeight:300,lineHeight:1.5}}>
            {on?"Turns up when something's worth a word, then clears off. No herd mentality.":"You put him under. He'll be here when you want him, holding no grudge whatsoever."}
          </p>
        </div>
      </div>
      <Btn onClick={flip} variant="ghost" size="sm" style={{flexShrink:0}}>{on?'Put The Goat to sleep':'Wake up The Goat'}</Btn>
    </div>
  );
}

const LEARNING_SECTIONS=[
  {id:'style',label:'Learning style',icon:'◈'},
  {id:'subjects',label:'Your subjects',icon:'◉'},
];

function LearningPrefsHome({type,neuro,repStyle,tc,user,onBack,onChangeType,onChangeNeuro,onChangeRepStyle,onSaveSubjects,onNavArea,initialSection}){
  const profile=user?.profile||{};
  const[activeSection,setActiveSection]=useState(initialSection||'style');
  const rs=REP_STYLES.find(r=>r.id===repStyle)||REP_STYLES[0];
  const[selectedSubjects,setSelectedSubjects]=useState(
    profile.subjects&&profile.subjects.length>0 ? profile.subjects : SUBJECTS.map(s=>s.id)
  );
  const[prioritySubjects,setPrioritySubjects]=useState(profile.prioritySubjects||[]);
  const showToast=useToast();
  const toggleSubject=(id)=>{
    setSelectedSubjects(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      if(!next.includes(id))setPrioritySubjects(p=>p.filter(x=>x!==id));
      return next;
    });
  };
  const togglePriority=(id)=>{
    setPrioritySubjects(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  };
  const allSubjectsSelected=selectedSubjects.length===SUBJECTS.length;
  const toggleAllSubjects=()=>{
    if(allSubjectsSelected){setSelectedSubjects([]);setPrioritySubjects([]);}
    else setSelectedSubjects(SUBJECTS.map(s=>s.id));
  };
  const save=()=>{
    onSaveSubjects(selectedSubjects,prioritySubjects.filter(id=>selectedSubjects.includes(id)));
    showToast('Subjects saved');
  };

  return(
    <ScreenShell title="Learning preferences" tc={tc} onBack={onBack}
      isPreferenceArea activeArea="learning-prefs" onNavArea={onNavArea}
      sections={LEARNING_SECTIONS} activeSection={activeSection} onSection={setActiveSection}>

      {activeSection==='style'&&<SettingsCard title="Your learning style" tc={tc}>
        <StyleRow icon="fingerprint" label="Enneagram type" value={`Type ${type.num} — ${type.short}`} detail={type.driver} tc={tc} onChange={onChangeType}/>
        <StyleRow icon="brain" label="Neurology" value={neuro?.id==='none'?'None specified':neuro.label} detail={neuro?.id!=='none'?neuro.desc:'Add this if it helps us tailor pacing and structure'} tc={tc} onChange={onChangeNeuro}/>
        <div style={{paddingTop:14}}>
          <StyleRow icon="lightbulb" label="Learning mode" value={rs.label} detail={rs.desc} tc={tc} onChange={onChangeRepStyle}/>
        </div>
        <GoatRow tc={tc}/>
      </SettingsCard>}

      {activeSection==='subjects'&&<SettingsCard title="Your subjects" tc={tc}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap',marginBottom:14}}>
          <p style={{fontSize:13,color:C.muted,margin:0,fontWeight:300,lineHeight:1.5,flex:1,minWidth:180}}>Pick what you're studying. Only selected subjects show in your study area and menu.</p>
          <button onClick={toggleAllSubjects} style={{padding:'8px 14px',borderRadius:9,border:`1px solid ${allSubjectsSelected?tc:C.b2}`,background:allSubjectsSelected?`${tc}14`:C.s1,color:allSubjectsSelected?tc:C.text,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',transition:'all .18s',flexShrink:0}}>
            {allSubjectsSelected?'Deselect all':'Select all subjects'}
          </button>
        </div>
        <SubjectPickGrid selected={selectedSubjects} onToggle={toggleSubject} columnsMin={170}/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginTop:18,flexWrap:'wrap'}}>
          <span style={{fontSize:12,color:selectedSubjects.length>0?C.muted:C.faint,fontWeight:400}}>
            {selectedSubjects.length===0?'Select at least one subject':`${selectedSubjects.length} subject${selectedSubjects.length!==1?'s':''} selected`}
          </span>
          <Btn onClick={save} color={tc} size="sm" disabled={selectedSubjects.length===0}>Save subjects</Btn>
        </div>
      </SettingsCard>}

    </ScreenShell>
  );
}

function CreditRing({used,total,tc}){
  const pct=total>0?Math.min(used/total,1):0;
  const r=36,cx=44,cy=44,stroke=6,circ=2*Math.PI*r;
  const usedDash=pct*circ;
  return(
    <div style={{display:'flex',alignItems:'center',gap:20}}>
      <svg width={88} height={88} style={{flexShrink:0,transform:'rotate(-90deg)'}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={`${tc}18`} strokeWidth={stroke}/>
        {used>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke={tc} strokeWidth={stroke} strokeDasharray={`${usedDash} ${circ}`} strokeLinecap="round"/>}
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={`${tc}35`} strokeWidth={stroke} strokeDasharray={`${circ-usedDash} ${circ}`} strokeDashoffset={-usedDash} strokeLinecap="round"/>
      </svg>
      <div>
        <div style={{fontSize:28,fontWeight:700,letterSpacing:'-0.02em',color:C.text,lineHeight:1}}>{total-used}</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>credits remaining</div>
        <div style={{fontSize:11,color:C.muted,marginTop:6}}>{used} of {total} used this month</div>
      </div>
    </div>
  );
}

function SubscriptionHome({tc,onBack,onNavArea}){
  const stored=JSON.parse(localStorage.getItem('ls_plan')||'{}');
  const planId=stored.plan||'core';
  const billing=stored.billing||'monthly';
  const creditsUsed=stored.creditsUsed||0;
  const plan=PLANS.find(p=>p.id===planId)||PLANS[0];
  const isY=billing==='yearly';
  const price=isY?plan.priceY:plan.priceM;
  const hasCredits=plan.credits>0;
  const NEXT={core:'pro',pro:'max'};
  const nextPlan=NEXT[planId]?PLANS.find(p=>p.id===NEXT[planId]):null;
  const creditsLeft=plan.credits-creditsUsed;
  const subStatus=stored.subStatus||'trial';
  const goCheckout=async(pId,b)=>{
    try{
      const r=await api.post('/billing/checkout',{plan:pId,billing:b,returnUrl:window.location.origin+window.location.pathname});
      if(r.url)window.location.href=r.url;else alert(r.error||'Checkout unavailable — is Stripe configured?');
    }catch(e){alert('Could not reach the server.');}
  };
  const goPortal=async()=>{
    try{
      const r=await api.post('/billing/portal',{returnUrl:window.location.origin+window.location.pathname});
      if(r.url)window.location.href=r.url;else goCheckout(planId,billing);
    }catch(e){alert('Could not reach the server.');}
  };

function Quiz({onDone,onBack,editing}){
  const[qi,setQi]=useState(()=>window.__kwQuizQi||0);
  const[answers,setAnswers]=useState(()=>window.__kwQuizA||Array(QUIZ.length).fill(null));

  const q=QUIZ[qi];
  const sel=answers[qi];
  const pick=(i)=>{const a=[...answers];a[qi]=i;setAnswers(a);window.__kwQuizA=a;};
  const next=()=>{
    if(sel==null)return;
    if(qi<QUIZ.length-1){setQi(qi+1);window.__kwQuizQi=qi+1;}
    else{
      const scores=Array(10).fill(0);
      answers.forEach((ai,idx)=>{QUIZ[idx].opts[ai].types.forEach(t=>{scores[t]+=1;});});
      window.__kwQuizA=null;window.__kwQuizQi=0;
      const mx=Math.max(...scores.slice(1));
      onDone(TYPES.find(t=>t.num===scores.indexOf(mx,1))||TYPES[6]);
    }
  };
  const back=()=>{
    if(qi>0){setQi(qi-1);window.__kwQuizQi=qi-1;}
    else{window.__kwQuizA=null;window.__kwQuizQi=0;if(onBack)onBack();}
  };

  return(
    <div style={{minHeight:'100dvh',display:'flex',flexDirection:'column',padding:'0 0 110px'}}>
      {!editing&&<OnboardProgress step={2+qi} section="style"/>}

      <div style={{flex:1,display:'flex',flexDirection:'column',maxWidth:640,margin:'0 auto',width:'100%',padding:'86px 24px 40px'}}>

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:36}}>
          <Logo/>
          <Chip color="#7BEA5A">2 · Your Style</Chip>
        </div>

        <div style={{flex:1}}>
          <h2 style={{
            fontSize:'clamp(20px,3.5vw,28px)',
            fontWeight:600,color:C.text,
            margin:'0 0 32px',
            lineHeight:1.25,
            letterSpacing:'-0.025em',
          }}>{q.q}</h2>

          <div style={{display:'flex',flexDirection:'column',gap:8}} role="group" aria-label="Answer options">
            {q.opts.map((opt,i)=>{
              const isSelected=sel===i;
              return(
                <button key={i} onClick={()=>pick(i)}
                  aria-pressed={isSelected}
                  style={{
                    textAlign:'left',padding:'13px 16px',
                    borderRadius:8,
                    border:`1px solid ${isSelected?'#7BEA5A50':C.b1}`,
                    background:isSelected?'rgba(123,234,90,0.06)':C.s1,
                    color:isSelected?'#7BEA5A':C.text,
                    fontSize:14,lineHeight:1.55,
                    cursor:'pointer',fontFamily:'inherit',
                    fontWeight:isSelected?500:300,
                    transition:'all .12s ease',
                    letterSpacing:'-0.005em',
                  }}
                >{opt.t}</button>
              );
            })}
          </div>
        </div>
      </div>

      <OnboardFooter
        center={editing?`Question ${qi+1} / ${QUIZ.length}`:`Question ${2+qi} / ${ONBOARD_TOTAL}`}
        onBack={back}
        backLabel={qi===0&&editing?'Cancel':'← Back'}
        onNext={next}
        nextLabel={qi<QUIZ.length-1?'Next →':(editing?'Save →':'Next →')}
        nextDisabled={sel==null}/>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   SUBJECT ISOMETRIC ILLUSTRATIONS
   Thin-line isometric style, each unique to the subject

/* Shared iso helpers */
const isoW=120, isoH=110;
const IsoSvg=({children,w=isoW,h=isoH})=>(
  <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{overflow:'visible'}} aria-hidden>
    {children}
  </svg>
);

// ─── SubjectLoader: per-subject particle disintegration loader (Animal handoff) ───
// Colour comes from the app subject system (tc prop); mark + motion keyed by subject id.
const LOADER_ALIAS={'phys-ed':'physical-ed','history-revolutions':'modern-history'};
const LOADER_MOTION={'biology':'breathe','chemistry':'rotate','physics':'rotate','psychology':'pulse','foundation-maths':'breathe','general-maths':'breathe','maths-methods':'wave','specialist-maths':'rotate','english':'breathe','modern-history':'breathe','geography':'rotate','economics':'pulse','business-management':'rotate','accounting':'breathe','health-hd':'wave','physical-ed':'breathe','visual-comm':'breathe'};
function SubjectLoader({subjectId,color,speed=1}){
  const cvRef=useRef(null);
  useEffect(()=>{
    const cv=cvRef.current;if(!cv)return;
    const ctx=cv.getContext('2d');
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const clamp=(v)=>v<0?0:v>1?1:v;
    const ease=(v)=>{v=clamp(v);return v*v*(3-2*v);};
    const hx=(color||'#7BEA5A').replace('#','');const cn=parseInt(hx,16)||0;
    const col={r:(cn>>16)&255,g:(cn>>8)&255,b:cn&255};
    const sid=LOADER_ALIAS[subjectId]||subjectId;
    const motion=LOADER_MOTION[sid]||'breathe';
    const e={sid:null,cw:0,ch:0,lastCt:0,P:[],cx:0,cy:0,s:1};
    const CYCLE=8;

    function genPoints(id,w,h){
      const cx=w/2, cy=h*0.44, s=Math.min(w,h)*0.6, DEN=5.2;
      const P=[];
      const add=(x,y,acc)=>P.push({tx:x,ty:y,acc:!!acc});
      const line=(x1,y1,x2,y2,n,ae)=>{n=Math.max(2,Math.round(n*DEN));for(let i=0;i<n;i++){const f=n<=1?0:i/(n-1);add(x1+(x2-x1)*f,y1+(y2-y1)*f, ae&&i%ae===0);}};
      const ell=(ox,oy,rx,ry,n,ae,rot,a0,a1)=>{rot=rot||0;a0=a0||0;a1=a1===undefined?Math.PI*2:a1;n=Math.round(n*DEN);for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n;let x=Math.cos(a)*rx,y=Math.sin(a)*ry;if(rot){const c=Math.cos(rot),sn=Math.sin(rot);const nx=x*c-y*sn,ny=x*sn+y*c;x=nx;y=ny;}add(ox+x,oy+y, ae&&i%ae===0);}};
      const rep=(n)=>Math.round(n*DEN);
      switch(id){
        case 'biology':{ const H=s*0.86,top=cy-H/2,R=s*0.15,N=rep(48),st=[];
          for(let i=0;i<N;i++){const f=i/(N-1),a=f*Math.PI*2.6,y=top+f*H;const x1=cx+Math.cos(a)*R,x2=cx+Math.cos(a+Math.PI)*R;add(x1,y,i%3===0);add(x2,y,i%3===1);st.push([x1,y,x2]);}
          for(let i=0;i<N;i+=3){line(st[i][0],st[i][1],st[i][2],st[i][1],4,0);} break; }
        case 'chemistry':{ const R=s*0.3,V=[];for(let k=0;k<6;k++){const a=-Math.PI/2+k*Math.PI/3;V.push([cx+Math.cos(a)*R,cy+Math.sin(a)*R]);}
          for(let k=0;k<6;k++){line(V[k][0],V[k][1],V[(k+1)%6][0],V[(k+1)%6][1],8,0);}
          for(let k=0;k<6;k+=2){const A=V[k],B=V[(k+1)%6];line(A[0]+(cx-A[0])*0.18,A[1]+(cy-A[1])*0.18,B[0]+(cx-B[0])*0.18,B[1]+(cy-B[1])*0.18,6,0);}
          V.forEach(v=>ell(v[0],v[1],s*0.022,s*0.022,8,2)); break; }
        case 'physics':{ for(let k=0;k<3;k++)ell(cx,cy,s*0.36,s*0.14,42,6,k*Math.PI/3);
          for(let i=0,N=rep(18);i<N;i++){const a=Math.random()*6.28,r=Math.random()*s*0.055;add(cx+Math.cos(a)*r,cy+Math.sin(a)*r,i%2===0);} break; }
        case 'psychology':{ const nd=[[-0.30,-0.22],[-0.32,0.14],[-0.02,-0.32],[0,0.0],[-0.05,0.30],[0.30,-0.12],[0.31,0.22]].map(p=>[cx+p[0]*s,cy+p[1]*s]);
          const ed=[[0,2],[0,3],[1,3],[1,4],[2,3],[3,4],[2,5],[3,5],[3,6],[4,6]];
          ed.forEach(pr=>line(nd[pr[0]][0],nd[pr[0]][1],nd[pr[1]][0],nd[pr[1]][1],7,0));
          nd.forEach((n,i)=>ell(n[0],n[1],s*0.024,s*0.024,9,2)); break; }
        case 'foundation-maths':{ const bw=s*0.62,x0=cx-bw/2,y0=cy-s*0.28,y1=cy+s*0.28;

          for(let r=0;r<3;r++){const y=cy-s*0.16+r*s*0.16;line(x0,y,x0+bw,y,10,0);for(let b=0;b<5;b++){const bx=x0+bw*(0.12+b*0.19);ell(bx,y,s*0.03,s*0.03,7,(r+b)%2?2:3);}} break; }
        case 'general-maths':{ const n=5,base=cy+s*0.28,x0=cx-s*0.3,bw=s*0.09,gap=s*0.03;
          for(let i=0;i<n;i++){const bx=x0+i*(bw+gap),hh=s*(0.13+0.5*(i/(n-1))),top=base-hh;line(bx,base,bx,top,10,0);line(bx+bw,base,bx+bw,top,10,0);line(bx,top,bx+bw,top,5,i===n-1?1:0);}
          line(x0-s*0.02,base,x0+n*(bw+gap),base,14,0); break; }
        case 'maths-methods':{ const W=s*0.74,x0=cx-W/2,A=s*0.2;line(x0,cy,x0+W,cy,16,0);
          for(let i=0,N=rep(50);i<N;i++){const f=i/(N-1),x=x0+f*W,y=cy-Math.sin(f*Math.PI*2)*A;add(x,y,i%9===0);} break; }
        case 'specialist-maths':{ ell(cx,cy,s*0.3,s*0.3,48,6);line(cx-s*0.4,cy,cx+s*0.4,cy,14,0);line(cx,cy-s*0.4,cx,cy+s*0.4,14,0);
          const a=-0.7;line(cx,cy,cx+Math.cos(a)*s*0.3,cy+Math.sin(a)*s*0.3,10,3);add(cx+Math.cos(a)*s*0.3,cy+Math.sin(a)*s*0.3,true); break; }
        case 'english':{ const pw=s*0.32,ph=s*0.36,top=cy-ph*0.5,bot=cy+ph*0.5,st=cy-ph*0.42;
          line(cx,st,cx,bot,8,0);
          line(cx,st,cx-pw,top+ph*0.06,8,0);line(cx-pw,top+ph*0.06,cx-pw,bot-ph*0.06,7,0);line(cx-pw,bot-ph*0.06,cx,bot,8,0);
          line(cx,st,cx+pw,top+ph*0.06,8,0);line(cx+pw,top+ph*0.06,cx+pw,bot-ph*0.06,7,0);line(cx+pw,bot-ph*0.06,cx,bot,8,0);
          for(let i=0;i<3;i++){const yy=cy-ph*0.16+i*ph*0.2;line(cx-pw*0.78,yy,cx-pw*0.15,yy,4,0);line(cx+pw*0.15,yy,cx+pw*0.78,yy,4,0);} break; }
        case 'modern-history':{ const bw=s*0.54,x0=cx-bw/2,baseY=cy+s*0.28,topY=cy-s*0.08;
          line(x0-s*0.03,baseY,x0+bw+s*0.03,baseY,14,0);line(x0,baseY-s*0.05,x0+bw,baseY-s*0.05,12,0);
          line(x0,topY,cx,topY-s*0.16,8,0);line(cx,topY-s*0.16,x0+bw,topY,8,0);line(x0,topY,x0+bw,topY,12,1);
          for(let k=0;k<4;k++){const colx=x0+s*0.05+k*(bw-s*0.1)/3;line(colx,topY,colx,baseY-s*0.05,9,0);} break; }
        case 'geography':{ for(let k=4;k>=1;k--){const rr=s*0.078*k;ell(cx,cy,rr,rr*0.6,20+k*5,5);}ell(cx,cy,s*0.02,s*0.02,6,1); break; }
        case 'economics':{ const W=s*0.62,H=s*0.5,x0=cx-W/2,yb=cy+H/2,yt=cy-H/2;
          line(x0,yt,x0,yb,12,0);line(x0,yb,x0+W,yb,14,0);
          for(let i=0,N=rep(26);i<N;i++){const f=i/(N-1);add(x0+f*W,yt+H*0.12+H*0.76*f,i%9===0);}
          for(let i=0,N=rep(26);i<N;i++){const f=i/(N-1);add(x0+f*W,yb-H*0.12-H*0.76*f,i%9===4);}
          add(cx,cy,true); break; }
        case 'business-management':{ const gear=(gx,gy,R,t)=>{ell(gx,gy,R,R,30,5);for(let k=0;k<t;k++){const a=k/t*6.28;line(gx+Math.cos(a)*R,gy+Math.sin(a)*R,gx+Math.cos(a)*(R+s*0.045),gy+Math.sin(a)*(R+s*0.045),3,0);}ell(gx,gy,R*0.36,R*0.36,10,3);};
          gear(cx-s*0.16,cy-s*0.06,s*0.18,10);gear(cx+s*0.16,cy+s*0.1,s*0.13,8); break; }
        case 'accounting':{ const pivot=cy-s*0.22,baseY=cy+s*0.3,bl=s*0.28;
          line(cx,pivot,cx,baseY,10,0);line(cx-s*0.12,baseY,cx+s*0.12,baseY,8,0);line(cx-bl,pivot,cx+bl,pivot,12,0);
          [-bl,bl].forEach(off=>{const ex=cx+off,drop=s*0.13;line(ex,pivot,ex-s*0.06,pivot+drop,4,0);line(ex,pivot,ex+s*0.06,pivot+drop,4,0);ell(ex,pivot+drop,s*0.07,s*0.032,14,3,0,0,Math.PI);});
          add(cx,pivot,true); break; }
        case 'health-hd':{ const S=s*0.021;
          for(let i=0,N=rep(62);i<N;i++){const th=i/N*6.28,hxx=16*Math.pow(Math.sin(th),3),hy=-(13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th));add(cx+hxx*S,cy+hy*S-s*0.02,i%9===0);}
          const W=s*0.72,x0=cx-W/2,yb=cy+s*0.28;
          for(let i=0,N=rep(42);i<N;i++){const f=i/(N-1),x=x0+f*W;let y=yb;if(f>0.44&&f<0.56)y=yb-Math.sin((f-0.44)/0.12*Math.PI)*s*0.13;add(x,y,i%11===0);} break; }
        case 'physical-ed':{ const W=s*0.68,x0=cx-W/2,ground=cy+s*0.26,bh=s*0.34,arcs=3;
          line(x0-s*0.03,ground,x0+W+s*0.03,ground,14,0);
          for(let i=0,N=rep(46);i<N;i++){const f=i/(N-1),x=x0+f*W,hh=Math.abs(Math.sin(f*Math.PI*arcs))*bh*(1-f*0.1);add(x,ground-hh,i%9===0);}
          const bx=x0+W*(1/(arcs*2)),by=ground-bh;ell(bx,by,s*0.052,s*0.052,16,2); break; }
        case 'visual-comm':{ const P0=[cx-s*0.3,cy+s*0.16],P3=[cx+s*0.3,cy-s*0.12],P1=[cx-s*0.05,cy-s*0.28],P2=[cx+s*0.1,cy+s*0.28];
          for(let i=0,N=rep(46);i<N;i++){const tt=i/(N-1),mt=1-tt;const x=mt*mt*mt*P0[0]+3*mt*mt*tt*P1[0]+3*mt*tt*tt*P2[0]+tt*tt*tt*P3[0];const y=mt*mt*mt*P0[1]+3*mt*mt*tt*P1[1]+3*mt*tt*tt*P2[1]+tt*tt*tt*P3[1];add(x,y,i%9===0);}
          line(P0[0],P0[1],P1[0],P1[1],6,0);line(P3[0],P3[1],P2[0],P2[1],6,0);
          [P1,P2].forEach(p=>ell(p[0],p[1],s*0.022,s*0.022,7,2));[P0,P3].forEach(p=>add(p[0],p[1],true)); break; }
        default:{ for(let k=0;k<3;k++)ell(cx,cy,s*0.36,s*0.14,42,6,k*Math.PI/3);
          for(let i=0,N=rep(18);i<N;i++){const a=Math.random()*6.28,r=Math.random()*s*0.055;add(cx+Math.cos(a)*r,cy+Math.sin(a)*r,i%2===0);} }
      }
      return {pts:P,cx:cx,cy:cy,s:s};
    }

    function rebuild(w,h){
      const g=genPoints(sid,w,h);
      e.cx=g.cx;e.cy=g.cy;e.s=g.s;
      let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
      g.pts.forEach(p=>{minx=Math.min(minx,p.tx);maxx=Math.max(maxx,p.tx);miny=Math.min(miny,p.ty);maxy=Math.max(maxy,p.ty);});
      const wx=maxx-minx||1,wy=maxy-miny||1;
      e.P=g.pts.map(p=>{
        const dx=p.tx-g.cx,dy=p.ty-g.cy;
        const ang=Math.atan2(dy,dx)+(Math.random()-0.5)*0.9,rad=g.s*(0.55+Math.random()*0.55);
        const sw=((p.tx-minx)/wx*0.62+(maxy-p.ty)/wy*0.38);
        return {tx:p.tx,ty:p.ty,acc:p.acc,seed:Math.random(),pz:0.65+Math.random()*0.7,
          fd:(1-sw)*0.16+Math.random()*0.05, bd:sw*0.18+Math.random()*0.05,
          sx:g.cx+(Math.random()-0.5)*w*1.25, sy:g.cy+(Math.random()-0.5)*h*1.4,
          ex:g.cx+Math.cos(ang)*rad, ey:g.cy+Math.sin(ang)*rad};
      });
      e.sid=sid;
    }

    function aliveP(p,t,f){
      let bx=p.tx, by=p.ty;
      if(motion==='rotate'){ const a=t*0.2*f, dx=bx-e.cx, dy=by-e.cy, c=Math.cos(a), sn=Math.sin(a); bx=e.cx+dx*c-dy*sn; by=e.cy+dx*sn+dy*c; }
      else if(motion==='wave'){ by += f*Math.sin(((bx-e.cx)/e.s)*6.3 - t*2.0)*e.s*0.022; }
      else if(motion==='breathe'){ const k=1+f*0.035*Math.sin(t*1.4); bx=e.cx+(bx-e.cx)*k; by=e.cy+(by-e.cy)*k; }
      return [bx,by];
    }

    const t0=performance.now();let raf;
    function frame(now){
      const cv2=cvRef.current;if(!cv2)return;
      const rect=cv2.getBoundingClientRect();if(!rect.width)return;
      const w=rect.width,h=rect.height;
      if(Math.abs(w-e.cw)>0.5||Math.abs(h-e.ch)>0.5){cv2.width=Math.round(w*dpr);cv2.height=Math.round(h*dpr);e.cw=w;e.ch=h;e.sid=null;}
      if(e.sid!==sid)rebuild(w,h);
      const t=reduce?2:(now-t0)/1000*speed;
      const ct=reduce?0.5:(t%CYCLE)/CYCLE;
      if(ct<e.lastCt){for(const p of e.P){p.sx=e.cx+(Math.random()-0.5)*w*1.25;p.sy=e.cy+(Math.random()-0.5)*h*1.4;}}
      e.lastCt=ct;
      const FS=0.03,FD=0.28,HOLD=0.70,BS=0.72,BD=0.26;
      const sweepX=((t*0.35)%1.5)-0.25;
      const pulseWave=motion==='pulse';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,w,h);
      ctx.globalCompositeOperation='lighter';
      for(const p of e.P){
        let x,y,alpha,formed;
        if(ct<HOLD){
          const fp=clamp((ct-FS-p.fd)/FD); formed=ease(fp);
          const bb=aliveP(p,t,formed);
          x=p.sx+(bb[0]-p.sx)*formed; y=p.sy+(bb[1]-p.sy)*formed; alpha=clamp(fp*1.3);
          const tb=(1-formed)*e.s*0.05;
          x+=Math.sin(t*1.1+p.seed*30)*tb; y+=Math.cos(t*1.3+p.seed*24)*tb;
        } else {
          const bp=clamp((ct-BS-p.bd)/BD); const q=ease(bp); formed=1;
          const bb=aliveP(p,t,1);
          x=bb[0]+(p.ex-bb[0])*q; y=bb[1]+(p.ey-bb[1])*q;
          const tb=q*e.s*0.105;
          x+=Math.sin(t*1.2+p.seed*30)*tb;
          y+=Math.cos(t*1.5+p.seed*25)*tb - q*q*e.s*0.16;
          alpha=Math.pow(1-q,1.5); formed=1-q*0.6;
        }
        x+=Math.sin(t*0.8+p.seed*6.28)*e.s*0.003;
        y+=Math.cos(t*0.7+p.seed*6.28)*e.s*0.003;
        const nx=(x-e.cx)/e.s+0.5;
        let hl=Math.exp(-Math.pow(nx-sweepX,2)/0.02);
        if(pulseWave) hl=Math.max(hl, Math.exp(-Math.pow(p.seed-((t*0.5)%1.4),2)/0.02));
        const tw=0.55+0.45*Math.sin(t*1.5+p.seed*6.28);
        let cr=col.r,cg=col.g,cb2=col.b;
        if(p.acc){ cr+=(255-cr)*0.72; cg+=(255-cg)*0.72; cb2+=(255-cb2)*0.72; }
        cr+=(255-cr)*hl*0.6; cg+=(255-cg)*hl*0.6; cb2+=(255-cb2)*hl*0.6;
        let a=(p.acc?0.8:0.6)*(0.5+0.5*tw)*(0.7+0.9*hl)*alpha;
        if(a>0.95)a=0.95; if(a<=0.012) continue;
        const sz=(p.acc?1.3:0.85)*p.pz*(1+0.4*hl)*(0.55+0.45*formed);
                ctx.fillStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb2|0)+','+a.toFixed(3)+')';
        ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
      }
      ctx.globalCompositeOperation='source-over';
    }
    function loop(now){frame(now);raf=requestAnimationFrame(loop);}
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[subjectId,color,speed]);
  return <canvas ref={cvRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block'}}/>;
}

// ─── BLOCK 1: SubjectGraphic ───────────
function SubjectGraphic({subjectId,color,active=false,style:sx}){
  const cvRef=useRef(null);
  const stRef=useRef({parts:[],trail:[],ready:false});
  useEffect(()=>{
    const cv=cvRef.current;if(!cv)return;
    const st=stRef.current;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    let t=0,last=performance.now(),raf;
    function h2r(h){h=(h||'#888888').replace('#','');const n=parseInt(h,16)||0;return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
    const c=h2r(color),W={r:255,g:255,b:255},white=W;
    const I=active?0.95:0.5;
    const rgba=(col,a)=>`rgba(${col.r},${col.g},${col.b},${a})`;
    const glow=(ctx,col,b)=>{ctx.shadowColor=col;ctx.shadowBlur=b;};
    function draw(t){
      const cv2=cvRef.current;if(!cv2)return;
      const rc=cv2.getBoundingClientRect();if(!rc.width)return;
      if(Math.abs(cv2.width-Math.round(rc.width*dpr))>0.5){cv2.width=Math.round(rc.width*dpr);cv2.height=Math.round(rc.height*dpr);st.ready=false;}
      const ctx=cv2.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,rc.width,rc.height);ctx.lineCap='round';ctx.lineJoin='round';
      const cx=rc.width/2,cy=rc.height/2,s=Math.min(rc.width,rc.height);
      switch(subjectId){
        case 'biology':{ // rotating DNA double helix
        const N=12,R=s*0.17,H=s*0.62,top=cy-H/2,p1=[],p2=[];
        for(let i=0;i<N;i++){const f=i/(N-1),a=f*Math.PI*3+t*1.05,y=top+f*H;
          p1.push([cx+Math.cos(a)*R,y,Math.sin(a)]); p2.push([cx+Math.cos(a+Math.PI)*R,y,Math.sin(a+Math.PI)]);}
        for(let i=0;i<N;i++){const z=(p1[i][2]+1)/2; ctx.strokeStyle=rgba(c,(0.15+0.45*z)*(0.6+0.4*I)); ctx.lineWidth=1.3;
          ctx.beginPath();ctx.moveTo(p1[i][0],p1[i][1]);ctx.lineTo(p2[i][0],p2[i][1]);ctx.stroke();}
        glow(ctx,rgba(c,0.6),s*0.05*(0.4+I));
        for(const P of [p1,p2]){ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=2;ctx.beginPath();
          P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
        ctx.shadowBlur=0;
        for(const P of [p1,p2])for(const p of P){const z=(p[2]+1)/2,r=1.3+2.4*z;
          glow(ctx,rgba(c,0.9),7*z*(0.4+I)); ctx.fillStyle=z>0.62?rgba(white,0.92):rgba(c,0.55+0.3*z);
          ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();}
        ctx.shadowBlur=0; break;
      }
        case 'chemistry':{ // flask with rising bubbles
        const nw=s*0.05,y0=cy-0.30*s,y1=cy-0.09*s,y2=cy+0.30*s,bw=s*0.22,ly=cy+0.04*s;
        if(!st.ready){ st.parts=Array.from({length:7},()=>({x:cx+(Math.random()-0.5)*bw*1.3,y:y2-Math.random()*(y2-ly),r:1+Math.random()*1.4,sp:18+Math.random()*22})); st.ready=true; }
        ctx.save();
        ctx.beginPath();ctx.moveTo(cx-nw,y1);ctx.lineTo(cx-bw,y2);ctx.lineTo(cx+bw,y2);ctx.lineTo(cx+nw,y1);ctx.closePath();ctx.clip();
        ctx.fillStyle=rgba(c,0.26+0.12*I);
        ctx.beginPath();ctx.moveTo(cx-bw,y2);ctx.lineTo(cx+bw,y2);ctx.lineTo(cx+bw,ly);
        for(let x=cx+bw;x>=cx-bw;x-=4){ctx.lineTo(x,ly+Math.sin(x*0.06+t*3)*2.2);} ctx.closePath();ctx.fill();
        for(const b of st.parts){ b.y-=b.sp*(0.6+I)*0.016; if(b.y<ly-1){b.y=y2-3;b.x=cx+(Math.random()-0.5)*bw*1.3;}
          glow(ctx,rgba(c,0.8),5); ctx.fillStyle=rgba(white,0.7); ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();}
        ctx.restore();ctx.shadowBlur=0;
        glow(ctx,rgba(c,0.5),s*0.04*(0.4+I));
        ctx.strokeStyle=rgba(c,0.9);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-nw,y0);ctx.lineTo(cx-nw,y1);ctx.lineTo(cx-bw,y2);ctx.lineTo(cx+bw,y2);ctx.lineTo(cx+nw,y1);ctx.lineTo(cx+nw,y0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-nw*1.6,y0);ctx.lineTo(cx+nw*1.6,y0);ctx.stroke();
        ctx.shadowBlur=0; break;
      }
        case 'physics':{ // atom — nucleus + orbiting electrons
        const rx=s*0.31,ry=s*0.12;
        for(let k=0;k<3;k++){ ctx.save();ctx.translate(cx,cy);ctx.rotate(k*Math.PI/3);
          ctx.strokeStyle=rgba(c,0.45*(0.6+0.4*I));ctx.lineWidth=1.4;
          ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.stroke();
          const a=t*1.5+k*2.1,ex=Math.cos(a)*rx,ey=Math.sin(a)*ry;
          glow(ctx,rgba(c,0.9),8*(0.4+I));ctx.fillStyle=rgba(white,0.95);
          ctx.beginPath();ctx.arc(ex,ey,2.6,0,7);ctx.fill();ctx.shadowBlur=0;ctx.restore();}
        glow(ctx,rgba(c,1),14*(0.5+I));ctx.fillStyle=rgba(c,0.95);
        ctx.beginPath();ctx.arc(cx,cy,s*0.05,0,7);ctx.fill();ctx.shadowBlur=0;
        ctx.fillStyle=rgba(white,0.85);ctx.beginPath();ctx.arc(cx,cy,s*0.022,0,7);ctx.fill(); break;
      }
        case 'psychology':{ // neural network — nodes with synaptic pulses
        const nd=[
          [cx-s*0.27,cy-s*0.17],[cx-s*0.28,cy+s*0.10],
          [cx-s*0.02,cy-s*0.25],[cx,cy+s*0.02],[cx-s*0.05,cy+s*0.24],
          [cx+s*0.26,cy-s*0.09],[cx+s*0.27,cy+s*0.16],
        ];
        const ed=[[0,2],[0,3],[1,3],[1,4],[2,3],[3,4],[2,5],[3,5],[3,6],[4,6]];
        ctx.lineWidth=1.2;
        ed.forEach(pr=>{const a=nd[pr[0]],b=nd[pr[1]];ctx.strokeStyle=rgba(c,0.22*(0.7+0.3*I));ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});
        ed.forEach((pr,i)=>{const a=nd[pr[0]],b=nd[pr[1]];const p=(t*0.6+i*0.37)%1;const px=a[0]+(b[0]-a[0])*p,py=a[1]+(b[1]-a[1])*p;glow(ctx,rgba(c,0.9),6*(0.4+I));ctx.fillStyle=rgba(white,0.85);ctx.beginPath();ctx.arc(px,py,1.7,0,7);ctx.fill();});ctx.shadowBlur=0;
        nd.forEach((n,i)=>{const pulse=0.5+0.5*Math.sin(t*1.6+i);const r=s*0.018+s*0.006*pulse;glow(ctx,rgba(c,0.85),9*(0.4+I));const core=i%3===0;ctx.fillStyle=core?rgba(white,0.92):rgba(c,0.6+0.3*pulse);ctx.beginPath();ctx.arc(n[0],n[1],r,0,7);ctx.fill();});ctx.shadowBlur=0; break;
      }
        case 'foundation-maths':{ // abacus — sliding bead counts
        const bw=s*0.5,x0=cx-bw/2,rows=3;
        ctx.strokeStyle=rgba(c,0.35);ctx.lineWidth=1.6;
        ctx.strokeRect(x0-s*0.03,cy-s*0.26,bw+s*0.06,s*0.52);
        for(let r=0;r<rows;r++){
          const y=cy-s*0.17+r*s*0.17;
          ctx.strokeStyle=rgba(c,0.26);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+bw,y);ctx.stroke();
          const beads=5,br=s*0.03,gap=br*2.15;
          const shift=0.5+0.5*Math.sin(t*0.7+r*1.1);
          const split=1+Math.round(shift*3);
          for(let k=0;k<beads;k++){
            let bx;
            if(k<beads-split){ bx=x0+br+k*gap; }
            else { const j=k-(beads-split); bx=x0+bw-br-(split-1-j)*gap; }
            const on=k>=beads-split;
            glow(ctx,rgba(c,on?0.8:0.25),on?8*(0.4+I):3);
            ctx.fillStyle=on?rgba(c,0.9):rgba(c,0.4);
            ctx.beginPath();ctx.arc(bx,y,br,0,7);ctx.fill();ctx.shadowBlur=0;
            if(on){ctx.fillStyle=rgba(white,0.5);ctx.beginPath();ctx.arc(bx-br*0.3,y-br*0.3,br*0.28,0,7);ctx.fill();}
          }
        } break;
      }
        case 'general-maths':{ // growing bar chart
        const n=5,baseY=cy+s*0.2,x0=cx-s*0.26,bw=s*0.07,gap=s*0.045,H=s*0.34;
        ctx.strokeStyle=rgba(c,0.2);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0-s*0.02,baseY);ctx.lineTo(x0+(n-1)*(bw+gap)+bw+s*0.02,baseY);ctx.stroke();
        let peak=[0,1e9];
        for(let i=0;i<n;i++){
          const bx=x0+i*(bw+gap);
          const hh=H*(0.28+0.62*(0.5+0.5*Math.sin(t*1.1+i*0.8)));
          const top=baseY-hh;
          ctx.fillStyle=rgba(c,0.2+0.1*I);ctx.fillRect(bx,top,bw,hh);
          glow(ctx,rgba(c,0.5),s*0.02*(0.4+I));
          ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=1.4;ctx.strokeRect(bx,top,bw,hh);ctx.shadowBlur=0;
          if(top<peak[1])peak=[bx+bw/2,top];
        }
        glow(ctx,rgba(c,0.9),9*(0.5+I));ctx.fillStyle=rgba(white,0.92);ctx.beginPath();ctx.arc(peak[0],peak[1],2.6,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'maths-methods':{ // sine curve with sweeping integral area
        const W=s*0.64,A=s*0.16,x0=cx-W/2;
        ctx.strokeStyle=rgba(c,0.18);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x0+W,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x0,cy-A*1.5);ctx.lineTo(x0,cy+A*1.5);ctx.stroke();
        const fx=(x)=>cy-Math.sin((x-x0)/W*Math.PI*2)*A;
        const xp=x0+W*(Math.sin(t*0.5)*0.5+0.5);
        ctx.fillStyle=rgba(c,0.15+0.1*I);
        ctx.beginPath();ctx.moveTo(x0,cy);for(let x=x0;x<=xp;x+=3)ctx.lineTo(x,fx(x));ctx.lineTo(xp,cy);ctx.closePath();ctx.fill();
        glow(ctx,rgba(c,0.6),s*0.045*(0.4+I));
        ctx.strokeStyle=rgba(c,0.9);ctx.lineWidth=2;ctx.beginPath();
        for(let x=x0;x<=x0+W;x+=2){const y=fx(x);x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();ctx.shadowBlur=0;
        glow(ctx,rgba(c,0.9),8);ctx.fillStyle=rgba(white,0.95);
        ctx.beginPath();ctx.arc(xp,fx(xp),3,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'specialist-maths':{ // Argand plane — rotating vector + trail
        const R=s*0.27;
        ctx.strokeStyle=rgba(c,0.16);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(cx-R*1.3,cy);ctx.lineTo(cx+R*1.3,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx,cy-R*1.3);ctx.lineTo(cx,cy+R*1.3);ctx.stroke();
        ctx.strokeStyle=rgba(c,0.4);ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(cx,cy,R,R,0,0,7);ctx.stroke();
        const a=t*1.15,ex=cx+Math.cos(a)*R,ey=cy-Math.sin(a)*R;
        st.trail.unshift([ex,ey]); if(st.trail.length>16)st.trail.pop();
        st.trail.forEach((p,i)=>{const al=(1-i/16)*0.5;glow(ctx,rgba(c,al),5);ctx.fillStyle=rgba(c,al);ctx.beginPath();ctx.arc(p[0],p[1],2,0,7);ctx.fill();});ctx.shadowBlur=0;
        ctx.setLineDash([3,3]);ctx.strokeStyle=rgba(c,0.28);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex,cy);ctx.moveTo(ex,ey);ctx.lineTo(cx,ey);ctx.stroke();ctx.setLineDash([]);
        glow(ctx,rgba(c,0.6),s*0.04*(0.4+I));
        ctx.strokeStyle=rgba(c,0.9);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();ctx.shadowBlur=0;
        glow(ctx,rgba(c,0.9),8);ctx.fillStyle=rgba(white,0.95);ctx.beginPath();ctx.arc(ex,ey,3,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'english':{ // open book with a turning page
        const pw=s*0.27,ph=s*0.34, spineTop=cy-ph*0.36, spineBot=cy+ph*0.5;
        const L=[[cx,spineTop],[cx-pw,cy-ph*0.5],[cx-pw,cy+ph*0.34],[cx,spineBot]];
        const Rg=[[cx,spineTop],[cx+pw,cy-ph*0.5],[cx+pw,cy+ph*0.34],[cx,spineBot]];
        const quad=(q,al,lw)=>{ctx.strokeStyle=rgba(c,al);ctx.lineWidth=lw;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();};
        const lines=(q,dir)=>{for(let i=0;i<4;i++){const f=0.2+i*0.19;
          const x1=cx+dir*pw*0.13,y1=q[0][1]+(q[3][1]-q[0][1])*f;
          const x2=cx+dir*pw*0.82,y2=q[1][1]+(q[2][1]-q[1][1])*f;
          ctx.strokeStyle=rgba(c,0.28);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}};
        glow(ctx,rgba(c,0.4),s*0.035*(0.4+I));
        quad(L,0.85,1.8);quad(Rg,0.85,1.8);ctx.shadowBlur=0;
        lines(L,-1);lines(Rg,1);
        const ang=(Math.sin(t*0.8)*0.5+0.5); const px=cx+Math.cos(Math.PI*ang)*pw;
        ctx.globalAlpha=0.55; quad([[cx,spineTop],[px,cy-ph*0.46],[px,cy+ph*0.3],[cx,spineBot]],0.8,1.5); ctx.globalAlpha=1;
        glow(ctx,rgba(c,0.9),8*(0.4+I));ctx.fillStyle=rgba(white,0.92);ctx.beginPath();ctx.arc(cx,spineTop,2.5,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'modern-history':{ // isometric tiers assembling (ziggurat)
        const tiers=4,baseW=s*0.27,dW=s*0.052,dh=s*0.07,gap=s*0.085;
        const cycle=(t*0.4)%(tiers+1.6);
        let topY=cy;
        for(let k=0;k<tiers;k++){ const rx=baseW-k*dW,ry=rx*0.5;
          const settle=Math.max(0,Math.min(1,cycle-k));
          const baseY=cy+s*0.15-k*gap;
          const yy=baseY+(1-settle)*(-s*0.26);
          const al=0.35+0.55*settle;
          ctx.fillStyle=rgba(c,0.12*al);ctx.strokeStyle=rgba(c,0.8*al);ctx.lineWidth=1.4;
          ctx.beginPath();ctx.moveTo(cx-rx,yy);ctx.lineTo(cx,yy+ry);ctx.lineTo(cx,yy+ry+dh);ctx.lineTo(cx-rx,yy+dh);ctx.closePath();ctx.fill();ctx.stroke();
          ctx.fillStyle=rgba(c,0.18*al);
          ctx.beginPath();ctx.moveTo(cx+rx,yy);ctx.lineTo(cx,yy+ry);ctx.lineTo(cx,yy+ry+dh);ctx.lineTo(cx+rx,yy+dh);ctx.closePath();ctx.fill();ctx.stroke();
          glow(ctx,rgba(c,0.5*al),s*0.03*(0.4+I));
          ctx.beginPath();ctx.moveTo(cx,yy-ry);ctx.lineTo(cx+rx,yy);ctx.lineTo(cx,yy+ry);ctx.lineTo(cx-rx,yy);ctx.closePath();
          ctx.fillStyle=rgba(c,0.22*al);ctx.fill();ctx.strokeStyle=rgba(c,0.9*al);ctx.lineWidth=1.6;ctx.stroke();ctx.shadowBlur=0;
          if(k===tiers-1) topY=yy-ry;
        }
        glow(ctx,rgba(c,0.9),10*(0.5+I));ctx.fillStyle=rgba(white,0.92);
        ctx.beginPath();ctx.arc(cx,topY-s*0.04,2.6,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'geography':{ // contour topography + radar sweep
        const rings=5;
        for(let k=rings;k>=1;k--){ const baseR=s*0.066*k;
          ctx.strokeStyle=rgba(c,0.22+0.13*(rings-k)/rings);ctx.lineWidth=1.4;ctx.beginPath();
          for(let a=0;a<=Math.PI*2+0.1;a+=0.2){const rr=baseR+Math.sin(a*3+k*0.8+t*0.3)*s*0.014*0.5*k*0.4;
            const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*0.62; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
          ctx.closePath();ctx.stroke();}
        const a=t*0.9,len=s*0.066*rings;
        glow(ctx,rgba(c,0.7),s*0.04*(0.4+I));
        ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len*0.62);ctx.stroke();ctx.shadowBlur=0;
        glow(ctx,rgba(c,0.9),10*(0.5+I));ctx.fillStyle=rgba(white,0.95);ctx.beginPath();ctx.arc(cx,cy,2.6,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'economics':{ // supply & demand curves crossing at equilibrium
        const W=s*0.56,H=s*0.42,x0=cx-W/2,yb=cy+H/2,yt=cy-H/2;
        ctx.strokeStyle=rgba(c,0.2);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(x0,yt);ctx.lineTo(x0,yb);ctx.lineTo(x0+W,yb);ctx.stroke();
        const sh=Math.sin(t*0.55)*s*0.04;
        glow(ctx,rgba(c,0.4),s*0.02*(0.4+I));
        ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x0,yt+H*0.12);ctx.quadraticCurveTo(cx,cy,x0+W,yb-H*0.12);ctx.stroke();
        ctx.strokeStyle=rgba(c,0.55);
        ctx.beginPath();ctx.moveTo(x0,yb-H*0.10+sh);ctx.quadraticCurveTo(cx,cy+sh,x0+W,yt+H*0.10+sh);ctx.stroke();ctx.shadowBlur=0;
        const ix=cx, iy=cy+sh*0.5;
        ctx.setLineDash([3,3]);ctx.strokeStyle=rgba(c,0.3);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(ix,yb);ctx.moveTo(ix,iy);ctx.lineTo(x0,iy);ctx.stroke();ctx.setLineDash([]);
        const pulse=0.5+0.5*Math.sin(t*2.4);
        glow(ctx,rgba(c,0.9),(8+4*pulse)*(0.5+I));ctx.fillStyle=rgba(white,0.95);ctx.beginPath();ctx.arc(ix,iy,2.8+pulse,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'business-management':{ // interlocking gears
        const gear=(gx,gy,R,teeth,rot,alpha)=>{
          ctx.save();ctx.translate(gx,gy);ctx.rotate(rot);
          glow(ctx,rgba(c,0.4),s*0.02*(0.4+I));
          ctx.strokeStyle=rgba(c,alpha);ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
          for(let k=0;k<teeth;k++){const a=k/teeth*Math.PI*2;const x1=Math.cos(a)*R,y1=Math.sin(a)*R,x2=Math.cos(a)*(R+s*0.03),y2=Math.sin(a)*(R+s*0.03);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
          ctx.shadowBlur=0;
          ctx.strokeStyle=rgba(c,alpha*0.7);ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,R*0.4,0,7);ctx.stroke();
          ctx.restore();
        };
        const rot=t*0.7;
        gear(cx-s*0.12,cy-s*0.05,s*0.15,9,rot,0.85);
        gear(cx+s*0.14,cy+s*0.10,s*0.11,7,-rot*1.28+0.3,0.6);
        glow(ctx,rgba(c,0.9),9*(0.5+I));ctx.fillStyle=rgba(white,0.9);ctx.beginPath();ctx.arc(cx-s*0.12,cy-s*0.05,s*0.02,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'accounting':{ // balance scale tilting toward equilibrium
        const pivotY=cy-s*0.16, baseY=cy+s*0.26, bl=s*0.26;
        ctx.strokeStyle=rgba(c,0.55);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,pivotY);ctx.lineTo(cx,baseY);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-s*0.11,baseY);ctx.lineTo(cx+s*0.11,baseY);ctx.stroke();
        const ang=Math.sin(t*0.8)*0.16;
        const lx=cx-Math.cos(ang)*bl, ly=pivotY-Math.sin(ang)*bl;
        const rx=cx+Math.cos(ang)*bl, ry=pivotY+Math.sin(ang)*bl;
        glow(ctx,rgba(c,0.5),s*0.02*(0.4+I));
        ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(rx,ry);ctx.stroke();ctx.shadowBlur=0;
        const pan=(ex,ey)=>{const drop=s*0.09,py=ey+drop;
          ctx.strokeStyle=rgba(c,0.35);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-s*0.05,py);ctx.moveTo(ex,ey);ctx.lineTo(ex+s*0.05,py);ctx.stroke();
          ctx.strokeStyle=rgba(c,0.8);ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(ex,py,s*0.05,0,Math.PI);ctx.stroke();};
        pan(lx,ly);pan(rx,ry);
        glow(ctx,rgba(c,0.9),9*(0.5+I));ctx.fillStyle=rgba(white,0.92);ctx.beginPath();ctx.arc(cx,pivotY,2.8,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'health-hd':{ // ECG heartbeat trace
        const W=s*0.72,x0=cx-W/2,A=s*0.2,period=W/2;
        const beat=(f)=>{f=((f%1)+1)%1;let y=0;
          y+=Math.exp(-Math.pow((f-0.30)/0.03,2))*0.18;
          y-=Math.exp(-Math.pow((f-0.45)/0.012,2))*0.22;
          y+=Math.exp(-Math.pow((f-0.50)/0.014,2))*1.0;
          y-=Math.exp(-Math.pow((f-0.55)/0.016,2))*0.34;
          y+=Math.exp(-Math.pow((f-0.70)/0.035,2))*0.3;
          return y;};
        const ph=t*0.5;
        ctx.strokeStyle=rgba(c,0.14);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x0+W,cy);ctx.stroke();
        glow(ctx,rgba(c,0.5),s*0.03*(0.4+I));
        ctx.strokeStyle=rgba(c,0.85);ctx.lineWidth=2;ctx.beginPath();
        for(let x=x0;x<=x0+W;x+=2){const f=(x-x0)/period+ph;const y=cy-beat(f)*A;x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
        ctx.stroke();ctx.shadowBlur=0;
        const fx=x0+W, ff=(fx-x0)/period+ph, dy=cy-beat(ff)*A;
        glow(ctx,rgba(c,0.9),10*(0.5+I));ctx.fillStyle=rgba(white,0.95);ctx.beginPath();ctx.arc(fx,dy,3,0,7);ctx.fill();ctx.shadowBlur=0; break;
      }
        case 'phys-ed':{ // bouncing ball with parabolic arc + trail
        const W=s*0.6,x0=cx-W/2,ground=cy+s*0.24,bounceH=s*0.34,arcs=3;
        ctx.strokeStyle=rgba(c,0.18);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0-s*0.03,ground);ctx.lineTo(x0+W+s*0.03,ground);ctx.stroke();
        ctx.strokeStyle=rgba(c,0.2);ctx.lineWidth=1.4;ctx.beginPath();
        for(let i=0;i<=60;i++){const pp=i/60,xx=x0+pp*W,hh=Math.abs(Math.sin(pp*Math.PI*arcs))*bounceH*(1-pp*0.12);i?ctx.lineTo(xx,ground-hh-s*0.04):ctx.moveTo(xx,ground-hh-s*0.04);}
        ctx.stroke();
        const p=(t*0.5)%1,bx=x0+p*W,bh=Math.abs(Math.sin(p*Math.PI*arcs))*bounceH*(1-p*0.12),by=ground-bh-s*0.04;
        st.trail.unshift([bx,by]);if(st.trail.length>14)st.trail.pop();
        st.trail.forEach((pt,i)=>{const al=(1-i/14)*0.4;glow(ctx,rgba(c,al),5);ctx.fillStyle=rgba(c,al);ctx.beginPath();ctx.arc(pt[0],pt[1],2,0,7);ctx.fill();});ctx.shadowBlur=0;
        const br=s*0.045;
        glow(ctx,rgba(c,0.8),12*(0.5+I));ctx.fillStyle=rgba(c,0.9);ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();ctx.shadowBlur=0;
        ctx.strokeStyle=rgba(white,0.55);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(bx,by,br*0.62,0.5,2.3);ctx.stroke();
        ctx.fillStyle=rgba(white,0.85);ctx.beginPath();ctx.arc(bx-br*0.3,by-br*0.3,br*0.22,0,7);ctx.fill(); break;
      }
        case 'visual-comm':{ // pen-tool bezier curve with control handles
        const P0=[cx-s*0.28,cy+s*0.14],P3=[cx+s*0.28,cy-s*0.10];
        const P1=[cx-s*0.06,cy-s*0.22+Math.sin(t*0.9)*s*0.05];
        const P2=[cx+s*0.10,cy+s*0.24+Math.cos(t*0.8)*s*0.05];
        ctx.setLineDash([4,4]);ctx.strokeStyle=rgba(c,0.35);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.lineTo(P1[0],P1[1]);ctx.moveTo(P3[0],P3[1]);ctx.lineTo(P2[0],P2[1]);ctx.stroke();ctx.setLineDash([]);
        glow(ctx,rgba(c,0.55),s*0.03*(0.4+I));
        ctx.strokeStyle=rgba(c,0.9);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.bezierCurveTo(P1[0],P1[1],P2[0],P2[1],P3[0],P3[1]);ctx.stroke();ctx.shadowBlur=0;
        const tt=(t*0.35)%1,mt=1-tt;
        const bez=(a,b,cc,d)=>mt*mt*mt*a+3*mt*mt*tt*b+3*mt*tt*tt*cc+tt*tt*tt*d;
        const dx=bez(P0[0],P1[0],P2[0],P3[0]),dyy=bez(P0[1],P1[1],P2[1],P3[1]);
        glow(ctx,rgba(c,0.9),9*(0.5+I));ctx.fillStyle=rgba(white,0.95);ctx.beginPath();ctx.arc(dx,dyy,2.6,0,7);ctx.fill();ctx.shadowBlur=0;
        [P1,P2].forEach(p=>{ctx.strokeStyle=rgba(c,0.8);ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(p[0],p[1],s*0.02,0,7);ctx.stroke();});
        [P0,P3].forEach(p=>{const r=s*0.022;glow(ctx,rgba(c,0.7),6*(0.4+I));ctx.fillStyle=rgba(c,0.9);ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2);ctx.shadowBlur=0;ctx.fillStyle=rgba(white,0.85);ctx.fillRect(p[0]-r*0.4,p[1]-r*0.4,r*0.8,r*0.8);}); break;
      }
        default:{
          const R=s*0.24, N=3;
          ctx.strokeStyle=rgba(c,0.18);ctx.lineWidth=1.2;
          ctx.beginPath();ctx.ellipse(cx,cy,R,R,0,0,7);ctx.stroke();
          glow(ctx,rgba(c,1),12*(0.5+I));ctx.fillStyle=rgba(c,0.95);
          ctx.beginPath();ctx.arc(cx,cy,s*0.045,0,7);ctx.fill();ctx.shadowBlur=0;
          ctx.fillStyle=rgba(W,0.85);ctx.beginPath();ctx.arc(cx,cy,s*0.02,0,7);ctx.fill();
          for(let k=0;k<N;k++){
            const a=t*0.9+k*(Math.PI*2/N);
            const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
            glow(ctx,rgba(c,0.9),8*(0.4+I));
            ctx.fillStyle=k===0?rgba(W,0.92):rgba(c,0.85);
            ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill();ctx.shadowBlur=0;
          }
          break;}
      }
    }
    function loop(now){t+=Math.min((now-last)/1000,0.05);last=now;draw(t);raf=requestAnimationFrame(loop);}
    raf=requestAnimationFrame(loop);
    return()=>cancelAnimationFrame(raf);
  },[subjectId,color,active]);
  return <canvas ref={cvRef} style={{width:'100%',height:'100%',display:'block',...(sx||{})}}/>;
}

// ─── Thin wrappers (keep Is* names so lookup map still works) ──────────────
function IsBiology({color,active}){return <SubjectGraphic subjectId="biology" color={color} active={active}/>;}
function IsChemistry({color,active}){return <SubjectGraphic subjectId="chemistry" color={color} active={active}/>;}
function IsPhysics({color,active}){return <SubjectGraphic subjectId="physics" color={color} active={active}/>;}

/* ── Interactive concept map ─────────────────────────── */
function ConceptMapViz({nodes,edges,tc,activeNode,onNodeClick}){
  const svgRef=useRef(null);
  const[mouse,setMouse]=useState({x:0,y:0});
  const[hov,setHov]=useState(null);
  // Large viewBox — not afraid of scrolling, nodes fully readable
  const W=800,H=420;
  const pos=nodes.map((n,i)=>{
    if(i===0)return{...n,x:W/2,y:H/2};
    const a=(i-1)*(2*Math.PI/(nodes.length-1))-Math.PI/2;
    return{...n,x:W/2+160*Math.cos(a),y:H/2+140*Math.sin(a)};
  });
  return(
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}
      onMouseMove={e=>{const r=svgRef.current?.getBoundingClientRect();if(r)setMouse({x:e.clientX-r.left,y:e.clientY-r.top});}}
      onMouseLeave={()=>setHov(null)} aria-label="Concept map">
      <defs>
        <radialGradient id="cmBg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor={tc} stopOpacity="0.06"/>
          <stop offset="100%" stopColor={tc} stopOpacity="0"/>
        </radialGradient>
      </defs>
      <rect width={W} height={H} fill="url(#cmBg)"/>
      {edges.map((e,i)=>{
        const f=pos.find(n=>n.id===e.from),t=pos.find(n=>n.id===e.to);
        if(!f||!t)return null;
        const on=hov===e.from||hov===e.to||activeNode===e.from||activeNode===e.to;
        return<line key={i} x1={f.x} y1={f.y} x2={t.x} y2={t.y}
          stroke={on?tc:'rgba(255,255,255,0.08)'} strokeWidth={on?2:0.8}
          style={{transition:'stroke .2s'}}/>;
      })}
      {pos.map((n,i)=>{
        const isC=i===0,act=activeNode===n.id,h=hov===n.id;
        const dist=Math.sqrt((mouse.x-n.x)**2+(mouse.y-n.y)**2);
        const pull=Math.max(0,1-dist/200)*6;
        const dx=(mouse.x-n.x)/Math.max(dist,1)*pull;
        const dy=(mouse.y-n.y)/Math.max(dist,1)*pull;
        // Bigger nodes — text fits properly
        const r=isC?56:44;
        const fs=isC?13:11;
        return(
          <g key={n.id} transform={`translate(${dx},${dy})`}
            onClick={()=>onNodeClick(n.id)} onMouseEnter={()=>setHov(n.id)} style={{cursor:'pointer'}}>
            <circle cx={n.x} cy={n.y} r={r+8} fill={tc} opacity={act||h?0.1:0} style={{transition:'opacity .2s'}}/>
            <circle cx={n.x} cy={n.y} r={r}
              fill={isC?`${tc}22`:"rgba(12,12,15,0.92)"}
              stroke={act||h?tc:'rgba(255,255,255,0.12)'}
              strokeWidth={act?2:0.9} style={{transition:'stroke .2s,fill .2s'}}/>
            {/* Text rendered as SVG text elements for crisp fit */}
            {(()=>{
              const words=n.label.split(' ');
              const lines=[];
              let cur='';
              // Wrap to ~12 chars per line
              words.forEach(w=>{
                if((cur+' '+w).trim().length>12&&cur){lines.push(cur.trim());cur=w;}
                else{cur=(cur+' '+w).trim();}
              });
              if(cur)lines.push(cur.trim());
              const totalH=lines.length*fs*1.3;
              const startY=n.y-totalH/2+fs*0.8;
              return lines.map((line,li)=>(
                <text key={li} x={n.x} y={startY+li*fs*1.3}
                  textAnchor="middle" fontSize={fs} fontWeight={isC?700:500}
                  fill={act||h?tc:isC?tc:'rgba(237,236,232,0.75)'}
                  fontFamily="Geist,system-ui,sans-serif"
                  style={{transition:'fill .2s',pointerEvents:'none'}}>
                  {line}
                </text>
              ));
            })()}
          </g>
        );
      })}
    </svg>
  );
}
