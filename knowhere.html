}

function ReadAloudBtn({text,tc,C,grow=1,onAccent=false,nowrap=false,className}){
  const[playing,setPlaying]=useState(false);
  const uttRef=useRef(null);

  const stop=()=>{
    window.speechSynthesis.cancel();
    setPlaying(false);
  };

  const getBestVoice=()=>{
    const voices=window.speechSynthesis.getVoices();
    const preferred=['Samantha','Karen','Daniel','Moira','Tessa','Google UK English Female','Google UK English Male'];
    return preferred.map(n=>voices.find(v=>v.name.includes(n))).find(Boolean)
      ||voices.find(v=>v.lang==='en-AU')
      ||voices.find(v=>v.lang.startsWith('en-'))
      ||voices[0];
  };

  const play=()=>{
    window.speechSynthesis.cancel();
    const utt=new SpeechSynthesisUtterance(text);
    const doSpeak=()=>{
      const pick=getBestVoice();
      if(pick) utt.voice=pick;
      utt.rate=0.92;utt.pitch=1.05;
      utt.onend=()=>setPlaying(false);
      utt.onerror=()=>setPlaying(false);
      uttRef.current=utt;
      window.speechSynthesis.speak(utt);
      setPlaying(true);
    };
    /* Voices may not be loaded yet — wait for them */
    if(window.speechSynthesis.getVoices().length){
      doSpeak();
    } else {
      window.speechSynthesis.onvoiceschanged=()=>{ window.speechSynthesis.onvoiceschanged=null; doSpeak(); };
    }
  };

  useEffect(()=>()=>window.speechSynthesis.cancel(),[]);

  return(
    <button className={className} onClick={playing?stop:play}
      style={{flex:grow,display:"flex",alignItems:"center",gap:7,padding:"13px 14px",border:"none",
        borderRight:onAccent?"1px solid rgba(255,255,255,0.18)":`1px solid ${tc}25`,
        background:className?undefined:(playing?(onAccent?"rgba(255,255,255,0.16)":`${tc}20`):"transparent"),
        color:className?undefined:(onAccent?"#FFFFFF":(playing?tc:C.text)),
        whiteSpace:nowrap?"nowrap":"normal",
        justifyContent:nowrap?"flex-start":"center",
        fontSize:onAccent?12.5:13,fontWeight:500,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>
      {playing?(
        /* Animated bars when playing */
        <span style={{display:"flex",gap:2,alignItems:"flex-end",height:13}}>
          <style>{`@keyframes sb{from{height:3px}to{height:12px}}`}</style>
          {[0,1,2].map(i=><span key={i} style={{width:3,borderRadius:2,background:onAccent?"#FFFFFF":tc,height:3,display:"block",animation:`sb .7s ease-in-out ${i*.15}s infinite alternate`}}/>)}
        </span>
      ):(
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M2 4.5h2l3-2.5v9L4 8.5H2v-4z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
          <path d="M9 4.5c.8.5 1.3 1.4 1.3 2.5s-.5 2-1.3 2.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
        </svg>
      )}
      {playing?"Stop":"Read aloud"}
    </button>
  );
}

function Lesson({type,neuro,repStyle,subject,topic,tc,onBack,onDone,onUndone,topicComplete,onGoTopic,user,onProfileOpen,onAddFlashcard,onRemoveFlashcard,flashcards=[],screen,onNav,onAddHighlight,onRemoveHighlight,highlights=[],sideNavCollapsed=false,bp='desktop'}){
  const[lessonData,setLessonData]=useState(null);
  const[loading,setLoading]=useState(true);
  /* Sticky footer stays out of the way until the reader reaches In The Know */
  const inTheKnowRef=useRef(null);
  const[footerReady,setFooterReady]=useState(false);
  useEffect(()=>{
    const onScroll=()=>{
      const el=inTheKnowRef.current;
      if(!el){setFooterReady(false);return;}
      setFooterReady(el.getBoundingClientRect().top<=window.innerHeight*0.8);
    };
    window.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll);
    onScroll();
    return()=>{window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll);};
  },[loading,lessonData]);
  // Quip rotator for loading screen — hooks must be at top level
  const QUIPS=useMemo(()=>getTopicQuips(type,topic),[type,topic]);
  const[qi,setQi]=useState(0);
  useEffect(()=>{
    if(!loading)return;
    setQi(0);
    const id=setInterval(()=>setQi(q=>(q+1)%QUIPS.length),2800);
    return()=>clearInterval(id);
  },[loading]);
  const[repMode,setRepMode]=useState(repStyle||'visual');
  const[activeIdx,setActiveIdx]=useState(0);
  const[understood,setUnderstood]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('ls_understood::'+subject.id+'::'+topic)||'{}');}catch(e){return {};}
  });
  /* Persist concept understanding + last-position marker for the dashboard */
  useEffect(()=>{
    try{
      localStorage.setItem('ls_understood::'+subject.id+'::'+topic,JSON.stringify(understood));
      const totalC=(lessonData?.concepts||[]).length;
      if(totalC>0){
        const doneC=Object.values(understood).filter(Boolean).length;
        localStorage.setItem('ls_resume',JSON.stringify({subjectId:subject.id,topic,done:doneC,total:totalC,ts:Date.now()}));
      }
    }catch(e){}
  },[understood,lessonData]);
  const[chatOpen,setChatOpen]=useState(null);
  const[quickQ,setQuickQ]=useState(null);
  const[unstuckOpen,setUnstuckOpen]=useState(null);

  const[addConceptOpen,setAddConceptOpen]=useState(false);
  /* Credit warning tip. Driven by state rather than :hover alone so touch
     devices get it too \u2014 hover-only meant a phone user on their last credit
     saw nothing and then hit a 402. */
  const[creditTipOpen,setCreditTipOpen]=useState(false);
  const creditTipRef=useRef(null);
  useEffect(()=>{
    if(!creditTipOpen)return;
    const onDoc=e=>{if(creditTipRef.current&&!creditTipRef.current.contains(e.target))setCreditTipOpen(false);};
    const onKey=e=>{if(e.key==='Escape')setCreditTipOpen(false);};
    document.addEventListener('pointerdown',onDoc);
    document.addEventListener('keydown',onKey);
    return()=>{document.removeEventListener('pointerdown',onDoc);document.removeEventListener('keydown',onKey);};
  },[creditTipOpen]);
  const[savedConcepts,setSavedConcepts]=useState(new Set());
  const[enriching,setEnriching]=useState(false);
  const[showReview,setShowReview]=useState(false);
  const[rating,setRating]=useState(0);
  const[flagged,setFlagged]=useState(false);
  const[testDone,setTestDone]=useState(false);
  /* Marking a topic understood used to navigate to the dashboard, which threw
     you out of the thing you had just finished reading. It toggles in place
     now, and offers the next topic rather than assuming you want to leave. */
  const[topicDone,setTopicDone]=useState(!!topicComplete);
  const[showNext,setShowNext]=useState(false);
  useEffect(()=>{setTopicDone(!!topicComplete);},[topicComplete]);
  const topicList=(subject&&subject.topics)||[];
  const nextTopic=(()=>{const i=topicList.indexOf(topic);return i>-1&&i<topicList.length-1?topicList[i+1]:null;})();
  const conceptRefs=useRef([]);
  /* One concept open at a time. First opens by default so the page never
     looks empty. This is the lazy-load: a collapsed card mounts no widget,
     so no canvas, no animation loop. */
  const[openIdx,setOpenIdx]=useState(0);
  /* ── goat guide context ── */
  const idxChangedAt=useRef(Date.now());
  useEffect(()=>{idxChangedAt.current=Date.now();},[openIdx]);
  const unstuckUsedRef=useRef(false);
  useEffect(()=>{if(unstuckOpen)unstuckUsedRef.current=true;goatRT.modalOpen=!!unstuckOpen;return()=>{goatRT.modalOpen=false;};},[unstuckOpen]);
  const selRef=useRef(false);
  useEffect(()=>{
    const h=()=>{try{const s=window.getSelection();if(s&&String(s).length>12)selRef.current=true;}catch(e){}};
    document.addEventListener('selectionchange',h);
    return()=>document.removeEventListener('selectionchange',h);
  },[]);
  const goatVK='lesson::'+subject.id+'::'+topic;
  const goat=useGoat('lesson',{
    ready:!loading&&!!lessonData,
    vk:goatVK,
    activeIdx:openIdx,
    idxChangedAt:idxChangedAt.current,
    curUnderstood:!!understood[(lessonData?.concepts||[])[openIdx]?.id],
    understoodCount:Object.values(understood).filter(Boolean).length,
    unstuckOpen:!!unstuckOpen,
    unstuckUsed:unstuckUsedRef,
    sel:selRef,
    highlightsCount:(highlights||[]).length
  },goatVK);
  /* Subject accents are tuned for dark backgrounds; several are far too light
     to read on white. Mix toward black for use on the expanded card. */
  const onWhite=(hex,amt)=>{
    const h=String(hex||'').replace('#','');
    if(h.length!==6)return hex;
    const f=1-(amt==null?0.42:amt);
    const p2=i=>Math.round(parseInt(h.slice(i,i+2),16)*f).toString(16).padStart(2,'0');
    return '#'+p2(0)+p2(2)+p2(4);
  };
  const[slimHidden,setSlimHidden]=useState(false);
  const slimLastY=useRef(0);
  useEffect(()=>{
    if(bp!=='mobile')return;
    const onS=()=>{
      const y=window.scrollY;
      const down=y>slimLastY.current;
      if(y>60&&down)setSlimHidden(true);
      else if(!down||y<40)setSlimHidden(false);
      slimLastY.current=y;
    };
    window.addEventListener('scroll',onS,{passive:true});
    return()=>window.removeEventListener('scroll',onS);
  },[bp]);
  const sys=buildSystem(type,neuro,subject,topic,repMode);

  // Sync saved-flashcard state with concepts once lesson data is available,
  // so the toggle correctly reflects flashcards already saved in a past session.
  // Must run before any early return below, so hook order stays stable.
  useEffect(()=>{
    const concepts=lessonData?.concepts||[];
    if(!concepts.length)return;
    const matchedIds=concepts
      .filter(c=>flashcards.some(f=>f.subject===subject.name&&f.topic===topic&&f.concept===c.title))
      .map(c=>c.id);
    if(matchedIds.length)setSavedConcepts(prev=>new Set([...prev,...matchedIds]));
  },[lessonData]);

  useEffect(()=>{
    let cancelled=false;
    setLoading(true);setLessonData(null);
    const t=topic,s=subject.name,tn=type.num,td=type.driver;

    /* Library concepts carry only title/explanation/points. Ask for the three
       missing student-facing fields in ONE batched call, then merge them in.
       Non-blocking: cards are already on screen and fill in when this lands.
       Cached per topic+type in localStorage so it costs one call, not one per view. */
    const enrichLibraryConcepts=(libConcepts,subSlug,topSlug)=>{
      const need=libConcepts.filter(c=>c&&c.title);
      if(!need.length)return;
      const ck='ls_reframe_v2_'+subSlug+'_'+topSlug+'_t'+tn+'_n'+need.length;
      const applyMap=(map)=>{
        if(cancelled)return;
        setLessonData(prev=>prev?{...prev,concepts:(prev.concepts||[]).map(c=>{
          const e=map[(c.title||'').toLowerCase().trim()];
          if(!e)return c;
          return{...c,reframe:c.reframe||e.reframe||''};
        })}:prev);
      };
      try{const hit=JSON.parse(localStorage.getItem(ck)||'null');if(hit){applyMap(hit);return;}}catch(e){}
      setEnriching(true);
      const list=need.map((c,i)=>(i+1)+'. '+c.title+(c.explanation?' — '+String(c.explanation).slice(0,160):'')).join('\n');
      const sys='You are an expert Year 12 '+s+' tutor. Reply in the exact labelled format requested. '+
        'Plain text only — no markdown, no bold, no quote marks. Never skip a field.';
      const pr='Topic: '+t+'. For EACH concept below, write one thing for an Enneagram Type '+tn+
        ' student whose driver is '+td+'.\n\n'+list+'\n\n'+
        'For each concept N output exactly this one line and nothing else:\n'+

        'C<N>_REFRAME: 1-2 sentences that make this land for this student, using a concrete analogy matching their driver. Speak directly to them. Do not mention personality types.\n'+
        '';
      api.post('/ai/chat',{system:sys,messages:[{role:'user',content:pr}],max_tokens:Math.min(4000,300+need.length*90)})
        .then(d=>{
          const txt=d&&d.text||'';
          if(!txt)return;
          const rx=/^[#*_>\s-]*C(\d+)_(REFRAME)\s*:\s*(.*)$/;
          const rows={};let cur=null;
          txt.split(/\r?\n/).forEach(raw=>{
            const m=raw.match(rx);
            if(m){const n=+m[1];rows[n]=rows[n]||{};cur=[n,m[2].toLowerCase()];rows[n][cur[1]]=(m[3]||'').trim();}
            else if(cur&&raw.trim()){rows[cur[0]][cur[1]]=(rows[cur[0]][cur[1]]?rows[cur[0]][cur[1]]+' ':'')+raw.trim();}
          });
          const strip=(v)=>(v||'').replace(/^[*_`"'\s]+|[*_`"'\s]+$/g,'').trim();
          const map={};
          need.forEach((c,i)=>{
            const r=rows[i+1];if(!r)return;
            map[(c.title||'').toLowerCase().trim()]={reframe:strip(r.reframe)};
          });
          const filled=Object.keys(map).length;
          if(!filled)return;
          if(filled<need.length)console.warn('[Knowhere enrich] '+filled+'/'+need.length+' concepts enriched');
          try{localStorage.setItem(ck,JSON.stringify(map));}catch(e){}
          applyMap(map);
        })
        .catch(()=>{})
        .then(()=>{if(!cancelled)setEnriching(false);});
    };
    const prompt=
      "You are a Year 12 "+s+" tutor. Create a lesson on "+t+" for an Enneagram Type "+tn+" learner.\n"+
      "Driver: "+td+"\n\n"+
      "Use these EXACT section markers. Put real curriculum content after each marker.\n"+
      "Do NOT use markdown formatting (no **bold**, no _italics_, no backticks, no quote marks) anywhere in your response — plain text only, especially for VIZ and VIZDATA values which must be exact lowercase keywords.\n\n"+
      "HOOK: Write ONE punchy sentence (max 20 words) that makes a Type "+tn+" student immediately want to learn "+t+". Speak directly to them. DO NOT mention Enneagram, types, or their motivation explicitly. Instead, make the sentence feel like it was written for someone who "+td+". Make it feel urgent, relevant, and impossible to ignore. No fluff. Pure hook.\n"+
      "INSIGHT: [the single most important thing to understand]\n"+
      "ANALOGY: One or two sentences, max 28 words. Reframe "+t+" as a tangible everyday scene a 16-18 year old already knows in their body (a nightclub, a snowball, a mosh pit, ghosting someone) — describe the thing it is LIKE, not the underlying science. Land 2-4 vivid SENSORY words, used truthfully and never shoehorned, from this palette: fire/lit/blaze, heat/hot/melting, cold/ice/frost, smoke/haze, wind/storm/gust, spark/electric/jolt/zap, beat/bass/slaps/bop/drop, glow/light/bright/neon/high-key, water/wave/ripple/splash/flow, gold/money/guap/stacks/bag, glitch/shake/crack/static, ghost/vanish/fade/gone, dance/spin/roll/drift. Confident, current, Gen-Z-native voice; at most one slang word and only if it fits. No jargon, no equations, no meta-commentary.\n"+
      "GOAT_SEARCH: 2-4 words naming a REAL goat clip whose action mirrors the analogy motion — e.g. a herd stampeding, goats climbing a cliff, baby goats headbutting, goats in snow. Real animals only: no people, cartoons, or vehicles.\n"+
      "ANALOGY_SCENE: [relationship OR transform — relationship = two things interacting side by side (e.g. acid and base, predator and prey); transform = one thing becomes another (e.g. monomer becomes polymer, caterpillar becomes butterfly)]\n"+
      "ANALOGY_A: [NAME:ICON — the first/left entity in the analogy. NAME is 1-3 words. ICON is ONE single emoji that visually represents it, e.g. \"Acid:🔑\" or \"Caterpillar:🐛\"]\n"+
      "ANALOGY_B: [NAME:ICON — the second/right entity, same format, e.g. \"Base:🔒\" or \"Butterfly:🦋\"]\n"+
      "ANALOGY_ACTION: [a short label for what happens between A and B, max 4 words, e.g. \"donates a proton\" or \"transforms over time\"]\n"+
      "EXAMTIP: [one specific Year 12 exam technique]\n"+
      "CONCEPT1_TITLE: [first key concept name]\n"+
      "CONCEPT1_SUMMARY: [one sentence]\n"+
      "CONCEPT1_EXPLAIN: [two sentences for Type "+tn+"]\n"+
      "CONCEPT1_POINTS: [point 1] | [point 2] | [point 3]\n"+
      "CONCEPT1_EXAM: [how examiners test this]\n"+
      "CONCEPT1_VIZ: [process OR system_map OR comparison OR field_relation OR none — pick whichever best fits this concept]\n"+
      "CONCEPT1_VIZDATA: [see format rules below — must match CONCEPT1_VIZ]\n"+
      "CONCEPT1_VIZWHY: [one sentence: what should this diagram show the student, and why does the chosen template represent that well?]\n"+
      "CONCEPT2_TITLE: [second concept]\n"+
      "CONCEPT2_SUMMARY: [one sentence]\n"+
      "CONCEPT2_EXPLAIN: [two sentences]\n"+
      "CONCEPT2_POINTS: [point 1] | [point 2] | [point 3]\n"+
      "CONCEPT2_EXAM: [exam note]\n"+
      "CONCEPT2_VIZ: [process OR system_map OR comparison OR field_relation OR none]\n"+
      "CONCEPT2_VIZDATA: [matching format]\n"+
      "CONCEPT2_VIZWHY: [one sentence, same as above]\n"+
      "CONCEPT2_REFRAME: [1-2 sentences that nail this concept for a Type "+tn+" student using a concrete analogy matching their driver: "+td+". Speak directly to the student.]\n"+
      "CONCEPT3_TITLE: [third concept]\n"+
      "CONCEPT3_SUMMARY: [one sentence]\n"+
      "CONCEPT3_EXPLAIN: [two sentences]\n"+
      "CONCEPT3_POINTS: [point 1] | [point 2] | [point 3]\n"+
      "CONCEPT3_EXAM: [exam note]\n"+
      "CONCEPT3_VIZ: [process OR system_map OR comparison OR field_relation OR none]\n"+
      "CONCEPT3_VIZDATA: [matching format]\n"+
      "CONCEPT3_VIZWHY: [one sentence, same as above]\n"+
      "CONCEPT3_REFRAME: [1-2 sentences that nail this concept for a Type "+tn+" student using a concrete analogy matching their driver: "+td+". Speak directly to the student.]\n\n"+
      "TEMPLATE GUIDE — what each one is FOR (pick based on the concept's core insight, not just its topic):\n"+
      "- process: the concept IS a sequence — something changes from one state to another in steps (e.g. a reaction mechanism, a transformation).\n"+
      "- system_map: the concept IS a set of interacting parts/factors that all influence a central thing (e.g. factors affecting equilibrium, homeostasis feedback).\n"+
      "- comparison: the concept IS fundamentally about two things that are similar-but-different, and the difference IS the point (e.g. SN1 vs SN2).\n"+
      "- field_relation: the concept IS about how a force/field/quantity depends on the separation/distance between two bodies (e.g. gravity, Coulomb's law, field strength, intermolecular forces) — use this whenever the core insight involves an inverse relationship with distance, or 'this acts along the line between two things'.\n"+
      "- none: the concept doesn't have a clear spatial/relational shape (e.g. a definition, a formula derivation, a classification list) — text alone is clearer than a forced diagram. Don't force a template if none fits well.\n\n"+
      "VIZDATA FORMAT — pipe-delimited, on ONE line, matching the chosen VIZ type:\n"+
      "- process: before=TEXT | change=TEXT | after=TEXT  (each TEXT is 1-4 words, e.g. \"before=Reactants | change=Bonds break and reform | after=Products\")\n"+
      "- system_map: center=TEXT | factor1=NAME:EFFECT | factor2=NAME:EFFECT | factor3=NAME:EFFECT  (2-4 factors, NAME is 1-3 words, EFFECT is one short sentence describing how it responds — e.g. \"center=Body temperature | factor1=Sweat glands:Increase sweating to cool the body | factor2=Blood vessels:Dilate to release heat\")\n"+
      "- comparison: a=NAME:DETAIL | b=NAME:DETAIL | difference=TEXT  (NAME is 1-3 words, DETAIL is 2-4 words, difference is one sentence — e.g. \"a=SN1:Two-step, carbocation | b=SN2:One-step, backside attack | difference=SN1 forms a carbocation intermediate while SN2 proceeds in a single concerted step\")\n"+
      "- field_relation: a=NAME:DETAIL | b=NAME:DETAIL | quantity=SYMBOL | constant=TEXT | relationship=TEXT  (use this for any concept about a force/field/interaction between two bodies separated by a distance or quantity — e.g. gravity, Coulomb's law, intermolecular forces, magnetic fields. a/b are the two interacting bodies, NAME is 1-2 words/symbols like \"Mass M\" or \"Charge q1\", DETAIL is a short label like \"larger mass\"; quantity is the single symbol for what separates them, e.g. \"r\" or \"d\"; constant is a short sentence stating the relevant constant, e.g. \"G is the gravitational constant, 6.67×10⁻¹¹ N m² kg⁻²\"; relationship is one sentence describing how the force changes with quantity, e.g. \"Doubling the distance quarters the force — an inverse square law\")\n"+
      "- If VIZ is none, write CONCEPT_VIZDATA: none\n\n"+
      "EVERY field listed above is REQUIRED — output all of them, in order, each on its own line, even if you have to give a brief best-effort answer. Never silently skip a field. Never write a label with no value after it.\n"+
      "Use REAL "+s+" Year 12 content. No brackets in answers — replace with actual content. Keep all VIZDATA fields short as specified — they power a compact diagram, not prose.";

    api.post("/ai/chat",{system:"Expert Year 12 "+s+" tutor. Follow the exact format requested.",messages:[{role:"user",content:prompt}],max_tokens:3200})
      .then(d=>{
        if(cancelled)return;if(d.error){setLessonData(makeFallback(t,s));setLoading(false);return;}
        const text=d.text||"";
        const LESSON_KEYS=(()=>{
          const base=["HOOK","HEADLINE","INSIGHT","ANALOGY","GOAT_SEARCH","ANALOGY_SCENE","ANALOGY_A","ANALOGY_B","ANALOGY_ACTION","EXAMTIP"];
          const per=["TITLE","SUMMARY","EXPLAIN","POINTS","EXAM","VIZ","VIZDATA","VIZWHY","REFRAME"];
          [1,2,3].forEach(n=>per.forEach(f=>base.push("CONCEPT"+n+"_"+f)));
          return new Set(base);
        })();
        const FIELDS={};
        (()=>{
          const rx=/^[#*_>\s-]*([A-Z][A-Z0-9_]{2,})\s*:\s*(.*)$/;
          // The model sometimes runs the next field on to the end of the
          // previous line ("...real action drops. GOAT_SEARCH: ..."). Break
          // any known key out on to its own line first. Longest key first so
          // ANALOGY_SCENE isn't shadowed by ANALOGY.
          const keyAlt=[...LESSON_KEYS].sort((a,b)=>b.length-a.length).join("|");
          const norm=text.replace(new RegExp("[ \\t]+(?=(?:"+keyAlt+")\\s*:)","g"),"\n");
          let cur=null;
          norm.split(/\r?\n/).forEach(raw=>{
            const m=raw.match(rx);
            if(m&&LESSON_KEYS.has(m[1])){cur=m[1];FIELDS[cur]=(m[2]||"").trim();}
            else if(cur&&raw.trim()){FIELDS[cur]=(FIELDS[cur]?FIELDS[cur]+" ":"")+raw.trim();}
          });
        })();
        const get=(key)=>{
          // Strip stray markdown emphasis (** __ `) and quote characters the
          // AI sometimes wraps values in, despite instructions not to.
          return (FIELDS[key]||"").replace(/^[*_`"'\s]+|[*_`"'\s]+$/g,"").trim();
        };
        // Diagnostic: say plainly which requested fields the model didn't send,
        // so a missing card on the page can be told apart from a parse failure.
        (()=>{
          const absent=[...LESSON_KEYS].filter(k=>!(FIELDS[k]||"").trim());
          if(absent.length)console.warn("[Knowhere lesson] model omitted:",absent.join(", "));
          else console.log("[Knowhere lesson] all fields present");
        })();
        const getPoints=(key)=>{const l=get(key);return l?l.split("|").map(p=>p.trim()).filter(Boolean):["See content above"];};

        // Parse analogy tableau — ANALOGY_SCENE/A/B/ACTION into {scene,a,b,action}
        const parseAnalogyScene=()=>{
          const scene=get("ANALOGY_SCENE").toLowerCase().trim();
          const aRaw=get("ANALOGY_A"),bRaw=get("ANALOGY_B"),action=get("ANALOGY_ACTION");
          if((scene!=="relationship"&&scene!=="transform")||!aRaw||!bRaw||!action)return null;
          const splitNameIcon=(s)=>{
            const colon=s.lastIndexOf(":");
            if(colon<0)return{name:s.trim(),icon:""};
            return{name:s.slice(0,colon).trim(),icon:s.slice(colon+1).trim()};
          };
          const a=splitNameIcon(aRaw),b=splitNameIcon(bRaw);
          if(!a.name||!b.name)return null;
          return{scene,a,b,action};
        };

        // Parse VIZ + VIZDATA into {visual_template, visual_data}
        const parseViz=(vizKey,dataKey)=>{
          const template=get(vizKey).toLowerCase().trim();
          const raw=get(dataKey);
          if(!template||template==="none"||!raw||raw.toLowerCase()==="none")return{visual_template:null,visual_data:null};
          // Split top-level pipe-separated fields: key=value | key=value | ...
          const fields={};
          raw.split("|").forEach(part=>{
            const eq=part.indexOf("=");
            if(eq<0)return;
            const k=part.slice(0,eq).trim().toLowerCase();
            const v=part.slice(eq+1).trim().replace(/\*\*/g,"").trim();
            fields[k]=v;
          });
          if(template==="process"){
            if(!fields.before||!fields.change||!fields.after)return{visual_template:null,visual_data:null};
            return{visual_template:"process",visual_data:{before:fields.before,change:fields.change,after:fields.after}};
          }
          if(template==="system_map"){
            const factors=[];
            ["factor1","factor2","factor3","factor4"].forEach(fk=>{
              if(!fields[fk])return;
              const colon=fields[fk].indexOf(":");
              if(colon<0){factors.push({name:fields[fk],effect:""});return;}
              factors.push({name:fields[fk].slice(0,colon).trim(),effect:fields[fk].slice(colon+1).trim()});
            });
            if(!fields.center||factors.length<2)return{visual_template:null,visual_data:null};
            return{visual_template:"system_map",visual_data:{center:fields.center,factors}};
          }
          if(template==="comparison"){
            const parseAB=(s)=>{
              if(!s)return null;
              const colon=s.indexOf(":");
              return colon<0?{name:s,detail:""}:{name:s.slice(0,colon).trim(),detail:s.slice(colon+1).trim()};
            };
            const a=parseAB(fields.a),b=parseAB(fields.b);
            if(!a||!b||!fields.difference)return{visual_template:null,visual_data:null};
            return{visual_template:"comparison",visual_data:{a,b,difference:fields.difference}};
          }
          if(template==="field_relation"){
            const parseAB=(s)=>{
              if(!s)return null;
              const colon=s.indexOf(":");
              return colon<0?{name:s,detail:""}:{name:s.slice(0,colon).trim(),detail:s.slice(colon+1).trim()};
            };
            const a=parseAB(fields.a),b=parseAB(fields.b);
            if(!a||!b||!fields.quantity)return{visual_template:null,visual_data:null};
            return{visual_template:"field_relation",visual_data:{a,b,quantity:fields.quantity,constant:fields.constant||"",relationship:fields.relationship||""}};
          }
          return{visual_template:null,visual_data:null};
        };

        const c1=get("CONCEPT1_TITLE"),c2=get("CONCEPT2_TITLE"),c3=get("CONCEPT3_TITLE");
        if(!c1){setLessonData(makeFallback(t,s));setLoading(false);return;}
        const v1=parseViz("CONCEPT1_VIZ","CONCEPT1_VIZDATA");

        // Diagnostic: log the AI's rationale for each visual template choice,
        // so mismatches (template chosen but doesn't actually explain the
        // concept) can be spotted during testing.
        [["CONCEPT1_VIZWHY",v1],["CONCEPT2_VIZWHY",v2],["CONCEPT3_VIZWHY",v3]].forEach(([whyKey,v])=>{
          const why=get(whyKey);
          if(why)console.log("[Knowhere viz]",v.visual_template||"none","—",why);
        });
        if(cancelled)return;setLessonData({
          hook:get("HOOK")||"Exploring "+t,
          headline:get("HEADLINE")||"",
          key_insight:get("INSIGHT")||"",
          real_world_analogy:get("ANALOGY")||"",
          goat_search:get("GOAT_SEARCH")||"",
          analogy_scene:parseAnalogyScene(),
          exam_tip:get("EXAMTIP")||"",
          concepts:[
            {id:"c1",title:c1,summary:get("CONCEPT1_SUMMARY"),explanation:get("CONCEPT1_EXPLAIN"),reframe:get("CONCEPT1_REFRAME"),detail_points:getPoints("CONCEPT1_POINTS"),exam_relevance:get("CONCEPT1_EXAM"),...v1},
            {id:"c2",title:c2,summary:get("CONCEPT2_SUMMARY"),explanation:get("CONCEPT2_EXPLAIN"),reframe:get("CONCEPT2_REFRAME"),detail_points:getPoints("CONCEPT2_POINTS"),exam_relevance:get("CONCEPT2_EXAM"),...v2},
            {id:"c3",title:c3,summary:get("CONCEPT3_SUMMARY"),explanation:get("CONCEPT3_EXPLAIN"),reframe:get("CONCEPT3_REFRAME"),detail_points:getPoints("CONCEPT3_POINTS"),exam_relevance:get("CONCEPT3_EXAM"),...v3},
          ].filter(c=>c.title),
          concept_map:{
            nodes:[{id:"center",label:t},{id:"c1",label:c1},{id:"c2",label:c2},{id:"c3",label:c3}],
            edges:[{from:"center",to:"c1"},{from:"center",to:"c2"},{from:"center",to:"c3"}]
          }
        });
        setLoading(false);
        const subSlug=(s?.name||s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        const topSlug=(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');

        /* Curated concept library for this topic.
           The AI lesson format only ever returns 3 concepts (CONCEPT1/2/3), but
           the library may hold 8+ curriculum-mapped concepts. When the library
           has coverage, use it for the concept list — the AI lesson still
           supplies the page-level headline, insight, analogy and exam tip.
           Topics with no library coverage keep the AI concepts unchanged.
           The endpoint returns curated concepts only: other students' custom
           concepts live in the same shared cache and are filtered out server-side. */
        api.get(`/topic-concepts/${subSlug}/${topSlug}`).then(lib=>{
          if(lib.concepts?.length){
            setLessonData(prev=>{
              if(!prev)return prev;
              const byTitle=new Map();
              (prev.concepts||[]).forEach(c=>byTitle.set((c.title||'').toLowerCase().trim(),c));
              const merged=lib.concepts.map((lc,i)=>{
                /* keep any richer AI-authored fields when the titles line up */
                const ai=byTitle.get((lc.title||'').toLowerCase().trim())||{};
                return {
                  ...ai,
                  id:'c'+i,
                  title:lc.title,
                  explanation:lc.explanation||ai.explanation||'',
                  detail_points:(lc.detail_points&&lc.detail_points.length)?lc.detail_points:(ai.detail_points||[]),

                  visual_template:ai.visual_template||'library',

                };

              return {...prev,concepts:merged};

            enrichLibraryConcepts(lib.concepts,subSlug,topSlug);
          }
        }).catch(()=>{}).finally(()=>{
          /* The student's OWN custom concepts, appended last. Scoped to their

          api.get(`/user/concepts/${subSlug}/${topSlug}`).then(cr=>{
            if(cr.concepts?.length){
              setLessonData(prev=>prev?{...prev,concepts:[...prev.concepts,...cr.concepts.map(c=>({...c,isCustom:true}))]}:prev);
            }

        });
      }).catch(()=>{setLessonData(makeFallback(t,s));setLoading(false);});
    return()=>{cancelled=true;};
  },[topic,subject.id]);

  // Scroll-spy: pick the last concept section whose top has crossed a scan
  // line at 35% of the viewport. Always agrees with scroll position.
  useEffect(()=>{
    if(!lessonData)return;
    const n=(lessonData.concepts||[]).length;
    let raf=null;
    const compute=()=>{
      raf=null;
      const line=window.innerHeight*0.35;
      let idx=0;
      for(let i=0;i<n;i++){
        const el=document.getElementById("sec-c"+i);
        if(el&&el.getBoundingClientRect().top<=line)idx=i;
      }
      setActiveIdx(prev=>prev===idx?prev:idx);
    };
    const onScroll=()=>{if(raf==null)raf=requestAnimationFrame(compute);};
    window.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll,{passive:true});
    compute();
    return()=>{window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll);if(raf!=null)cancelAnimationFrame(raf);};
  },[lessonData]);

  /* Opening a concept collapses whichever was open. If that card sits ABOVE
     the target, the page shortens underneath us and a scroll measured in the

  const pendingScroll=useRef(null);
  useLayoutEffect(()=>{

  if(loading){

          <p key={qi} style={{fontSize:22,color:C.muted,fontWeight:300,letterSpacing:"-0.01em",animation:"quipFade 2.8s ease",margin:0}}>{QUIPS[qi]}</p>
        </div>
        <style>{`@keyframes quipFade{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0}}`}</style>
      </div>
    );
  }

  if(!lessonData)return(
    <div style={{paddingTop:52,minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",padding:"40px",textAlign:"center"}}>
      <div><p style={{color:"#FF8080",marginBottom:12,fontSize:14}}>Could not load lesson.</p><Btn onClick={()=>window.location.reload()} variant="ghost">Retry</Btn></div>
    </div>
  );

  const concepts=lessonData.concepts||[];
  const doneCount=Object.values(understood).filter(Boolean).length;

  return(
    <div style={{paddingTop:52,minHeight:"100dvh",display:"flex",flexDirection:"column"}}>

      {/* ══ HERO — full screen, Raycast-style ═══════════════ */}

        <div style={{position:"relative",zIndex:2,flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"space-between",textAlign:"center",padding:"clamp(64px,10vh,124px) 24px clamp(36px,6vh,68px)"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:"100%"}}>
            <p style={{fontSize:12,fontWeight:700,color:"#FFFFFF",margin:"0 0 16px",letterSpacing:"0.2em",textTransform:"uppercase"}}>{subject.name}</p>
            <h1 style={{fontSize:"clamp(48px,9vw,108px)",fontWeight:800,color:"#FFFFFF",letterSpacing:"-0.05em",lineHeight:0.95,margin:"0 0 24px",maxWidth:900,textShadow:`0 0 100px ${tc}40`}}>{topic}</h1>
            <p style={{fontSize:"clamp(16px,2.2vw,22px)",color:"rgba(255,255,255,0.75)",margin:0,lineHeight:1.6,fontWeight:400,maxWidth:680}}>{lessonData.hook}</p>
          </div>
          <button onClick={()=>document.getElementById("sec-c0")?.scrollIntoView({behavior:"smooth",block:"start"})}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,background:"none",border:"none",color:tc,cursor:"pointer",fontFamily:"inherit",fontSize:13,letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:600}}>
            Start knowing
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{animation:"bounceDown 2s ease infinite"}}>
              <path d="M3 5.5L7 9.5L11 5.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>

      </div>

      {goat.tip&&<GoatGuide tip={goat.tip} dismiss={goat.dismiss} kill={goat.kill} bp={bp}/>}
      {/* ══ IN THE WILD — full screen, staggered: title, image, text ═ */}
      <div style={{minHeight:"100dvh",display:"flex",alignItems:"center"}}>

              <h2 data-goat="itw" style={{fontSize:"clamp(32px,5vw,56px)",fontWeight:800,color:C.text,letterSpacing:"-0.04em",lineHeight:1.05,margin:"0 0 40px"}}>In The Wild</h2>

          {/* Add a concept — left, big, Pro only */}

            /* Four gates, not one. Locked (Core), last credit, spent on Pro and
               spent on Max read very differently, and the spent case used to
               surface only as a 402 AFTER the student had opened the modal and
               written their prompt. Nothing above Max, so that one gets no
               upsell \u2014 only the deadpan. */
            const _pl=(()=>{try{return JSON.parse(localStorage.getItem('ls_plan')||'{}');}catch(e){return {};}})();
            const planId=_pl.plan||'core';
            const isPro=planId==='pro'||planId==='max';
            const limit=Number(_pl.creditsTotal!=null?_pl.creditsTotal:(planId==='max'?30:planId==='pro'?10:0));
            const used=Number(_pl.creditsUsed||0);
            const left=Math.max(0,limit-used);
            const spent=isPro&&limit>0&&left<=0;

            const canAdd=isPro&&!spent;
            const tip=!isPro
              ?{expr:'side eye',body:<React.Fragment>Building your own concepts is a Pro thing. I don&rsquo;t make the rules.</React.Fragment>,cta:'Upgrade \u2192'}

               render invisible and a phone user on their last credit would get
               no warning at all \u2014 first tap opens it, second tap proceeds.
               Friction exists only in the states that warrant it. */
            const act=()=>{
              if(canAdd){setAddConceptOpen(true);return;}
              if(!isPro||(spent&&planId!=='max')){onNav&&onNav('subscription');}

                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                  {bp==="mobile"?"Add concept":"Add a concept"}
                  {/* The count only appears once it's worth watching. */}
                  {isPro&&limit>0&&left<=3&&(
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,letterSpacing:'0.06em',
                      padding:'2px 6px',borderRadius:5,marginLeft:2,
                      background:spent?'rgba(0,0,0,0.16)':'rgba(0,0,0,0.10)',
                      color:canAdd?'#0C0C0F':'rgba(255,255,255,0.7)'}}>{left}</span>
                  )}
                </button>
                {tip&&(
                  /* Goaty delivers the bad news. Purple: personality messaging,
                     not chrome. The old version put "Upgrade" in a span inside a
                     pointerEvents:none box, so it was never clickable. */
                  <div className="footer-add-tooltip" id="kh-credit-tip" role="note"
                    style={{position:'absolute',bottom:'calc(100% + 10px)',left:0,
                      width:bp==='mobile'?'min(274px, calc(100vw - 32px))':274,
                      background:'linear-gradient(158deg,#2a1e40,#171126)',
                      border:'1px solid rgba(155,111,212,0.55)',borderRadius:14,
                      padding:'13px 15px 11px',
                      boxShadow:'0 12px 32px rgba(0,0,0,0.55), 0 0 44px rgba(155,111,212,0.20)',
                      pointerEvents:creditTipOpen?'auto':'none',opacity:creditTipOpen?1:0,
                      transition:'opacity .15s',zIndex:99}}>
                    <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                      <GoatMark expr={tip.expr} size={26} style={{flexShrink:0,marginTop:1}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{margin:(tip.cta||bp==='mobile')?'0 0 9px':0,fontSize:12.5,lineHeight:1.5,color:'#EDEDE8',fontWeight:400}}>{tip.body}</p>
                        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                          {tip.cta&&(
                            <button onClick={(e)=>{e.stopPropagation();setCreditTipOpen(false);onNav&&onNav('subscription');}}
                              style={{background:'none',border:'1px solid rgba(155,111,212,0.45)',borderRadius:100,
                                cursor:'pointer',fontFamily:'inherit',fontSize:11.5,fontWeight:600,
                                color:'#B48FE3',padding:'5px 14px'}}>{tip.cta}</button>
                          )}

                          {bp==='mobile'&&canAdd&&(
                            <button onClick={(e)=>{e.stopPropagation();setCreditTipOpen(false);setAddConceptOpen(true);}}

                                cursor:'pointer',fontFamily:'inherit',fontSize:11.5,fontWeight:600,

                          )}
                          {bp==='mobile'&&(
                            <button onClick={(e)=>{e.stopPropagation();setCreditTipOpen(false);}}
                              style={{background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',
                                fontSize:11.5,fontWeight:600,color:'#85847f',padding:'5px 2px'}}>Not now</button>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })()}
          <style>{`.footer-add-wrap:hover .footer-add-tooltip{opacity:1!important;pointer-events:auto!important}`}</style>

          <div style={{flex:1}}/>

          <div style={{display:"flex",alignItems:"center",gap:bp==="mobile"?8:14}}>
            {bp==="mobile"
              ?<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.85)",flexShrink:0}}>{doneCount}/{concepts.length}</span>
              :<div style={{textAlign:"right"}}>
              <span style={{fontSize:13,fontWeight:700,color:"#FFFFFF",letterSpacing:"-0.01em"}}>Review & Test</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.75)",marginLeft:10,fontWeight:400}}>{doneCount} of {concepts.length} concepts understood</span>
            </div>}
          <div style={{display:"flex",gap:7}}>
            <button onClick={()=>setShowReview(!showReview)}
              className={"kh-test"+(showReview?" is-on":"")}
              style={{display:"flex",alignItems:"center",gap:7,padding:bp==="mobile"?"7px 10px":"8px 16px",borderRadius:8,fontSize:bp==="mobile"?11.5:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>
              {showReview?(bp==="mobile"?"Close":"Close test"):(bp==="mobile"?"Test topic":"Test the whole topic")}
              <IconTest size={14}/>
            </button>
            <button onClick={()=>{
                const next=!topicDone;
                setTopicDone(next);
                if(next){ onDone&&onDone(); setShowNext(true); }
                else { setShowNext(false); onUndone&&onUndone(); }
              }}
              aria-pressed={topicDone}

              style={{display:"flex",alignItems:"center",gap:7,padding:bp==="mobile"?"7px 12px":"8px 18px",borderRadius:8,fontSize:bp==="mobile"?11.5:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:testDone?"0 0 16px rgba(255,255,255,0.6)":"none",transition:"all .15s"}}>
              {topicDone?(bp==="mobile"?"Got it":"You've got this topic"):(bp==="mobile"?"I get this":"I get this topic")}
              <IconThumb size={14}/>
            </button>
          </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Tilt + iridescence card wrapper (module-level: stable identity) ── */

/* Collapsed concept cards need a one-line summary. Three ways it can be
   missing: a legacy custom concept saved before the field existed, an AI
   response that skipped the SUMMARY tag, or one of the few library sidecars
   without one. Rather than show an empty line, fall back to the opening
   sentence of the explanation — a truncation of real content, never invented
   copy. Exam Knowhow deliberately gets NO equivalent: absent exam guidance
   should stay absent, not be faked from body text. */
function conceptBlurb(c){
  if(!c)return '';
  const s=(c.summary||'').trim();
  if(s)return s;
  const ex=(c.explanation||'').trim();
  if(!ex)return '';
  const first=(ex.match(/^[\s\S]*?[.!?](?=\s|$)/)||[ex])[0].trim();
  return first.length>160?first.slice(0,157).replace(/\s+\S*$/,'')+'\u2026':first;
}

const kwDay=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const kwDaysTo=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((kwDay(s)-t)/86400000);};
const kwNice=s=>kwDay(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});

/* Picks the single most relevant thing to say today. Returns null when
   there's nothing timely — silence is the default, not a filler message. */
function goatCalendar({subjects=[],typeNum=9,gapTopics=[],stats={}}){
  const A=KW_TYPE_ANGLE[typeNum]||KW_TYPE_ANGLE[9];
  const mine=[];
  subjects.forEach(sid=>{
    (KW_EXAMS[sid]||[]).forEach(([date,time,part])=>{
      const s=SUBJECTS.find(x=>x.id===sid);
      if(s)mine.push({sid,name:s.name,date,time,part,days:kwDaysTo(date)});
    });
  });
  mine.sort((a,b)=>a.days-b.days);
  const next=mine.find(e=>e.days>=0);
  const today=mine.filter(e=>e.days===0);

  // ── exam day ──
  if(today.length){
    const e=today[0];
    return {id:'exam-day-'+e.date+'-'+e.sid,expr:'wink',
      title:e.name+(e.part?' '+e.part:'')+' — today, '+e.time,
      body:(stats.topics?"You've marked "+stats.topics+" topics understood"+(stats.tests?" and sat "+stats.tests+" tests":"")+". ":"")+A.day,
      sign:"Break a leg. Not mine."};
  }
  // ── tomorrow ──
  if(next&&next.days===1){
    return {id:'exam-tmr-'+next.date+'-'+next.sid,expr:'one brow',
      title:next.name+(next.part?' '+next.part:'')+' tomorrow, '+next.time,
      body:A.day,sign:"Sleep is revision. Genuinely."};
  }
  // ── the week before ──
  if(next&&next.days<=7){
    const weak=gapTopics.filter(g=>g.s&&g.s.id===next.sid).slice(0,2).map(g=>g.topic).filter(Boolean);
    return {id:'exam-week-'+next.date+'-'+next.sid,expr:'side eye',
      title:next.days+' day'+(next.days===1?'':'s')+' until '+next.name+(next.part?' '+next.part:''),
      body:(weak.length?'Gap Map says '+weak.join(' and ')+(weak.length>1?' still need work. ':' still needs work. '):'')+A.cram,
      sign:kwNice(next.date)+', '+next.time};
  }
  // ── exam block ahead ──
  if(next&&next.days<=21){
    return {id:'exam-soon-'+next.date+'-'+next.sid,expr:'sceptical',
      title:'Exams start in '+next.days+' days',
      body:'First up: '+next.name+' on '+kwNice(next.date)+'. '+A.cram,sign:null};
  }
  // ── all done ──
  const last=mine[mine.length-1];
  if(last&&last.days<0&&last.days>=-10){
    return {id:'exams-done-'+last.date,expr:'delighted',
      title:"That's the lot. Exams done.",
      body:(stats.topics?"You covered "+stats.topics+" topics to get here. ":"")+A.done,
      sign:"Go and be a person again."};
  }
  // ── key admin + results dates ──
  const K=[
    {k:'vtacTimelyClose',w:14,expr:'sceptical',t:'VTAC timely applications close',b:'$ Applications close 5pm. The late fee is real and it is annoying. '+A.admin},
    {k:'atarResults',w:7,expr:'one brow',t:'ATAR results',b:'$ Results land 7am. '+A.results},
    {k:'copClose',w:5,expr:'sceptical',t:'Change of preference closes',b:'$ Noon deadline for current Year 12. '+A.admin},
    {k:'decOffers',w:5,expr:'delighted',t:'December offers',b:'$ Offers released 10am. '+A.results},
    {k:'janOffers',w:5,expr:'delighted',t:'January round 1 offers',b:'$ Offers released 2pm. '+A.results},
  ];
  for(const e of K){
    const d=kwDaysTo(KW_DATES[e.k]);
    if(d>=0&&d<=e.w){
      const when=d===0?'today':d===1?'tomorrow':'in '+d+' days';
      return {id:e.k+'-'+KW_DATES[e.k],expr:e.expr,
        title:e.t+' '+when,body:e.b.replace('$',kwNice(KW_DATES[e.k])+'.'),
        sign:null};
    }
  }
  // ── breaks ──
  const[sb,se]=KW_DATES.springBreak;
  if(kwDaysTo(sb)<=0&&kwDaysTo(se)>=0){
    return {id:'spring-break-2026',expr:'sleepy',
      title:'Spring break',
      body:'Last proper breather before the exam block. '+A.rest,sign:'Term 4 starts 5 October.'};
  }
  if(kwDaysTo(KW_DATES.summerBreak)<=0&&kwDaysTo(KW_DATES.summerBreak)>=-30){
    return {id:'summer-2026',expr:'delighted',
      title:"School's out. For good, actually.",
      body:A.rest,sign:null};
  }
  return null;
}

/* ═══ GOATY — the mark ═════════════════════════════════════════════════
   Animal's goat, inlined from goatmark-paths.json. 64x64 viewBox.
   Mass = currentColor; cut-out detail = --gm-bg (MUST match the surface
   behind him or the eyes read as blobs); earring = --gm-accent; the
   goatee + tuft honour --gm-goatee (default: same as mass — set it to
   brat green at hero sizes only, where the pun resolves).

function GoatMark({expr='one brow',size=24,animated=false,goatee=false,style:sx}){
  /* goatee: false = same as mass; true = brat green; or pass any colour
     string (e.g. '#F87171' for error states). Tints beard + head tuft. */
  const gq=goatee===true?'#7BEA5A':(typeof goatee==='string'?goatee:null);
  const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const paths=GOAT_PATHS[expr]||GOAT_PATHS['one brow'];
  const col=f=>f==='c'?'currentColor':f==='g'?'var(--gm-goatee,currentColor)':f==='b'?'var(--gm-bg,#111113)':f==='n'?'none':f;
  const scol=s=>s==='b'?'var(--gm-bg,#111113)':s==='a'?'var(--gm-accent,#9EA0A6)':s;
  const render=ps=>ps.map((p,i)=>(
    <path key={i} d={p.d} fill={col(p.f)}
      stroke={p.s?scol(p.s):'none'} strokeWidth={p.w||0}
      strokeLinecap="round" strokeLinejoin="round"/>
  ));
  /* Two-frame snap cut per Animal's spec: hold neutral, hard-step to the
     expression, hold, step back. No tweening — the stiffness is the point.
     Duration varies per face so several on screen never march in sync.
     Reduced motion: static expression, no loop. */
  const DUR={'one brow':2.2,'sceptical':2.8,'sleepy':3.2,'side eye':2.4,'delighted':1.8,'over it':3.0,'smirk':2.6,'neutral':2.4};
  const anim=animated&&!reduce&&expr!=='neutral';
  const base={color:'#FFFFFF','--gm-bg':'#111113',...(gq?{'--gm-goatee':gq}:{}),display:'block',flexShrink:0,...sx};
  return(
    <span aria-hidden style={{position:'relative',width:size,height:size,...base}}>
      <svg viewBox="0 0 64 64" width={size} height={size} style={{display:'block'}}>{render(anim?GOAT_PATHS['neutral']:paths)}</svg>
      {anim&&(
        <svg viewBox="0 0 64 64" width={size} height={size}
          style={{display:'block',position:'absolute',inset:0,animation:`gmSnap ${DUR[expr]||2.4}s steps(1,end) infinite`}}>
          {render(paths)}
        </svg>
      )}
    </span>
  );
}

/* ═══ GOAT GUIDE — contextual first-run tips ═══════════════════════════
   A goat that occasionally points at one thing, says one line, and leaves.
   Never modal, never blocking, never on first paint. Every tip is earned by
   behaviour, one visible at a time, and "Nah, goat." kills the lot.
   State: localStorage ls_goatguide (fast path) + profile.goat (server). */

const GOAT_LS='ls_goatguide';
function goatLoad(){
  try{const s=JSON.parse(localStorage.getItem(GOAT_LS)||'null');if(s&&typeof s==='object')return s;}catch(e){}
  return {enabled:true,seen:{},lastFiredAt:0,visits:{}};
}
function goatSave(st){
  try{localStorage.setItem(GOAT_LS,JSON.stringify(st));}catch(e){}
  api.put('/auth/profile',{profile:{goat:{enabled:st.enabled,seen:st.seen,lastFiredAt:st.lastFiredAt}}}).catch(()=>{});
}
/* Cross-device seed: if this browser has never seen the goat but the server
   profile has, adopt the server copy so tips don't replay on a new machine. */
function goatSeedFromProfile(user){
  try{
    if(localStorage.getItem(GOAT_LS))return;
    const g=user&&user.profile&&user.profile.goat;
    if(g&&typeof g==='object')localStorage.setItem(GOAT_LS,JSON.stringify({enabled:g.enabled!==false,seen:g.seen||{},lastFiredAt:g.lastFiredAt||0,visits:{}}));
  }catch(e){}
}

/* Session runtime — module singleton, NOT React state: rate-limit ticks
   must never re-render the tree. Resets on reload by design. */
const goatRT={active:null,sessionCount:0,perScreen:{},modalOpen:false,testMode:false};
/* Dev throttle override — localStorage.setItem('ls_goatdebug','1') makes the
   goat impatient for testing: 5s cooldown, 1s dwell, 8s stuck-timer, no
   session cap. Remove the key to restore production pacing. */
function goatDbg(){try{return localStorage.getItem('ls_goatdebug')==='1';}catch(e){return false;}}
function goatCooldown(){return goatDbg()?5000:90000;}
function goatDwell(){return goatDbg()?1000:4000;}
function goatStuckMs(){return goatDbg()?8000:90000;}

    trigger:(c,st)=>Object.keys(st.seen||{}).filter(k=>k!=='goat-finale').length>=(goatDbg()?2:6),

function useGoat(screen,ctx,visitKey){
  const vk=visitKey||screen;
  const [tip,setTip]=React.useState(null);
  const ctxRef=React.useRef(ctx);ctxRef.current=ctx;
  const firedRef=React.useRef(null);
  React.useEffect(()=>{
    const st0=goatLoad();
    if(!st0.enabled)return;
    st0.visits[vk]=(st0.visits[vk]||0)+1;
    try{localStorage.setItem(GOAT_LS,JSON.stringify(st0));}catch(e){}
    const mountedAt=Date.now();
    const iv=setInterval(()=>{
      if(goatRT.active||goatRT.testMode)return;
      if((goatRT.sessionCount>=3&&!goatDbg())||goatRT.perScreen[screen])return;
      if(Date.now()-mountedAt<goatDwell())return;
      const st=goatLoad();
      if(!st.enabled)return;
      if(st.lastFiredAt&&Date.now()-st.lastFiredAt<goatCooldown())return;
      const elig=GOAT_TIPS
        .filter(t=>t.screen===screen&&!st.seen[t.id])
        .filter(t=>!goatRT.modalOpen||t.inModal)
        .filter(t=>!t.anchor||document.querySelector('[data-goat="'+t.anchor+'"]'))
        .filter(t=>ctxRef.current.ready!==false)
        .filter(t=>{try{return t.trigger(ctxRef.current,st);}catch(e){return false;}})
        .sort((a,b)=>b.priority-a.priority);
      if(!elig.length)return;
      const t=elig[0];
      goatRT.active=t.id;firedRef.current=t.id;goatRT.sessionCount++;goatRT.perScreen[screen]=true;
      st.lastFiredAt=Date.now();
      try{localStorage.setItem(GOAT_LS,JSON.stringify(st));}catch(e){}
      setTip({...t,_ctx:{...ctxRef.current}});
    },1000);
    return ()=>{
      clearInterval(iv);
      /* If OUR tip was still up when this screen unmounted, the user never
         got to read it — refund the session slots so it can try again. */
      if(firedRef.current&&goatRT.active===firedRef.current){
        goatRT.active=null;
        goatRT.perScreen[screen]=false;
        goatRT.sessionCount=Math.max(0,goatRT.sessionCount-1);
      }
      firedRef.current=null;
    };
  },[screen]);
  const dismiss=React.useCallback((markSeen)=>{
    setTip(cur=>{
      if(cur&&markSeen){const st=goatLoad();st.seen[cur.id]=Date.now();goatSave(st);}
      goatRT.active=null;firedRef.current=null;
      return null;
    });
  },[]);
  const kill=React.useCallback(()=>{
    const st=goatLoad();st.enabled=false;if(tip)st.seen[tip.id]=Date.now();goatSave(st);
    goatRT.active=null;firedRef.current=null;setTip(null);
  },[tip]);
  return {tip,dismiss,kill};
}

function GoatGuide({tip,dismiss,kill,bp='desktop'}){
  const [pos,setPos]=React.useState(null);
  const [leaving,setLeaving]=React.useState(false); /* the over-it exit beat */
  React.useEffect(()=>{setLeaving(false);},[tip&&tip.id]);
  React.useEffect(()=>{
    if(!tip)return;
    /* Chrome Goaty must never sit beneath: the rail down the left, the
       breadcrumb across the top, and the sticky concept bar when it's pinned.
       All measured rather than assumed \u2014 the rail width changes when it
       collapses and the sticky bar comes and goes. */
    const insets=()=>{
      const nav=document.querySelector('[data-kn-chrome="sidenav"]');
      const navRight=(nav&&bp!=='mobile')?nav.getBoundingClientRect().right:0;
      let top=bp==='mobile'?12:64;
      const bar=document.querySelector('[data-kn-chrome="stickybar"]');
      if(bar){
        const br=bar.getBoundingClientRect();
        /* Only counts while it's actually pinned and painted. */
        if(br.height>0&&br.top<top+8&&Number(getComputedStyle(bar).opacity||0)>0.5)top=Math.max(top,br.bottom+8);
      }
      return {left:navRight+16,top};
    };
    /* Follow the anchor: Goaty stays with the thing he's talking about,
       through scroll and resize. Side (above/below) is picked once on first
       show so he doesn't flip-flop at the boundary.

       Most lesson anchors only exist while a concept card is open, so the
       anchor is re-queried rather than captured once.

       He is NEVER clamped into a corner. Clamping is what made him float off
       on his own: once his friend scrolled past the top, the clamp pinned him
       to the top edge with nothing to point at. If the anchor isn't properly
       on screen he simply isn't rendered, and reappears when it is. */
    let raf=0,side=null,poll=0,last='';
    const put=(p)=>{const k=JSON.stringify(p);if(k!==last){last=k;setPos(p);}};
    const update=()=>{
      raf=0;
      if(bp==='mobile')return;
      const ins=insets();
      const el=tip.anchor?document.querySelector('[data-goat="'+tip.anchor+'"]'):null;
      if(!el){
        /* Unanchored tips park in the bottom-left of the CONTENT area. */
        put(tip.anchor?null:{bottom:104,left:ins.left});
        return;
      }
      const r=el.getBoundingClientRect();
      /* Is the anchor genuinely in the readable band \u2014 not zero-sized, not
         tucked under the chrome, not scrolled off the bottom? */
      const visible=r.width>0&&r.height>0&&r.bottom>ins.top+8&&r.top<window.innerHeight-8;
      if(!visible){put(null);side=null;return;}
      if(side===null)side=(window.innerHeight-r.bottom>150)?'below':'above';
      /* Not enough room above without tucking under the chrome: go below. */
      const s=(side==='above'&&r.top-ins.top<200)?'below':side;
      const L=Math.max(ins.left,Math.min(r.left,window.innerWidth-300));
      /* Chevron aims at the anchor's centre, clamped inside the card and kept
         clear of Goaty's perch (top-left) when it sits on the top edge. */
      const cx=r.left+r.width/2;
      const arrow=s==='below'?'top':'bottom';
      const arrowLeft=Math.max(arrow==='top'?56:20,Math.min(cx-L,250));
      put(s==='below'

function TiltCard({accent='#7BEA5A',children,style:sx,onClick,tilt=10,lift='1.02'}){
  const bp=useBreakpoint();

  const move=(e)=>{const el=ref.current;if(!el)return;const r=el.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;

    </div>
  );

  const subjectal=pool.filter(c=>c.subject===heroSub.name);
  const feat=topical.find(c=>c.status==='priority')||topical[0]||subjectal.find(c=>c.status==='priority')||subjectal[0]||pool.find(c=>c.status==='priority')||pool[0]||null;

  const doFlip=()=>{
    setFlipAnim('yah-flip-out');
    setTimeout(()=>{setFlipped(f=>!f);setFlipAnim('yah-flip-in');},180);

    </div>

  const greetH=new Date().getHours();
  const greet=greetH<12?'morning':greetH<18?'afternoon':'evening';

  goatSeedFromProfile(user);
  /* Timely calendar banner. Dismissals are per-event so seeing off "exams
     in 6 days" doesn't also silence "results tomorrow". */
  const[calDismissed,setCalDismissed]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('ls_goatcal')||'{}');}catch(e){return {};}
  });
  const calMsg=(()=>{
    try{

      let tests=0;try{tests=(JSON.parse(localStorage.getItem('ls_testlog')||'[]')||[]).length;}catch(e){}
      const m=goatCalendar({
        subjects:mySubs.map(s=>s.id),
        typeNum:type?.num,
        gapTopics,
        stats:{topics:doneT,tests}
      });
      return (m&&!calDismissed[m.id])?m:null;
    }catch(e){return null;}
  })();
  const dismissCal=()=>{
    if(!calMsg)return;
    const next={...calDismissed,[calMsg.id]:Date.now()};
    setCalDismissed(next);
    try{localStorage.setItem('ls_goatcal',JSON.stringify(next));}catch(e){}

            </div>

          <TiltCard accent={featSub.color} tilt={8} onClick={feat?doFlip:undefined}
            style={{borderRadius:16,border:`1px solid ${featSub.color}40`,boxShadow:`0 16px 40px rgba(0,0,0,0.45), 0 0 40px ${featSub.color}10`,cursor:feat?'pointer':'default',height:'100%'}}>

              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>

              </div>
              <div key={flipped?'b':'f'} style={{flex:1,display:'flex',flexDirection:'column',animation:flipAnim?`${flipAnim} .2s ease both`:'none'}}>

                {feat?(!flipped?(
                  <>
                    <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:14}}>
                      <div style={{width:30,height:30,borderRadius:8,overflow:'hidden',border:`1px solid ${featSub.color}35`,background:`${featSub.color}10`,flexShrink:0}}>

                    <div style={{marginTop:'auto',display:'flex',alignItems:'center',gap:6}}>
                      <span style={{width:5,height:5,borderRadius:'50%',background:tc,boxShadow:`0 0 6px ${tc}`}}/>

                    <p style={{fontSize:14.5,fontWeight:300,color:flashcardBack(feat)?C.text:C.faint,fontStyle:flashcardBack(feat)?'normal':'italic',lineHeight:1.62,margin:0,overflow:'auto'}}>{flashcardBack(feat)||FLASHCARD_BACK_EMPTY}</p>

                    <p style={{fontSize:13,color:C.muted,fontWeight:300,margin:'0 0 4px'}}>No flashcards yet.</p>
                    <p style={{fontSize:11.5,color:C.faint,fontWeight:300,margin:0}}>Save concepts in any lesson and they'll surface here.</p>

              </div>
            </div>
          </TiltCard>
          <TiltCard tilt={8} style={{borderRadius:18,border:'1px solid rgba(255,255,255,0.09)',boxShadow:'0 16px 40px rgba(0,0,0,0.4)',height:'100%'}}>
            <div style={{...cardFace,padding:'22px 24px'}}>
              <p style={{fontFamily:mono,fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:C.muted,margin:'0 0 16px'}}>Progress overview</p>

                  <div style={{marginTop:'auto',display:'flex',alignItems:'center',gap:9}}>
                    <div style={{flex:1,height:4,borderRadius:2,background:'rgba(255,255,255,0.07)',overflow:'hidden'}}>
                      <div style={{width:(d/s.topics.length*100)+'%',height:'100%',borderRadius:2,background:s.color,boxShadow:started?`0 0 8px ${s.color}`:'none'}}/>
                    </div>
                    <span style={{fontFamily:mono,fontSize:10.5,fontWeight:600,color:started?s.color:C.faint}}>{d}/{s.topics.length}</span>
                  </div>
                </div>
              </TiltCard>
            );
          })}
        </div>
      </div>

      <style>{`
        @keyframes yahFlame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.14) rotate(2deg);opacity:.85}}
        @keyframes yahPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
        @keyframes yahShimmer{0%{left:-40%}55%,100%{left:120%}}
        @keyframes yahSpin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
        @keyframes yah-flip-out{0%{transform:rotateY(0) scaleX(1)}100%{transform:rotateY(90deg) scaleX(.3);opacity:.4}}
        @keyframes yah-flip-in{0%{transform:rotateY(-90deg) scaleX(.3);opacity:.4}100%{transform:rotateY(0) scaleX(1);opacity:1}}
      `}</style>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   PARENT DASHBOARD — single child (no switcher for v1)
══════════════════════════════════════════════════════ */
function ParentDashboard({user,onLogout}){
  const tc='#7BEA5A';
  const mono="'JetBrains Mono',monospace";
  const[child,setChild]=useState(null);
  const[loaded,setLoaded]=useState(false);
  const[toast,setToast]=useState('');
  const[v,setV]=useState(false);
  useEffect(()=>{setTimeout(()=>setV(true),60);},[]);
  useEffect(()=>{
    api.get('/parent/children').then(r=>{
      if(r.children&&r.children[0])setChild(r.children[0]);
      setLoaded(true);
    }).catch(()=>setLoaded(true));
  },[]);
  const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(''),2200);};
  const dg=child?.profile?.parentDigest||null;
  const kidFirst=(child?.name||'your student').split(' ')[0];
  const STATUS_COL={'On track':tc,'Ahead':tc,'Building momentum':tc,'Steady':'#9b9a96','Needs a nudge':'#FCB815','Slipping':'#EC5F6A','Not started':'#6B6A66'};
  const subCol=(id)=>(SUBJECTS.find(s=>s.id===id)||{}).color||'#888';

  /* Hero status + nudges computed from digest */
  const daysActive=dg?dg.days7.reduce((a,b)=>a+b,0):0;
  const slipping=dg?dg.subjects.filter(s=>s.status==='Slipping'||s.status==='Needs a nudge'):[];
  const heroStatus=!dg?'Waiting':slipping.length>=3?'Needs a nudge':dg.streak>=4?'On track':daysActive>=3?'Building momentum':'Steady';
  const heroCol=STATUS_COL[heroStatus]||tc;
  const heroTitle=!dg?`Waiting on ${kidFirst}'s first session.`
    :dg.streak>=7?`${kidFirst} had a strong week.`
    :dg.streak>=3?`${kidFirst} is building momentum.`
    :daysActive>=3?`${kidFirst} is showing up.`
    :`${kidFirst} could use a gentle restart.`;
  const heroSub=!dg?'As soon as they open the app and study, this fills with real progress — effort, streaks and coverage. No nagging required (yet).'
    :`${daysActive} active day${daysActive!==1?'s':''} this week, a ${dg.streak}-day streak, and ${dg.cardsReviewed} cards reviewed.`+(slipping.length>0?` ${slipping.length} subject${slipping.length!==1?'s':''} could use a nudge.`:' The routine is holding.');

  const NUDGE_MSGS={
    'Slipping':(s)=>`Hey — noticed ${s.name} has gone quiet. No pressure, but 10 minutes on ${s.topic} tonight? I'll make hot choccy. 🍫`,
    'Needs a nudge':(s)=>`How's ${s.topic} going? You've got this — want to walk me through it at dinner? Teaching me counts as revision 😄`,
    'streak':()=>`Your streak is genuinely impressive. Keep it rolling tonight? 🔥`,
  };
  const nudges=[];
  if(dg){
    slipping.slice(0,2).forEach(s=>nudges.push({sid:s.id,kicker:s.name,icon:s.status==='Slipping'?'🕳️':'💬',
      title:s.status==='Slipping'?'Slipping behind':'Needs a little push',
      body:s.status==='Slipping'?`${s.topic} has gone quiet. A light check-in tends to restart it — no pressure needed.`:`${s.topic} is their trickiest topic right now. Asking about it shows you're paying attention.`,
      cta:'Copy a nudge',msg:NUDGE_MSGS[s.status](s)}));
    if(dg.streak>=3)nudges.push({sid:null,kicker:`${dg.streak}-day streak`,icon:'🔥',title:'The habit is forming',
      body:`${kidFirst} has studied ${dg.streak} days in a row — the routine is starting to stick. Encourage it.`,
      cta:'Send a 🔥',msg:NUDGE_MSGS.streak()});
  }
  while(dg&&nudges.length<3&&nudges.length<dg.subjects.length){
    const s=dg.subjects.filter(x=>!nudges.some(n=>n.sid===x.id))[0];
    if(!s)break;
    nudges.push({sid:s.id,kicker:s.name,icon:'🌱',title:'Ticking along',body:`Currently on ${s.topic}. Worth asking how it's going — interest is fuel.`,cta:'Copy a nudge',msg:`How's ${s.topic} treating you? Genuinely curious.`});
  }
  const copyNudge=(msg)=>{

    catch(e){showToast('Copy failed — long-press to select');}

  const creditsTotal=dg?.creditsTotal||10, creditsUsed=dg?.creditsUsed||0, creditsLeft=creditsTotal-creditsUsed;

          <div style={{flex:1}}/>

          <span style={{fontFamily:mono,fontSize:11,color:C.faint}}>This week · Mon–Sun</span>
          <button onClick={onLogout} style={{background:'none',border:'none',padding:0,cursor:'pointer',fontFamily:'inherit',fontSize:12,color:C.muted,textDecoration:'underline',textUnderlineOffset:3}}>Sign out</button>
        </div>

        {/* hero */}
        <TiltCard accent={heroCol} tilt={5} lift='1.008' style={{borderRadius:20,border:`1px solid ${heroCol}40`,boxShadow:`0 24px 56px rgba(0,0,0,0.5), 0 0 60px ${heroCol}12`}}>
          <div style={{...face,background:'linear-gradient(158deg,#17171a,#0b0b0d)',padding:'24px 26px',display:'flex',gap:20,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{flex:1,minWidth:240}}>
              <div style={{display:'inline-flex',alignItems:'center',gap:7,border:`1px solid ${heroCol}40`,background:`${heroCol}0E`,borderRadius:100,padding:'5px 13px',marginBottom:13}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:heroCol,boxShadow:`0 0 8px ${heroCol}`,animation:'pdPulse 2.6s ease infinite',display:'inline-block'}}/>
                <span style={{fontFamily:mono,fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:heroCol}}>{heroStatus}</span>

              <h2 style={{fontSize:29,fontWeight:700,color:C.text,letterSpacing:'-0.035em',margin:'0 0 8px',lineHeight:1.1}}>{heroTitle}</h2>

            </div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              {[[daysActive,'active days','of 7 this week'],[dg?dg.streak:0,'day','streak'],[dg?dg.cardsReviewed:0,'cards','reviewed']].map((k,i)=>(
                <div key={i} style={{minWidth:104,borderRadius:14,border:`1px solid ${C.b2}`,background:'rgba(255,255,255,0.02)',padding:'14px 16px'}}>

            </div>

        </TiltCard>

        {!dg&&loaded&&(
          <p style={{fontSize:12.5,color:C.faint,fontWeight:300,margin:'14px 4px 0'}}>Tip: {kidFirst}'s invite may still be waiting in their inbox. Data appears here after their first study session.</p>

        {dg&&nudges.length>0&&(

                      </div>
                      <div style={{fontSize:11,color:C.faint,fontWeight:300,margin:'2px 0 6px'}}>Currently on · {s.topic}</div>
                      <div style={{height:4,borderRadius:2,background:'rgba(255,255,255,0.07)',overflow:'hidden'}}>

        )}

        {/* privacy strip */}
        <div style={{marginTop:26,borderRadius:14,border:`1px solid ${C.b2}`,background:'rgba(255,255,255,0.02)',padding:'14px 18px',display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <span style={{fontSize:15}}>🔒</span>
          <div style={{flex:1,minWidth:220}}>
            <div style={{fontSize:12.5,fontWeight:600,color:C.text}}>{kidFirst} chooses what you can see</div>
            <div style={{fontSize:11.5,color:C.faint,fontWeight:300}}>Progress, effort and streaks are shared. Learning content and mistakes stay private.</div>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

            ))}
          </div>
        </div>
      </div>

      {toast&&(
        <div style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',background:'#1a1a1d',border:`1px solid ${C.b2}`,borderRadius:100,padding:'11px 22px',fontSize:13,color:C.text,zIndex:100,boxShadow:'0 10px 34px rgba(0,0,0,0.6)'}}>{toast}</div>
      )}
      <style>{`@keyframes pdPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}`}</style>
    </div>
  );
}

        <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:12,padding:'14px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:11.5,color:C.text,wordBreak:'break-all',marginBottom:14,textAlign:'left'}}>{link}</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
          <Btn onClick={copy} color="#7BEA5A" size="lg" style={{fontWeight:600}}>{copied?'Copied ✓':'Copy invite link'}</Btn>
          <a href={mailto} style={{textDecoration:'none'}}><Btn variant="secondary" size="lg">Email it to {kidFirst}</Btn></a>
        </div>
        <button onClick={onContinue} style={{marginTop:22,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,color:C.muted,textDecoration:'underline',textUnderlineOffset:3}}>Go to your dashboard →</button>
      </div>
    </div>
  );
}
