const NEURO_BASE=[
  {id:'adhd',label:'ADHD',desc:'Attention, starting, and staying on track work differently for me.'},
  {id:'asd',label:'Autism / ASD',desc:'I think in patterns and need clear rules and structure.'},
  {id:'dyslexia',label:'Dyslexia',desc:'Reading is effortful; I think better verbally.'},
];
const NEURO_NONE={id:'none',label:'None / prefer not to say',desc:''};
/* Compose a neuro profile from selected base ids. Ids join with '+'
   so downstream checks like id.includes('adhd') work for every combo. */
function buildNeuroProfile(ids){
  if(!ids||ids.length===0)return NEURO_NONE;
  const order=['adhd','asd','dyslexia'];
  const sel=order.filter(o=>ids.includes(o));
  if(sel.length===0)return NEURO_NONE;
  const parts=sel.map(o=>NEURO_BASE.find(b=>b.id===o));
  return{id:sel.join('+'),label:parts.map(p=>p.label).join(' + '),desc:parts.map(p=>p.desc).join(' ')};
}
/* Parse any stored neuro id (incl. legacy adhd-i/adhd-h/adhd-c/2e/adhd-dyslexia) */
function parseNeuroId(id){
  if(!id||id==='none')return[];
  const out=[];
  if(id.includes('adhd')||id==='2e')out.push('adhd');
  if(id.includes('asd')||id==='2e')out.push('asd');
  if(id.includes('dyslexia'))out.push('dyslexia');
  return out;
}

/* The back of a flashcard. Cards saved before the library merge fix can have
   an empty explanation, so fall back through every field that might carry the
   answer before giving up. */
function flashcardBack(card){
  if(!card)return '';
  const pts=Array.isArray(card.detail_points)?card.detail_points.filter(Boolean).join(' \u00B7 '):'';
  return String(card.explanation||card.summary||card.reframe||pts||'').trim();
}

/* Subjects the user has picked (profile first, localStorage fallback, all if none saved) */
function getSelectedSubjects(user){
  let ids=user?.profile?.subjects;
  if(!ids||ids.length===0){
    try{ids=JSON.parse(localStorage.getItem('ls_subjects')||'null');}catch(e){ids=null;}
  }
  return ids&&ids.length>0?SUBJECTS.filter(s=>ids.includes(s.id)):SUBJECTS;
}

/* Gap Map event log — counts struggle/success signals per subject::topic */
function gapLog(subjectId,topic,kind){
  if(!subjectId||!topic)return;
  try{
    const m=JSON.parse(localStorage.getItem('ls_gapmap')||'{}');
    const k=subjectId+'::'+topic;
    const e=m[k]||{};
    e[kind]=(e[kind]||0)+1;e.last=Date.now();
    m[k]=e;
    localStorage.setItem('ls_gapmap',JSON.stringify(m));
  }catch(err){}
}

/* ══════════════════════════════════════════════════════

   3 sections · 6 steps: Subjects(1) + Style quiz(4) + Neurology(1)

const ONBOARD_SECTIONS=[
  {id:'subjects',n:'01',label:'Your Subjects',steps:1},
  {id:'style',n:'02',label:'Your Style',steps:4}, /* = QUIZ.length — update if quiz changes */
  {id:'neuro',n:'03',label:'Your Neurology',steps:1},
];
const ONBOARD_TOTAL=ONBOARD_SECTIONS.reduce((a,s)=>a+s.steps,0);

function OnboardProgress({step,section}){
  const pct=Math.min(100,(step/ONBOARD_TOTAL)*100);
  let cum=0;
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'rgba(8,8,9,0.85)',backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)'}}>
      <div style={{maxWidth:860,margin:'0 auto',padding:'13px 24px 11px',display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
        {ONBOARD_SECTIONS.map(s=>{
          const start=cum;cum+=s.steps;
          const active=s.id===section;
          const done=step>cum;
          return(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:7,opacity:active?1:done?0.7:0.38,transition:'opacity .3s'}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.1em',color:active||done?'#7BEA5A':C.muted,fontWeight:600}}>{done?'✓':s.n}</span>
              <span style={{fontSize:12,fontWeight:active?600:400,color:active?C.text:C.muted,letterSpacing:'-0.01em',whiteSpace:'nowrap'}}>{s.label}</span>
            </div>
          );
        })}
      </div>
      <div style={{height:2,background:C.b1}}>
        <div style={{height:'100%',width:`${pct}%`,background:'#7BEA5A',transition:'width .4s ease',boxShadow:'0 0 8px #7BEA5A60'}}/>
      </div>
    </div>
  );
}

function OnboardFooter({center,onBack,onNext,nextLabel='Next →',nextDisabled,backLabel='← Back'}){

function useBreakpoint(){
  const get=()=>{const w=typeof window!=='undefined'?window.innerWidth:1200;return w<=640?'mobile':w<=1024?'rail':'desktop';};
  const[bp,setBp]=useState(get);
  useEffect(()=>{const f=()=>setBp(get());window.addEventListener('resize',f);return()=>window.removeEventListener('resize',f);},[]);
  return bp;
}

  const[missSent,setMissSent]=useState(false);
  const[,setTick]=useState(0);
  const dataRef=useRef(null);
  const inputRef=useRef(null);
  const wrapRef=useRef(null);
  const kslug=(x)=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const load=()=>{
    if(dataRef.current)return;
    dataRef.current={lib:[],custom:[],status:'loading',err:''};
    api.get('/library/index').then(r=>{
      if(r&&Array.isArray(r.concepts)){
        dataRef.current.lib=r.concepts;
        dataRef.current.status=r.concepts.length?'ready':'empty';
      }else{
        dataRef.current.status='error';
        dataRef.current.err=(r&&r.error)||'the index endpoint did not respond';
      }
      setTick(t=>t+1);
    }).catch(e=>{dataRef.current.status='error';dataRef.current.err=String(e&&e.message||e);setTick(t=>t+1);});
    api.get('/user/concepts').then(r=>{
      const rows=[];
      Object.entries((r&&r.concepts)||{}).forEach(([key,list])=>{
        const cut=key.indexOf('__');
        if(cut<0)return;
        const sub=key.slice(0,cut),top=key.slice(cut+2);
        (list||[]).forEach(c=>rows.push({slug:c.id,subject:sub,topic:top,title:c.title||'',tags:[],isCustom:true}));
      });
      dataRef.current.custom=rows;setTick(t=>t+1);
    }).catch(()=>{});
  };
  const openIt=()=>{setOpen(true);load();setTimeout(()=>inputRef.current&&inputRef.current.focus(),40);};
  useEffect(()=>{
    const onKey=(e)=>{
      if((e.metaKey||e.ctrlKey)&&String(e.key).toLowerCase()==='k'){
        e.preventDefault();
        setOpen(o=>{if(!o){load();setTimeout(()=>inputRef.current&&inputRef.current.focus(),40);}return !o;});
      }
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[]);
  useEffect(()=>{
    if(!open)return;
    const onDoc=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    const onEsc=e=>{if(e.key==='Escape')setOpen(false);};
    document.addEventListener('mousedown',onDoc);
    document.addEventListener('keydown',onEsc);
    return()=>{document.removeEventListener('mousedown',onDoc);document.removeEventListener('keydown',onEsc);};
  },[open]);
  const enrolled=getSelectedSubjects(user);
  /* Cache folders are named from the subject's display name, but the id is
     the other half of the name-vs-id drift trap. Register both so a folder
     named either way still resolves to a subject. */
  const bySlug=new Map();
  enrolled.forEach(s=>{bySlug.set(kslug(s.name),s);if(!bySlug.has(kslug(s.id)))bySlug.set(kslug(s.id),s);});
  const query=q.trim().toLowerCase();
  let results=[];
  if(open&&query.length>=2&&dataRef.current){
    const score=(row)=>{
      const t=(row.title||'').toLowerCase();
      if(t.startsWith(query))return 0;
      if(t.includes(query))return 1;
      if((row.tags||[]).some(tag=>String(tag).toLowerCase().includes(query)))return 2;
      if(String(row.topic||'').replace(/-/g,' ').includes(query))return 3;
      return -1;
    };
    results=[...dataRef.current.lib,...dataRef.current.custom]
      .filter(r=>bySlug.has(r.subject))
      .map(r=>({r,sc:score(r)})).filter(x=>x.sc>=0)
      .sort((a,b)=>a.sc-b.sc||((a.r.isCustom?1:0)-(b.r.isCustom?1:0))||String(a.r.title).localeCompare(String(b.r.title)))
      .slice(0,8).map(x=>x.r);
  }
  const safeIdx=Math.min(idx,Math.max(0,results.length-1));
  const go=(row)=>{
    if(!row)return;
    const s=bySlug.get(row.subject);
    if(!s)return;
    const t=(s.topics||[]).find(tp=>kslug(tp)===row.topic)||String(row.topic||'').replace(/-/g,' ');
    setOpen(false);setQ('');setMissSent(false);
    onSelect(s,t);
  };
  const onKeyDown=(e)=>{
    if(e.key==='ArrowDown'){e.preventDefault();setIdx(i=>Math.min(i+1,results.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setIdx(i=>Math.max(i-1,0));}
    else if(e.key==='Enter'){e.preventDefault();go(results[safeIdx]);}
  };
  const grouped=[];
  results.forEach(r=>{
    const gLabel=r.isCustom?'Your concepts':(bySlug.get(r.subject)||{}).name||r.subject;
    let g=grouped.find(x=>x.label===gLabel);
    if(!g){g={label:gLabel,rows:[]};grouped.push(g);}
    g.rows.push(r);
  });
  return(
    <div ref={wrapRef} style={{position:'fixed',top:9,right:62,zIndex:70}}>
      {!open&&(
        <button onClick={openIt} aria-label="Search the library"
          title="Search (Cmd+K)"
          style={{width:34,height:34,borderRadius:'50%',cursor:'pointer',
            border:'1px solid rgba(255,255,255,0.14)',background:'rgba(255,255,255,0.05)',
            color:'#EDECE8',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s'}}>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" strokeWidth="1.5"/><path d="M10.6 10.6L14 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
        </button>
      )}
      {open&&(
        <div style={{position:'absolute',top:0,right:0,width:380,background:'#0E110E',
          border:'1px solid rgba(255,255,255,0.12)',borderRadius:13,overflow:'hidden',
          boxShadow:'0 20px 50px rgba(0,0,0,0.6)'}}>
          <div style={{display:'flex',alignItems:'center',gap:9,padding:'10px 13px',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style={{flexShrink:0,color:'#7BEA5A'}}><circle cx="7" cy="7" r="4.6" stroke="currentColor" strokeWidth="1.5"/><path d="M10.6 10.6L14 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            <input ref={inputRef} value={q}
              onChange={e=>{setQ(e.target.value);setIdx(0);setMissSent(false);}}
              onKeyDown={onKeyDown}
              placeholder="Search concepts"
              style={{flex:1,border:'none',outline:'none',background:'transparent',color:'#EDECE8',
                fontFamily:'inherit',fontSize:13.5,fontWeight:500}}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#56554f',
              border:'1px solid rgba(255,255,255,0.12)',borderRadius:4,padding:'2px 5px',flexShrink:0}}>esc</span>
          </div>
          {query.length>=2&&(
            <div style={{maxHeight:340,overflowY:'auto',padding:'6px 0'}}>
              {grouped.map(g=>(
                <div key={g.label}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,fontWeight:700,
                    letterSpacing:'0.12em',textTransform:'uppercase',color:'#56554f',padding:'6px 14px 4px'}}>{g.label}</div>
                  {g.rows.map(r=>{
                    const globalIdx=results.indexOf(r);
                    const hot=globalIdx===safeIdx;
                    const s=bySlug.get(r.subject);
                    const topicName=(s&&(s.topics||[]).find(tp=>kslug(tp)===r.topic))||String(r.topic||'').replace(/-/g,' ');
                    return(
                      <button key={r.subject+'/'+r.topic+'/'+r.slug} onClick={()=>go(r)}
                        onMouseEnter={()=>setIdx(globalIdx)}
                        style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'8px 14px',
                          border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'left',
                          background:hot?'rgba(123,234,90,0.08)':'transparent',transition:'background .12s'}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600,color:hot?'#7BEA5A':'#EDECE8',
                            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.title}</div>
                          <div style={{fontSize:11,color:'#85847f',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{topicName}</div>
                        </div>
                        {r.isCustom&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,fontWeight:700,
                          letterSpacing:'0.08em',textTransform:'uppercase',color:'#7BEA5A',
                          border:'1px solid rgba(123,234,90,0.35)',borderRadius:4,padding:'2px 5px',flexShrink:0}}>Custom</span>}
                        {hot&&!r.isCustom&&<svg width="12" height="12" viewBox="0 0 16 16" fill="none" style={{flexShrink:0,color:'#7BEA5A'}}><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                    );
                  })}
                </div>
              ))}
              {results.length===0&&(
                <div style={{padding:'14px 14px 12px'}}>
                  <div style={{fontSize:12.5,color:'#85847f',marginBottom:8}}>
                    {dataRef.current&&dataRef.current.status==='error'
                      ?"Couldn't load the library index \u2014 "+(dataRef.current.err||'check the server is running the latest build.')
                      :(dataRef.current&&dataRef.current.status==='empty')
                        ?'The library index came back empty \u2014 the server may need a restart.'
                        :'Nothing in the library for that.'}
                  </div>
                  {missSent
                    ?<div style={{fontSize:12,color:'#7BEA5A'}}>Logged — we'll look into it.</div>
                    :<button onClick={()=>{api.post('/library/misses',{query:q}).catch(()=>{});setMissSent(true);}}
                      style={{border:'none',background:'transparent',cursor:'pointer',fontFamily:'inherit',
                        fontSize:12,fontWeight:600,color:'#7BEA5A',padding:0}}>Tell us what you were after &rarr;</button>}
                </div>
              )}
            </div>
          )}
          {query.length<2&&(
            <div style={{padding:'12px 14px',fontSize:12,color:'#56554f'}}>Type to search your subjects&rsquo; concepts</div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── My Concepts — every custom concept the student has built, across all
   topics, grouped by subject. Lives under Study in the sidenav. Also the
   natural home for the credit balance: the Pro feature gets a face. ── */
function MyConceptsPage({user,onSelect}){
  const[groups,setGroups]=useState(null);
  const[credits,setCredits]=useState(null);
  const kslug=(x)=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const refresh=()=>{
    api.get('/user/concepts').then(r=>{
      const g=[];
      Object.entries((r&&r.concepts)||{}).forEach(([key,list])=>{
        if(!list||!list.length)return;
        const cut=key.indexOf('__');
        if(cut<0)return;
        const subSlug=key.slice(0,cut),topSlug=key.slice(cut+2);
        const s=SUBJECTS.find(x=>kslug(x.name)===subSlug);
        const topicName=(s&&(s.topics||[]).find(t=>kslug(t)===topSlug))||topSlug.replace(/-/g,' ');
        g.push({key,subject:s,subSlug,topSlug,topicName,concepts:list});
      });
      g.sort((a,b)=>String(a.subject?a.subject.name:a.subSlug).localeCompare(String(b.subject?b.subject.name:b.subSlug))||String(a.topicName).localeCompare(String(b.topicName)));
      setGroups(g);
    }).catch(()=>setGroups([]));
  };
  useEffect(()=>{refresh();api.get('/user/credits').then(r=>{if(r&&typeof r.limit!=='undefined')setCredits(r);}).catch(()=>{});},[]);
  const del=(gr,c)=>{
    fetch(API+'/user/concepts/'+gr.subSlug+'/'+gr.topSlug+'/'+encodeURIComponent(c.id),{method:'DELETE',headers:api.headers()})
      .then(()=>refresh()).catch(()=>{});
  };
  const total=(groups||[]).reduce((n,g)=>n+g.concepts.length,0);
  return(
    <div style={{minHeight:'100vh',padding:'72px 32px 80px',fontFamily:"'Geist',sans-serif"}}>
      <div style={{maxWidth:900,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,flexWrap:'wrap',marginBottom:10}}>
          <div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,letterSpacing:'0.16em',textTransform:'uppercase',color:'#7BEA5A',marginBottom:10}}>Built by you</div>
            <h1 style={{fontSize:'clamp(30px,4vw,44px)',fontWeight:800,letterSpacing:'-0.04em',color:'#EDECE8',margin:0,lineHeight:1.02}}>My Concepts</h1>
          </div>
          {credits&&credits.limit>0&&(()=>{
            /* The chip earns a colour only when the number starts to matter.
               Goaty turns up at nought \u2014 not before, or he's wallpaper. */
            const left=Math.max(0,credits.limit-credits.used);
            const tone=left===0?{fg:'#F0A04E',bg:'rgba(240,160,78,0.08)',bd:'rgba(240,160,78,0.30)'}
                     :left<=3?{fg:'#E8C63F',bg:'rgba(232,198,63,0.07)',bd:'rgba(232,198,63,0.28)'}
                     :{fg:'#7BEA5A',bg:'rgba(123,234,90,0.07)',bd:'rgba(123,234,90,0.25)'};
            return(
              <div style={{display:'inline-flex',alignItems:'center',gap:9,padding:'8px 14px',borderRadius:11,
                background:tone.bg,border:'1px solid '+tone.bd}}>
                {left===0
                  ?<GoatMark expr="over it" size={18} style={{flexShrink:0}}/>
                  :<div style={{width:6,height:6,borderRadius:'50%',background:tone.fg,boxShadow:'0 0 8px '+tone.fg}}/>}
                <span style={{fontSize:12.5,fontWeight:600,color:'#EDECE8'}}>
                  {left===0?'No credits left \u2014 they reset on the 1st':left+' of '+credits.limit+' credits left this month'}</span>
              </div>
            );
          })()}
          {credits&&credits.limit===0&&(
            <div style={{display:'inline-flex',alignItems:'center',gap:8,padding:'8px 14px',borderRadius:11,
              background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.12)'}}>
              <span style={{fontSize:12.5,fontWeight:500,color:'#85847f'}}>Custom concepts are a Pro feature</span>
            </div>
          )}
        </div>
        <p style={{fontSize:14.5,color:'#85847f',margin:'0 0 34px',lineHeight:1.6,maxWidth:560}}>
          Concepts you&rsquo;ve added from topic pages, kept in one place. Open one to pick up where you left off.</p>
        {groups===null&&(
          <div style={{fontSize:13,color:'#56554f'}}>Loading&hellip;</div>
        )}
        {groups!==null&&total===0&&(
          <div style={{padding:'34px 28px',borderRadius:18,border:'1px dashed rgba(255,255,255,0.14)',textAlign:'center'}}>
            <div style={{fontSize:15,fontWeight:600,color:'#EDECE8',marginBottom:6}}>Nothing here yet</div>
            <div style={{fontSize:13,color:'#85847f',lineHeight:1.6}}>Hit &ldquo;Add a concept&rdquo; on any topic page and it&rsquo;ll land here.</div>
          </div>
        )}
        {(groups||[]).map(gr=>{
          const col=(gr.subject&&gr.subject.color)||'#7BEA5A';
          return(
            <div key={gr.key} style={{marginBottom:26}}>
              <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:10}}>
                <span style={{fontSize:13.5,fontWeight:700,color:col,letterSpacing:'-0.01em'}}>{gr.subject?gr.subject.name:gr.subSlug}</span>
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#56554f" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                <span style={{fontSize:13,fontWeight:600,color:'#EDECE8'}}>{gr.topicName}</span>
              </div>
              {gr.concepts.map(c=>(
                <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',marginBottom:8,
                  borderRadius:13,border:'1px solid rgba(255,255,255,0.09)',background:'rgba(255,255,255,0.025)',transition:'border-color .15s'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:'#EDECE8',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.title}</div>
                    {c.summary&&<div style={{fontSize:12,color:'#85847f',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.summary}</div>}
                  </div>
                  <button onClick={()=>gr.subject&&onSelect(gr.subject,gr.topicName)}
                    style={{display:'flex',alignItems:'center',gap:6,padding:'7px 13px',borderRadius:9,border:'none',
                      background:col,color:'#0C0C0F',fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',flexShrink:0}}>
                    Open <span aria-hidden="true">&rarr;</span>
                  </button>
                  <button onClick={()=>{if(window.confirm('Delete \u201C'+(c.title||'this concept')+'\u201D? This can\u2019t be undone.'))del(gr,c);}}
                    aria-label={'Delete '+(c.title||'concept')}
                    style={{width:30,height:30,borderRadius:8,border:'1px solid rgba(255,255,255,0.10)',background:'transparent',
                      color:'#56554f',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .15s'}}>
                    <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M5.5 3.5V2.2c0-.4.3-.7.7-.7h1.6c.4 0 .7.3.7.7v1.3M4 3.5l.5 8c0 .5.4.9.9.9h3.2c.5 0 .9-.4.9-.9l.5-8" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </button>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  useEffect(()=>{if(subject?.id)setExp(subject.id);},[subject?.id]);
  const inLesson=screen==='lesson'; /* subject/topic only read as "current" inside subject content */

  }

      borderRight:'1px solid rgba(255,255,255,0.07)',display:'flex',flexDirection:'column',overflow:'hidden',fontFamily:"'Geist',sans-serif"}}>

        <button onClick={onToggle} style={{width:30,height:30,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(255,255,255,0.1)',background:'rgba(255,255,255,0.04)',color:'#8C8B87',cursor:'pointer',flexShrink:0,transition:'all .15s'}}>
          {collapsed
            ?<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M2 6h8M2 9h8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
            :<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2L4 6l4 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </button>
      </div>

      {/* Nav items */}
      <div style={{padding:'0 8px',flexShrink:0}}>
        {navItem('dashboard','You Are Here',
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 14.5s5-4.6 5-8.3A5 5 0 003 6.2c0 3.7 5 8.3 5 8.3z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/><circle cx="8" cy="6.2" r="1.7" stroke="currentColor" strokeWidth="1.3"/></svg>)}
        {navItem('topics','Study',
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2" width="6" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><rect x="8.5" y="2" width="6" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 12h13" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>)}
        {!collapsed&&(screen==='topics'||screen==='my-concepts')&&(
          <div style={{margin:'2px 0 4px 22px',paddingLeft:12,borderLeft:'1px solid rgba(123,234,90,0.22)'}}>
            {[{id:'topics',label:'Your Subjects'},{id:'my-concepts',label:'My Concepts'}].map(sec=>{
              const cur=screen===sec.id;
              return(
                <button key={sec.id} onClick={()=>onNav(sec.id)}
                  style={{display:'flex',alignItems:'center',gap:8,width:'100%',padding:'5px 8px',borderRadius:7,border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'left',background:cur?'rgba(123,234,90,0.08)':'transparent',transition:'all .14s'}}>
                  <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,background:cur?'#7BEA5A':'#56554f',boxShadow:cur?'0 0 6px #7BEA5A':undefined}}/>
                  <span style={{flex:1,fontSize:11.5,fontWeight:cur?600:500,color:cur?'#7BEA5A':'#85847f',lineHeight:1.3}}>{sec.label}</span>
                </button>
              );
            })}
          </div>

/* ══════════════════════════════════════════════════════
   HIGHLIGHTABLE TEXT — wraps study content, intercepts
   text selection, shows a highlight tooltip, and renders
   existing highlights inline.
   Props: text, conceptId, highlights, onAddHighlight, tc
══════════════════════════════════════════════════════ */
function HighlightableText({text,conceptId,highlights=[],onAddHighlight,onRemoveHighlight,tc,style:sx}){
  const containerRef=useRef(null);
  const[tooltip,setTooltip]=useState(null); // {x,y,text} — "add highlight" tooltip on selection
  const[removeTooltip,setRemoveTooltip]=useState(null); // {x,y,highlightId} — "remove" tooltip on click

  // Disable copy globally but keep selection for highlights
  useEffect(()=>{
    const onCopy=(e)=>{e.preventDefault();};
    const onContextMenu=(e)=>{if(containerRef.current?.contains(e.target))e.preventDefault();};
    document.addEventListener('copy',onCopy);
    document.addEventListener('contextmenu',onContextMenu);
    return()=>{document.removeEventListener('copy',onCopy);document.removeEventListener('contextmenu',onContextMenu);};
  },[]);

  const handleMouseUp=useCallback(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.toString().trim())return;
    if(!containerRef.current?.contains(sel.anchorNode))return;
    const txt=sel.toString().trim();
    if(txt.length<3)return;
    const range=sel.getRangeAt(0);
    const rect=range.getBoundingClientRect();
    const containerRect=containerRef.current.getBoundingClientRect();
    setRemoveTooltip(null);
    setTooltip({
      x:rect.left-containerRect.left+rect.width/2,
      y:rect.top-containerRect.top-40,
      text:txt,
    });
  },[]);

  const doHighlight=()=>{
    if(!tooltip)return;
    onAddHighlight?.({
      id:Date.now(),
      conceptId,
      text:tooltip.text,
      createdAt:new Date().toISOString(),
    });
    setTooltip(null);
    window.getSelection()?.removeAllRanges();
  };

  const dismiss=()=>{
    setTooltip(null);
    window.getSelection()?.removeAllRanges();
  };

  const handleHighlightClick=(e,highlightId)=>{
    e.stopPropagation();
    const rect=e.currentTarget.getBoundingClientRect();
    const containerRect=containerRef.current.getBoundingClientRect();
    setTooltip(null);
    setRemoveTooltip({
      x:rect.left-containerRect.left+rect.width/2,
      y:rect.top-containerRect.top-40,
      highlightId,
    });
  };

  const doRemove=()=>{
    if(!removeTooltip)return;
    onRemoveHighlight?.(removeTooltip.highlightId);
    setRemoveTooltip(null);
  };

  // Build rendered text with highlight spans injected
  const myHighlights=highlights.filter(h=>h.conceptId===conceptId);
  const sorted=[...myHighlights].sort((a,b)=>{
    const ia=text.indexOf(a.text),ib=text.indexOf(b.text);
    return ia-ib;
  });
  const usedRanges=[]; // [start,end,highlightId]
  for(const h of sorted){
    const realIdx=text.indexOf(h.text);
    if(realIdx===-1)continue;
    if(usedRanges.some(([s,e])=>realIdx<e&&realIdx+h.text.length>s))continue;
    usedRanges.push([realIdx,realIdx+h.text.length,h.id]);
  }
  const sortedRanges=[...usedRanges].sort((a,b)=>a[0]-b[0]);
  let pos=0;
  const nodes=[];
  for(const[start,end,hid] of sortedRanges){
    if(pos<start)nodes.push(<span key={`t${pos}`}>{text.slice(pos,start)}</span>);
    nodes.push(
      <mark key={`h${start}`} className="knowhere-highlight"
        onClick={(e)=>handleHighlightClick(e,hid)}
        style={{background:'#FFFFFF',color:'#080809'}}>
        {text.slice(start,end)}
      </mark>
    );
    pos=end;
  }
  if(pos<text.length)nodes.push(<span key={`tend`}>{text.slice(pos)}</span>);

  return(
    <div ref={containerRef} className="study-content" style={{position:'relative',...sx}}
      onMouseUp={handleMouseUp} onTouchEnd={handleMouseUp}>
      {nodes.length>0?<>{nodes}</>:<>{text}</>}
      {tooltip&&(
        <>
          <div onClick={dismiss} aria-hidden="true" style={{position:'fixed',inset:0,zIndex:499}}/>
          <button className="highlight-tooltip" onClick={doHighlight}
            style={{left:tooltip.x,top:tooltip.y,transform:'translateX(-50%)',color:tc,fontFamily:'inherit'}}>
            <span style={{marginRight:6}}>🖊</span>Highlight
          </button>
        </>
      )}
      {removeTooltip&&(
        <>
          <div onClick={()=>setRemoveTooltip(null)} aria-hidden="true" style={{position:'fixed',inset:0,zIndex:499}}/>
          <button className="highlight-tooltip" onClick={doRemove}
            style={{left:removeTooltip.x,top:removeTooltip.y,transform:'translateX(-50%)',color:'#F87171',fontFamily:'inherit'}}>
            <span style={{marginRight:6}}>✕</span>Remove highlight
          </button>
        </>
      )}
    </div>
  );
}

function AudioBack({text,stackColor}){
  const[speaking,setSpeaking]=useState(false);
  const play=()=>{
    if(speaking){window.speechSynthesis.cancel();setSpeaking(false);return;}
    window.speechSynthesis.cancel();
    const utt=new SpeechSynthesisUtterance(text);
    const go=()=>{
      const v=window.speechSynthesis.getVoices();
      const pick=['Samantha','Karen','Daniel'].map(n=>v.find(x=>x.name.includes(n))).find(Boolean)||v.find(x=>x.lang.startsWith('en'))||v[0];
      if(pick)utt.voice=pick;utt.rate=0.92;utt.pitch=1.05;
      utt.onend=()=>setSpeaking(false);
      window.speechSynthesis.speak(utt);setSpeaking(true);
    };
    window.speechSynthesis.getVoices().length?go():(window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;go();});
  };
  useEffect(()=>{play();return()=>window.speechSynthesis.cancel();},[]);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16,padding:'16px 0'}} onClick={e=>e.stopPropagation()}>
      <button onClick={play} style={{width:56,height:56,borderRadius:'50%',border:`2px solid ${stackColor}`,background:speaking?`${stackColor}30`:`${stackColor}18`,color:stackColor,fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s'}}>
        {speaking?'⏸':'▶'}
      </button>
      <div style={{display:'flex',gap:3,alignItems:'flex-end',height:20}}>
        {[0,1,2,3,4].map(i=><div key={i} style={{width:3,borderRadius:2,background:stackColor,height:speaking?`${[8,14,20,14,8][i]}px`:'4px',transition:`height ${0.15+i*0.05}s ease`,opacity:speaking?0.9:0.3}}/>)}
      </div>
      <p style={{fontSize:14,color:'rgba(255,255,255,0.6)',lineHeight:1.6,textAlign:'center',fontWeight:300,margin:0}}>{text}</p>
    </div>
  );
}

function FlashCard({card,stackColor,backView,visualCache,onRate,onDelete}){
  const[flipped,setFlipped]=useState(false);
  const[selected,setSelected]=useState(card.lastRating||null);
  const[tilt,setTilt]=useState({x:0,y:0});

  const handleMouseMove=e=>{const r=e.currentTarget.getBoundingClientRect();setTilt({x:((e.clientY-r.top)/r.height-.5)*8,y:-(((e.clientX-r.left)/r.width)-.5)*8});};
  const handleMouseLeave=()=>setTilt({x:0,y:0});

  const doFlip=()=>setFlipped(f=>!f);

  const rate=e=>{
    e.stopPropagation();
    const rating=e.currentTarget.dataset.rating;
    const next=selected===rating?null:rating;
    setSelected(next);
    onRate(card.id,next||'clear');
  };

  const btnStyle=(r,color,bg,glowColor)=>({
    padding:'10px 20px',borderRadius:100,
    border:`1px solid ${color}50`,
    background:selected===r?`${color}40`:bg,
    color,fontSize:13,fontWeight:600,cursor:selected?'default':'pointer',
    fontFamily:'inherit',
    transform:selected===r?'scale(1.06)':'scale(1)',
    boxShadow:selected===r?`0 0 16px ${glowColor}`:'none',
    transition:'all .15s',
    outline:selected===r?`2px solid ${color}`:'none',
  });

  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{width:'50vw',maxWidth:700,minWidth:320,height:'340px',flexShrink:0}}>
        <div onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}
          style={{
            position:'relative',width:'100%',height:'100%',cursor:'pointer',borderRadius:20,overflow:'hidden',
            transform:`rotateX(${tilt.x*0.4}deg) rotateY(${tilt.y*0.4}deg)`,
            transition:(tilt.x===0&&tilt.y===0)?'transform .3s ease':'transform .08s ease',
            filter:`drop-shadow(0 0 ${flipped?32:16}px ${stackColor}${flipped?'55':'28'})`,
          }}>
          {/* bg */}
          <div style={{position:'absolute',inset:0,background:flipped?'linear-gradient(145deg,#1e1a2a 0%,#111116 45%,#1c1822 80%,#0f0f14 100%)':'linear-gradient(145deg,#1c1c22 0%,#111116 45%,#1a1620 80%,#0f0f14 100%)',transition:'background .3s ease'}}/>
          <div style={{position:'absolute',inset:0,background:`linear-gradient(125deg,${stackColor}${flipped?'35':'22'} 0%,transparent 35%,rgba(255,255,255,0.04) 55%,rgba(180,180,255,0.03) 70%,${stackColor}15 100%)`,transition:'all .3s',pointerEvents:'none'}}/>
          <div style={{position:'absolute',inset:0,border:`1px solid ${stackColor}${flipped?'70':'45'}`,borderRadius:20,transition:'border-color .3s',pointerEvents:'none'}}/>
          <div style={{position:'absolute',top:0,left:'10%',right:'10%',height:1,background:`linear-gradient(90deg,transparent 0%,${stackColor}${flipped?'ff':'90'} 40%,rgba(255,255,255,${flipped?'0.6':'0.3'}) 50%,${stackColor}${flipped?'ff':'90'} 60%,transparent 100%)`,transition:'all .3s',pointerEvents:'none'}}/>
          {/* Front */}
          <div onClick={doFlip} role="button" tabIndex={flipped?-1:0} aria-label="Reveal answer" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doFlip();}}} style={{position:'absolute',inset:0,padding:'36px 32px',display:'flex',flexDirection:'column',justifyContent:'center',opacity:flipped?0:1,transform:flipped?'scaleX(0.92)':'scaleX(1)',transition:'opacity .18s ease,transform .18s ease',pointerEvents:flipped?'none':'auto'}}>
            <p style={{fontSize:10,fontWeight:700,color:stackColor,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 16px',fontFamily:"'JetBrains Mono',monospace"}}>{card.topic||card.subject}</p>
            <p style={{fontSize:22,color:'rgba(255,255,255,0.95)',margin:0,lineHeight:1.4,fontWeight:600}}>{card.concept}</p>
            <p style={{fontSize:12,color:'rgba(255,255,255,0.2)',marginTop:'auto',paddingTop:20}}>tap to reveal</p>
          </div>
          {/* Back — click toggles back to front */}
          <div onClick={doFlip} role="button" tabIndex={flipped?0:-1} aria-label="Show question" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doFlip();}}} style={{position:'absolute',inset:0,padding:'28px 32px',display:'flex',flexDirection:'column',opacity:flipped?1:0,transform:flipped?'scaleX(1)':'scaleX(0.92)',transition:'opacity .18s ease .12s,transform .2s ease .1s',pointerEvents:flipped?'auto':'none'}}>
            <p style={{fontSize:10,fontWeight:700,color:stackColor,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 16px',fontFamily:"'JetBrains Mono',monospace"}}>Answer</p>
            <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}}>
              {backView==='audio'?(
                <AudioBack text={flashcardBack(card)} stackColor={stackColor}/>
              ):backView==='text'?(
                <p style={{fontSize:16,color:flashcardBack(card)?'rgba(255,255,255,0.88)':'rgba(255,255,255,0.4)',fontStyle:flashcardBack(card)?'normal':'italic',margin:0,lineHeight:1.75,fontWeight:300}}>{flashcardBack(card)||FLASHCARD_BACK_EMPTY}</p>
              ):(
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,width:'100%',padding:'8px'}}>
                  {visualCache[card.id]==='loading'&&<LoadingState tc={stackColor} compact label='Sketching it out…'/>}
                  {visualCache[card.id]==='error'&&<p style={{fontSize:13,color:'rgba(255,255,255,0.3)',textAlign:'center'}}>{card.explanation}</p>}
                  {visualCache[card.id]&&visualCache[card.id]!=='loading'&&visualCache[card.id]!=='error'&&(
                    <div style={{width:'100%',maxWidth:'min(320px, 80%)',margin:'0 auto'}} dangerouslySetInnerHTML={{__html:visualCache[card.id]}}/>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
      {/* Rating — only shows after flip, state is local to THIS card instance */}
      <div onClick={e=>e.stopPropagation()} style={{marginTop:24,textAlign:'center',opacity:flipped?1:0,transition:'opacity .2s ease',pointerEvents:flipped?'auto':'none'}}>
        <p style={{fontSize:14,color:'#BBBBBB',marginBottom:14,fontFamily:"'JetBrains Mono',monospace",letterSpacing:'0.06em',textTransform:'uppercase',fontWeight:500}}>do you know you know this?</p>
        <div style={{display:'flex',gap:8,justifyContent:'center'}}>
          <button data-rating="nope" onClick={rate} style={btnStyle('nope','#F87171','rgba(248,113,113,0.08)','rgba(248,113,113,0.5)')}>Nope 😬</button>
          <button data-rating="kinda" onClick={rate} style={btnStyle('kinda','#FBBF24','rgba(251,191,36,0.08)','rgba(251,191,36,0.5)')}>Kinda 🤔</button>
          <button data-rating="gotit" onClick={rate} style={btnStyle('gotit',stackColor,`${stackColor}12`,`${stackColor}60`)}>Got it ✓</button>
        </div>
        {selected&&<p style={{fontSize:11,color:'rgba(255,255,255,0.3)',marginTop:10,fontFamily:'monospace'}}>registered ✓ — moving on…</p>}
      </div>
    </div>
  );
}

function FlashcardLightbox({cards,stackTitle,stackColor,onClose,onRemove,onRate,isVisualLearner}){
  const[idx,setIdx]=useState(0);
  const[flipped,setFlipped]=useState(false);
  const[rated,setRated]=useState(false); // stays true until next card — buttons never disappear mid-session
  const[localCards,setLocalCards]=useState(cards);
  const[backView,setBackView]=useState('text');
  const[visualCache,setVisualCache]=useState({});
  const[swipeDir,setSwipeDir]=useState(null);
  const[animKey,setAnimKey]=useState(0);
  const[tilt,setTilt]=useState({x:0,y:0});
  const[flipAnim,setFlipAnim]=useState(''); // 'flip-in' | 'flip-out' | ''
const[selectedRating,setSelectedRating]=useState(null);
  useEffect(()=>{setLocalCards(cards);},[cards.length]);
  useEffect(()=>{setBackView('text');},[idx]);
  useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goPrev();};document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);});

  const handleMouseMove=e=>{const r=e.currentTarget.getBoundingClientRect();setTilt({x:((e.clientY-r.top)/r.height-.5)*8,y:-(((e.clientX-r.left)/r.width)-.5)*8});};
  const handleMouseLeave=()=>setTilt({x:0,y:0});

  const playAudio=text=>{window.speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance(text);const go=()=>{const v=window.speechSynthesis.getVoices();const p=['Samantha','Karen','Daniel'].map(n=>v.find(x=>x.name.includes(n))).find(Boolean)||v.find(x=>x.lang.startsWith('en'));if(p)utt.voice=p;utt.rate=0.92;window.speechSynthesis.speak(utt);};window.speechSynthesis.getVoices().length?go():(window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;go();});};

  if(localCards.length===0)return(<div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}><p style={{fontSize:15,color:C.muted}}>All done 🎉</p><Btn onClick={onClose} color={stackColor}>Close</Btn></div>);

  const safeIdx=Math.min(idx,localCards.length-1);
  const card=localCards[safeIdx];
  const doneCount=localCards.filter(c=>c.status==='archived').length;
  const hardCount=localCards.filter(c=>c.status==='priority').length;
  const inStackCount=localCards.filter(c=>c.status!=='archived').length; // hard cards are still in stack

  const nav=(dir)=>{setFlipped(false);setRated(false);setSwipeDir(dir);setAnimKey(k=>k+1);setIdx(i=>dir==='left'?Math.min(localCards.length-1,i+1):Math.max(0,i-1));};
  const goNext=()=>nav('left');
  const goPrev=()=>nav('right');

  const doFlip=()=>{
    setFlipAnim('flip-out');
    setTimeout(()=>{setFlipped(f=>!f);setFlipAnim('flip-in');},180);
    setTimeout(()=>setFlipAnim(''),380);
    if(!flipped)setRated(true); // show buttons when revealing answer
  };

  const handleRate=rating=>{
    onRate(card.id,rating);
    setLocalCards(prev=>prev.map(c=>c.id===card.id?{...c,status:rating==='nope'?'priority':rating==='kinda'?'active':'archived',lastRating:rating}:c));
    // stay on back face, just advance to next card
    setTimeout(()=>{
      setFlipped(false);setRated(false);
      if(safeIdx<localCards.length-1)setIdx(safeIdx);
      else setIdx(Math.max(0,safeIdx-1));
    },400);
  };

  const handleDelete=()=>{onRemove(card.id);setLocalCards(prev=>prev.filter(c=>c.id!==card.id));setFlipped(false);setRated(false);};

  const generateVisual=async()=>{
    if(visualCache[card.id])return;
    setVisualCache(v=>({...v,[card.id]:'loading'}));
    const sys=["Generate a simple SVG diagram for a Year 12 concept.","Return ONLY raw <svg>...</svg>. viewBox=\"0 0 320 220\". Minimal.","Accent: "+stackColor+", text: #EDECE8, muted: #8C9389. font-family Geist."].join(' ');
    try{const res=await api.post('/ai/chat',{system:sys,messages:[{role:'user',content:`Concept: ${card.concept}\n${card.explanation}`}],max_tokens:900});let svg=(res.text||'').trim().replace(/^```svg?\n?/i,'').replace(/```\s*$/,'').trim().replace(/<script[\s\S]*?<\/script>/gi,'');if(!svg.startsWith('<svg')){setVisualCache(v=>({...v,[card.id]:'error'}));return;}setVisualCache(v=>({...v,[card.id]:svg}));}
    catch(e){setVisualCache(v=>({...v,[card.id]:'error'}));}
  };
  const showVisualTab=()=>{setBackView('visual');generateVisual();};



  return(
    <div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(5,5,6,0.97)',backdropFilter:'blur(8px)',display:'flex',flexDirection:'column',animation:'lightboxIn .22s cubic-bezier(.16,1,.3,1)'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'20px 28px',flexShrink:0,background:`linear-gradient(135deg,${stackColor} 0%,${stackColor}CC 100%)`}}>
        <div><p style={{fontSize:20,fontWeight:800,color:'#080809',letterSpacing:'-0.02em',margin:'0 0 4px'}}>{stackTitle}</p><p style={{fontSize:12,color:'rgba(0,0,0,0.55)',margin:0,fontWeight:600}}>{doneCount}/{localCards.length} cards done</p></div>
        <button onClick={onClose} style={{background:'rgba(0,0,0,0.15)',border:'none',borderRadius:9,width:34,height:34,color:'#080809',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
      </div>
      {/* Stack bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 28px',background:'#0a0a0c',borderBottom:'1px solid rgba(255,255,255,0.05)',flexShrink:0}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,letterSpacing:'0.12em',textTransform:'uppercase',color:'rgba(255,255,255,0.4)',display:'flex',alignItems:'center',gap:10}}>
          <span>YOUR STACK</span><span style={{color:'rgba(255,255,255,0.6)',fontWeight:700}}>{String(safeIdx+1).padStart(2,'0')} / {String(localCards.length).padStart(2,'0')}</span>
        </div>
        <div style={{display:'flex',gap:8}}>
          {[{label:'In stack',count:inStackCount,color:'rgba(255,255,255,0.3)'},{label:'Hard',count:hardCount,color:'#FBBF24'},{label:'Done',count:doneCount,color:stackColor}].map(({label,count,color})=>(
            <div key={label} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:100,padding:'5px 12px'}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:color}}/><span style={{fontSize:11,color:'rgba(255,255,255,0.7)',fontFamily:"'JetBrains Mono',monospace"}}>{label}</span><span style={{fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.9)',fontFamily:"'JetBrains Mono',monospace"}}>{count}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{height:3,background:'rgba(255,255,255,0.06)',flexShrink:0}}><div style={{height:'100%',width:`${(doneCount/localCards.length)*100}%`,background:stackColor,transition:'width .3s ease'}}/></div>

      {/* Answer mode — absolute so it never pushes card */}
      <div style={{position:'absolute',top:138,left:0,right:0,display:'flex',alignItems:'center',justifyContent:'center',gap:16,zIndex:10}}>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',color:'rgba(255,255,255,0.3)'}}>ANSWER MODE</span>
        <div style={{display:'flex',gap:2,background:'rgba(255,255,255,0.06)',borderRadius:100,padding:3,border:'1px solid rgba(255,255,255,0.08)'}}>
          {[{id:'text',label:'Text',icon:'≡'},{id:'visual',label:'Visual',icon:'⬡'},{id:'audio',label:'Audio',icon:'♪'}].map(m=>(
            <button key={m.id} onClick={()=>m.id==='visual'?showVisualTab():m.id==='audio'?(setBackView('audio'),flipped&&playAudio(card.explanation)):setBackView('text')}
              style={{display:'flex',alignItems:'center',gap:5,padding:'6px 14px',borderRadius:100,border:'none',background:backView===m.id?'rgba(255,255,255,0.15)':'transparent',color:backView===m.id?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.4)',fontSize:12,fontWeight:backView===m.id?700:400,cursor:'pointer',fontFamily:'inherit',transition:'all .15s'}}>
              <span style={{fontSize:11}}>{m.icon}</span>{m.label}
            </button>
          ))}
        </div>
      </div>

      {/* Card area */}
      <div style={{flex:1,position:'relative',minHeight:0}}>
        <button onClick={goPrev} disabled={safeIdx===0} style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',zIndex:10,width:40,height:40,borderRadius:'50%',border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:safeIdx===0?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.6)',cursor:safeIdx===0?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <button onClick={goNext} disabled={safeIdx===localCards.length-1} style={{position:'absolute',right:16,top:'50%',transform:'translateY(-50%)',zIndex:10,width:40,height:40,borderRadius:'50%',border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:safeIdx===localCards.length-1?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.6)',cursor:safeIdx===localCards.length-1?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>

        <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:'8px 72px'}}>
          <div key={animKey} style={{animation:swipeDir?`cardFloat${swipeDir==='left'?'L':'R'} .55s cubic-bezier(.16,1,.3,1)`:'none'}}>
            <FlashCard card={card} stackColor={stackColor} backView={backView} visualCache={visualCache}
              onRate={(id,rating)=>{
                onRate(id,rating);
                setLocalCards(prev=>prev.map(c=>c.id===id?{...c,status:rating==='nope'?'priority':rating==='kinda'?'active':'archived',lastRating:rating}:c));
              }}
              onDelete={()=>{onRemove(card.id);setLocalCards(prev=>prev.filter(c=>c.id!==card.id));}}
            />
          </div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'12px 24px 24px',flexShrink:0}}>
        <button onClick={handleDelete} style={{fontSize:12,color:'rgba(255,255,255,0.3)',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',textDecoration:'underline'}}>Delete card</button>
      </div>

      <style>{`
        @keyframes lightboxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
        @keyframes flip-out{0%{transform:rotateY(0) scaleX(1)}100%{transform:rotateY(90deg) scaleX(0.3)}}
        @keyframes flip-in{0%{transform:rotateY(-90deg) scaleX(0.3)}100%{transform:rotateY(0) scaleX(1)}}
        @keyframes cardFloatL{0%{opacity:0;transform:translateX(60px)}60%{opacity:1}100%{opacity:1;transform:translateX(0)}}
        @keyframes cardFloatR{0%{opacity:0;transform:translateX(-60px)}60%{opacity:1}100%{opacity:1;transform:translateX(0)}}
      `}</style>
    </div>
  );
}

function CardStack({title,icon,color,cards,onClick,onEdit,subjectId}){
  const doneCount=cards.filter(c=>c.status==='archived').length;
  const[hovered,setHovered]=useState(false);
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
      <div onClick={onClick} role="button" tabIndex={0} aria-label={'Open '+title+' stack'} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onClick&&onClick();}}} onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)} onFocus={()=>setHovered(true)} onBlur={()=>setHovered(false)}
        style={{position:'relative',width:148,height:124,cursor:'pointer',transition:'transform .2s ease',transform:hovered?'scale(1.04)':'scale(1)'}}>
        {[2,1,0].map(layer=>(
          <div key={layer} style={{
            position:'absolute',inset:0,
            transform:`translateY(${layer*-6}px) translateX(${layer*3}px) rotate(${layer===0?0:layer*2.5}deg)`,
            borderRadius:16,zIndex:3-layer,
            background:layer===0?`linear-gradient(135deg, #1a1a1f 0%, #111114 40%, #1e1a2a 70%, #111114 100%)`:`#0e0e12`,
            border:layer===0?`1px solid ${color}50`:`1px solid rgba(255,255,255,0.04)`,
            boxShadow:layer===0?`0 ${hovered?'20px 48px':'12px 32px'} rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0 0.5px ${color}30${hovered?`, 0 0 24px ${color}30`:''}`:  'none',
            display:layer===0?'flex':'block',alignItems:'center',justifyContent:'center',overflow:'hidden',
            transition:'box-shadow .2s ease',
          }}>
            {layer===0&&<>
              <div style={{position:'absolute',inset:0,background:`linear-gradient(125deg, ${color}${hovered?'28':'18'} 0%, transparent 40%, rgba(255,255,255,0.03) 60%, ${color}10 100%)`,pointerEvents:'none',transition:'all .2s'}}/>
              <div style={{position:'absolute',top:0,left:0,right:0,height:1,background:`linear-gradient(90deg, transparent, ${color}60, transparent)`,pointerEvents:'none'}}/>
              <div style={{position:'relative',zIndex:1,width:64,height:64,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {subjectId
                  ?<SubjectGraphic subjectId={subjectId} color={color} active={hovered}/>
                  :<span style={{fontSize:32}}>{icon}</span>}
              </div>

        {cards.length>0&&(
          <div style={{position:'absolute',top:-8,right:-8,zIndex:4,background:color,color:'#080809',fontSize:11,fontWeight:800,minWidth:22,height:22,borderRadius:11,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 6px',boxShadow:`0 2px 8px ${color}60`}}>
            {cards.length}
          </div>
        )}
      </div>
      <div style={{textAlign:'center'}}>
        <p style={{fontSize:13,fontWeight:600,color:C.text,margin:'0 0 2px'}}>{title}</p>
        <p style={{fontSize:11,color:C.muted,margin:0}}>{doneCount}/{cards.length} done</p>
      </div>
      {onEdit&&cards.length>0&&(
        <button onClick={e=>{e.stopPropagation();onEdit();}} style={{fontSize:11,color:C.muted,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',textDecoration:'underline'}}>Edit</button>
      )}
    </div>
  );
}

function EditStackModal({title,color,cards,onClose,onRemove}){
  return(
    <div style={{position:'fixed',inset:0,zIndex:310,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:440,maxHeight:'70vh',background:C.s1,border:`1px solid ${C.b1}`,borderRadius:16,display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px',borderBottom:`1px solid ${C.b1}`}}>
          <p style={{fontSize:14,fontWeight:600,color:C.text,margin:0}}>Edit {title}</p>
          <button onClick={onClose} style={{background:'none',border:'none',color:C.muted,cursor:'pointer',fontSize:16}}>✕</button>
        </div>
        <div style={{overflowY:'auto',padding:12}}>
          {cards.map(c=>(

/* ══════════════════════════════════════════════════════
   QUIZ RESULT REMARKS — Gen Z pithy remarks keyed by score
   percentage band. Used by TestFlow
   results cards.
══════════════════════════════════════════════════════ */
const QUIZ_REMARKS={
  perfect:["Okay but did you peek? (jk, that's elite)","No notes. Literally — you didn't need any.","100%. Certified menace to this topic.","You ate that and left no crumbs."],
  high:["Slay, basically. A couple loose ends, that's it.","That's a green flag of a score.","You're so back (you never left tbh).","Main character energy on this one."],
  mid:["Mid-ish but mid is just 'room to flex.'","Not bad, not iconic. We rebuild.","You're somewhere between 'studied' and 'vibed.' Pick a lane.","Decent. The plot has room to develop."],
  low:["This ain't it chief, but it's also not nothing.","Rough one — but every L is just data.","Big oof energy, small effort to fix it.","That's a 'we don't talk about this' score. Let's fix it."],
  flop:["That was a certified flop. Onwards.","Yikes — but also, now you know exactly what to study.","L take, W mindset: go again.","This is rock bottom, which means only up from here."],
};
function getQuizRemark(pct){
  const band=pct===100?'perfect':pct>=80?'high':pct>=50?'mid':pct>=25?'low':'flop';
  const list=QUIZ_REMARKS[band];
  return list[Math.floor(Math.random()*list.length)];
}

/* Big score-reveal card shown at the top after submitting a quiz/exam.
   Includes a "Review answers" link that smooth-scrolls to the breakdown. */
function QuizResultCard({score,total,tc,onReviewClick}){
  const pct=total?Math.round((score/total)*100):0;
  const[remark]=useState(()=>getQuizRemark(pct));

  return(
    <div style={{background:`linear-gradient(150deg, ${color}14 0%, ${color}05 100%)`,border:`1px solid ${color}35`,borderRadius:18,padding:'32px 28px',marginBottom:28,textAlign:'center',animation:'fadeUp .4s ease'}}>
      <p style={{fontSize:'clamp(36px,7vw,56px)',fontWeight:800,color,margin:'0 0 6px',letterSpacing:'-0.03em',lineHeight:1}}>
        {score}/{total} <span style={{opacity:0.5,fontSize:'0.55em'}}>|</span> {pct}%
      </p>
      <p style={{fontSize:16,color:C.text,margin:'0 0 20px',fontWeight:500}}>{remark}</p>

        </svg>
      </button>
      <style>{`@keyframes breatheDown{0%,100%{transform:translateY(0);opacity:0.6}50%{transform:translateY(4px);opacity:1}}`}</style>

/* ─── TestFlow: unified test experience ──────────────────────────────────────
   Scope (topic / whole subject / mix across subjects) × Mode (Chill / Lock In).
   Replaces the old PopQuiz + PracticeExam tab split.
   Question counts scale with scope: topic=5, subject=12, mix=10. */
function TestFlow({tc,user}){
  const[mode,setMode]=useState('pick');            /* pick | exam */
  const[scope,setScope]=useState(null);            /* 'topic' | 'subject' | 'mix' */
  const[pickedSubject,setPickedSubject]=useState(null);
  const[pickedTopic,setPickedTopic]=useState(null);/* topic name | '__ALL__' */
  const[examMode,setExamMode]=useState(null);      /* 'chill' | 'lockin' */
  const[showTimer,setShowTimer]=useState(true);
  const[secondsLeft,setSecondsLeft]=useState(null);
  const[questions,setQuestions]=useState([]);
  const[answers,setAnswers]=useState({});
  const[hints,setHints]=useState({});
  const[loadingHint,setLoadingHint]=useState({});
  const[loadingQ,setLoadingQ]=useState(false);
  const[loadError,setLoadError]=useState('');
  const[submitted,setSubmitted]=useState(false);
  const topRef=useRef(null);
  const questionsRef=useRef(null);
  const answersRef=useRef({});
  useEffect(()=>{answersRef.current=answers;},[answers]);

  const pickedSubjectObj=SUBJECTS.find(s=>s.id===pickedSubject);
  const accent=scope==='mix'?'#7BEA5A':(pickedSubjectObj?.color||tc);
  const testTitle=scope==='mix'?'Mix It Up':scope==='subject'?'Whole subject':(pickedTopic||'Test');
  const testSubtitle=scope==='mix'?'Across all your subjects':(pickedSubjectObj?.name||'');
  const expectedQ=scope==='topic'?5:scope==='mix'?10:12;

  /* Feed results into the Gap Map — proximity signals per subject::topic */
  const logResults=(qs,ans)=>{
    try{
      qs.forEach(q=>{
        let sid=pickedSubject;
        let topic=scope==='topic'?pickedTopic:(q.topic||'General');
        if(scope==='mix'&&q.topic){
          const parts=q.topic.split(' — ');
          const so=SUBJECTS.find(x=>x.name===parts[0]);
          if(so){sid=so.id;topic=parts[1]||parts[0];}
        }
        if(sid&&topic&&topic!=='__ALL__')gapLog(sid,topic,ans[q.id]===q.answer?'right':'wrong');
      });
    }catch(e){}
  };

  const submitTest=()=>{
    logResults(questions,answers);
    setSubmitted(true);
    setTimeout(()=>topRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),50);
  };
  const scrollToQuestions=()=>{
    questionsRef.current?.scrollIntoView({behavior:'smooth',block:'start'});
  };

  /* Lock In countdown — auto-submits at zero */
  useEffect(()=>{
    if(mode!=='exam'||examMode!=='lockin'||submitted||loadingQ||questions.length===0||secondsLeft===null)return;
    if(secondsLeft<=0){logResults(questions,answersRef.current);setSubmitted(true);return;}
    const t=setTimeout(()=>setSecondsLeft(s=>(s===null?null:s-1)),1000);
    return()=>clearTimeout(t);
  },[mode,examMode,submitted,loadingQ,questions.length,secondsLeft]);

  const startTest=async()=>{
    if(!scope||!examMode)return;
    setLoadingQ(true);setMode('exam');setAnswers({});setHints({});setSubmitted(false);setQuestions([]);setLoadError('');setSecondsLeft(null);
    const jsonShape='{"questions":[{"id":1,"topic":"...","question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"answer":0,"explanation":"..."}]}';
    let sys,userMsg,maxTok;
    if(scope==='topic'){
      maxTok=2800;
      sys=`Year 12 ${pickedSubjectObj?.name} exam question generator. Generate 5 multiple-choice exam-style questions on the topic "${pickedTopic}". Return ONLY valid JSON, no markdown, no commentary before or after: ${jsonShape}. Set every "topic" field to "${pickedTopic}". The answer field is the 0-based index of the correct option. Write at Year 12 difficulty, matching ATAR exam style. Keep explanations to 1-2 sentences.`;
      userMsg=`Generate 5 Year 12 ${pickedSubjectObj?.name} exam-style questions on: ${pickedTopic}`;
    }else if(scope==='subject'){
      maxTok=6000;
      const topics=pickedSubjectObj?.topics||[];
      sys=`Year 12 ${pickedSubjectObj?.name} exam generator. Generate a practice exam with 12 questions covering multiple topics across the Year 12 ${pickedSubjectObj?.name} curriculum. Vary difficulty — include recall, application, and analysis questions. Return ONLY valid JSON, no markdown, no commentary before or after: ${jsonShape}. Keep each explanation to 1-2 sentences so the full response fits. Use ATAR exam style and terminology. Label each question with its topic.`;
      userMsg=`Generate a 12-question Year 12 ${pickedSubjectObj?.name} practice exam covering: ${topics.join(', ')}`;
    }else{
      maxTok=5200;
      const names=getSelectedSubjects(user).map(s=>s.name).join(', ');
      sys=`Year 12 exam generator. Generate a mixed practice test with 10 multiple-choice questions spread across these Year 12 subjects: ${names}. Cover as many different subjects as possible, varying topics and difficulty. Return ONLY valid JSON, no markdown, no commentary before or after: ${jsonShape}. Set each "topic" field to "Subject — Topic" (e.g. "Biology — Genetics"). Keep each explanation to 1-2 sentences so the full response fits. Use ATAR exam style and terminology.`;
      userMsg=`Generate a 10-question mixed Year 12 test across: ${names}`;
    }
    try{
      const res=await api.post('/ai/chat',{system:sys,messages:[{role:'user',content:userMsg}],max_tokens:maxTok});
      if(res.error){setLoadError(res.error);setLoadingQ(false);return;}
      let raw=(res.text||'').replace(/```json?|```/g,'').trim();
      let data;
      try{
        data=JSON.parse(raw);
      }catch(parseErr){
        /* Response likely truncated mid-JSON — salvage complete questions
           by trimming to the last fully-closed question object. */
        const lastComplete=raw.lastIndexOf('},{');
        if(lastComplete>0){
          try{
            const salvaged=raw.slice(0,lastComplete+1).replace(/,\s*$/,'')+']}';
            const fixedStart=salvaged.startsWith('{')?salvaged:'{"questions":['+salvaged.split('"questions":[')[1];
            data=JSON.parse(fixedStart);
          }catch(e2){data=null;}
        }
      }
      if(!data||!Array.isArray(data.questions)||data.questions.length===0){
        setLoadError('Could not generate a valid test this time — the response may have been cut off. Try again.');
        setQuestions([]);
      }else{
        setQuestions(data.questions);
        if(examMode==='lockin')setSecondsLeft(data.questions.length*90); /* 90s per question */
        if(data.questions.length<expectedQ){
          setLoadError(`Generated ${data.questions.length} of ${expectedQ} questions (response was trimmed). You can still take this shorter test, or try again for the full set.`);
        }
      }
    }catch(e){
      setLoadError('Something went wrong generating the test: '+e.message);
      setQuestions([]);
    }
    setLoadingQ(false);
  };

  const getHint=async(q)=>{
    setLoadingHint(h=>({...h,[q.id]:true}));
    const res=await api.post('/ai/chat',{system:'Year 12 exam tutor. Give a SHORT hint (1-2 sentences) for this multiple choice question — point the student toward the right approach without giving the answer directly.',messages:[{role:'user',content:`Question: ${q.question}\nOptions: ${q.options.join(', ')}`}],max_tokens:120});
    setHints(h=>({...h,[q.id]:res.text||'Think about the key concepts in the question.'}));
    setLoadingHint(h=>({...h,[q.id]:false}));
  };

  const score=submitted?questions.filter(q=>answers[q.id]===q.answer).length:0;

  const renderModeSelect=(color)=>{
    const EXAM_MODES=[
      {id:'chill', emoji:'🧊', name:'Chill',   blurb:'Untimed · hints on tap'},
      {id:'lockin',emoji:'🔒', name:'Lock In', blurb:'Timed · no hints · exam conditions'},
    ];
    return(
      <div>
        <FieldLabel>Test mode</FieldLabel>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10,margin:'8px 0 14px'}}>
          {EXAM_MODES.map(m=>{
            const sel=examMode===m.id;
            return(
              <button key={m.id} onClick={()=>setExamMode(m.id)}
                style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:6,padding:'16px 16px 14px',borderRadius:14,cursor:'pointer',fontFamily:'inherit',textAlign:'left',
                  border:`1px solid ${sel?'#FFFFFF':C.b1}`,background:sel?'#FFFFFF':C.s1,transition:'all .16s',boxShadow:sel?'0 0 18px rgba(255,255,255,0.14)':'none'}}>
                <span style={{fontSize:22,lineHeight:1}}>{m.emoji}</span>
                <span style={{fontSize:15,fontWeight:700,letterSpacing:'-0.02em',color:sel?'#080809':C.text}}>{m.name}</span>
                <span style={{fontSize:12,color:sel?'rgba(8,8,9,0.6)':C.muted,lineHeight:1.4}}>{m.blurb}</span>
              </button>
            );
          })}
        </div>
        {examMode==='lockin'&&(
          <button onClick={()=>setShowTimer(t=>!t)}
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'7px 12px',borderRadius:100,border:`1px solid ${showTimer?'#FFFFFF':C.b2}`,background:showTimer?'#FFFFFF':'transparent',color:showTimer?'#080809':C.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',marginBottom:16,transition:'all .15s'}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:showTimer?'#080809':'#56554f',transition:'all .15s'}}/>
            {showTimer?'Timer visible':'Timer hidden'}
          </button>
        )}
        <div>
          <Btn onClick={startTest} color={color} disabled={!examMode}>Let's go →</Btn>
        </div>
      </div>
    );
  };

  if(mode==='pick'){
    /* ── Mix It Up: mode select ── */
    if(scope==='mix')return(
      <div>
        <button onClick={()=>{setScope(null);setExamMode(null);}} style={{display:'flex',alignItems:'center',gap:6,background:'none',border:'none',color:C.muted,cursor:'pointer',fontFamily:'inherit',fontSize:13,padding:0,marginBottom:16}}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2.5L3.5 6.5L8 10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Back
        </button>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
          <span style={{fontSize:30,lineHeight:1}}>🎲</span>
          <h2 style={{fontSize:20,fontWeight:700,color:'#7BEA5A',margin:0,letterSpacing:'-0.02em'}}>Mix It Up</h2>
        </div>
        <p style={{fontSize:15,color:'rgba(237,236,232,0.9)',margin:'0 0 6px',lineHeight:1.55}}>10 questions shuffled across everything you study. No hiding in your best subject.</p>
        <p style={{fontSize:12,color:C.muted,margin:'0 0 20px',lineHeight:1.5}}>All questions are AI-generated practice — not official ATAR content.</p>
        {renderModeSelect('#7BEA5A')}
      </div>
    );
    /* ── Subject grid + Mix It Up entry ── */
    if(!pickedSubjectObj)return(
      <div>
        <p style={{fontSize:15,color:'rgba(237,236,232,0.9)',margin:'0 0 6px',lineHeight:1.55}}>Pick a subject, then drill one topic or take on the whole thing.</p>
        <p style={{fontSize:12,color:C.muted,margin:'0 0 20px',lineHeight:1.5}}>All questions are AI-generated practice — not official ATAR content.</p>
        <button onClick={()=>{setScope('mix');setExamMode(null);}}
          style={{display:'flex',alignItems:'center',gap:14,width:'100%',padding:'16px 18px',borderRadius:14,cursor:'pointer',fontFamily:'inherit',textAlign:'left',marginBottom:22,
            border:'1px solid rgba(123,234,90,0.35)',background:'linear-gradient(120deg, rgba(123,234,90,0.10) 0%, rgba(123,234,90,0.03) 100%)',transition:'all .16s'}}>
          <span style={{fontSize:26,lineHeight:1}}>🎲</span>
          <span style={{display:'flex',flexDirection:'column',gap:2}}>
            <span style={{fontSize:15,fontWeight:700,letterSpacing:'-0.02em',color:'#7BEA5A'}}>Mix It Up</span>
            <span style={{fontSize:12.5,color:C.muted,lineHeight:1.4}}>One test, questions from all your subjects</span>
          </span>
          <span style={{marginLeft:'auto',color:'#7BEA5A',fontSize:16}}>→</span>
        </button>
        <FieldLabel>Or choose a subject</FieldLabel>
        <div style={{marginTop:8}}>
          <QuizSubjectGrid subjects={getSelectedSubjects(user)} picked={pickedSubject} onPick={id=>{setPickedSubject(id);setPickedTopic(null);setScope(null);setExamMode(null);}}/>
        </div>
      </div>
    );
    /* ── Topic / whole-subject select, then mode ── */
    return(
      <div>
        <button onClick={()=>{setPickedSubject(null);setPickedTopic(null);setScope(null);setExamMode(null);}} style={{display:'flex',alignItems:'center',gap:6,background:'none',border:'none',color:C.muted,cursor:'pointer',fontFamily:'inherit',fontSize:13,padding:0,marginBottom:16}}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2.5L3.5 6.5L8 10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
          All subjects

          <h2 style={{fontSize:20,fontWeight:700,color:pickedSubjectObj.color,margin:0,letterSpacing:'-0.02em'}}>{pickedSubjectObj.name}</h2>
        </div>
        <FieldLabel>What do you want to test?</FieldLabel>
        <button onClick={()=>{setPickedTopic('__ALL__');setScope('subject');}}
          style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'12px 15px',borderRadius:11,cursor:'pointer',fontFamily:'inherit',textAlign:'left',margin:'8px 0 10px',
            border:`1px solid ${scope==='subject'?'#FFFFFF':C.b2}`,background:scope==='subject'?'#FFFFFF':C.s1,transition:'all .15s'}}>
          <span style={{fontSize:17,lineHeight:1}}>✦</span>
          <span style={{fontSize:13.5,fontWeight:600,color:scope==='subject'?'#080809':C.text}}>Whole subject</span>
          <span style={{fontSize:12,color:scope==='subject'?'rgba(8,8,9,0.55)':C.muted,marginLeft:'auto'}}>12 questions · every topic</span>
        </button>
        <div style={{display:'flex',flexWrap:'wrap',gap:7,margin:'0 0 20px'}}>
          {pickedSubjectObj.topics.map(t=>{

              <button key={t} onClick={()=>{setPickedTopic(t);setScope('topic');}}
                style={{padding:'7px 13px',borderRadius:8,border:`1px solid ${sel?'#FFFFFF':C.b2}`,background:sel?'#FFFFFF':'transparent',color:sel?'#080809':C.text,fontSize:13,fontWeight:sel?600:400,cursor:'pointer',fontFamily:'inherit'}}>
                {t}
              </button>
            );
          })}
        </div>
        {scope&&pickedTopic&&renderModeSelect(pickedSubjectObj.color)}
      </div>

  }

  /* ── The test itself: fullscreen modal ── */
  const exitTest=()=>{
    if(!submitted&&questions.length>0&&!window.confirm('Leave the test? Your progress will be lost.'))return;
    setMode('pick');setSubmitted(false);setQuestions([]);setSecondsLeft(null);
  };

    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>

            {examMode==='lockin'?'🔒 Lock In':'🧊 Chill'}

          {examMode==='lockin'&&secondsLeft!==null&&!submitted&&(
            <button onClick={()=>setShowTimer(t=>!t)} title={showTimer?'Hide timer':'Show timer'}

              {showTimer?timeLabel:'••:••'}
            </button>
          )}
        </div>
        <button onClick={exitTest} aria-label="Close test"
          style={{width:32,height:32,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',border:`1px solid ${C.b2}`,background:'transparent',color:C.muted,cursor:'pointer',fontSize:15,fontFamily:'inherit',transition:'all .15s'}}>
          ✕
        </button>
      </div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16,marginBottom:24}}>
        <div>
          <p style={{fontSize:13,fontWeight:600,color:C.text,margin:'0 0 4px',letterSpacing:'-0.01em'}}>{testSubtitle}</p>
          <h1 style={{fontSize:'clamp(28px,5vw,40px)',fontWeight:800,color:accent,margin:0,letterSpacing:'-0.03em',lineHeight:1.0}}>{testTitle}</h1>
          {submitted&&examMode==='lockin'&&secondsLeft!==null&&secondsLeft<=0&&(
            <p style={{fontSize:12,color:'#F87171',margin:'8px 0 0',fontWeight:600}}>⏱ Time's up — auto-submitted.</p>
          )}
        </div>
      </div>
      {submitted&&<QuizResultCard score={score} total={questions.length} tc={tc} onReviewClick={scrollToQuestions}/>}
      {loadError&&!loadingQ&&(
        <div style={{padding:'14px 18px',background:questions.length>0?'rgba(251,191,36,0.08)':'rgba(248,113,113,0.08)',border:`1px solid ${questions.length>0?'rgba(251,191,36,0.3)':'rgba(248,113,113,0.3)'}`,borderRadius:12,marginBottom:20,display:'flex',gap:10,alignItems:'flex-start'}}>
          <span style={{fontSize:15,flexShrink:0}}>{questions.length>0?'⚠️':'❌'}</span>
          <div style={{flex:1}}>
            <p style={{fontSize:13,color:questions.length>0?'#FBBF24':'#F87171',margin:'0 0 8px',lineHeight:1.5}}>{loadError}</p>
            {questions.length===0&&<Btn onClick={startTest} variant="secondary" size="sm">Try again</Btn>}
          </div>
        </div>
      )}
      <div ref={questionsRef}>
      {loadingQ?(
        <LoadingState tc={tc}/>
      ):questions.map((q,qi)=>(
        <div key={q.id} style={{marginBottom:16,background:C.s1,border:`1px solid ${C.b1}`,borderRadius:14,padding:'16px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <p style={{fontSize:11,fontWeight:600,color:C.muted,margin:0,fontFamily:"'JetBrains Mono',monospace"}}>Q{qi+1}</p>
            {showTopicChip&&q.topic&&<p style={{fontSize:11,color:accent,margin:0}}>{q.topic}</p>}
          </div>
          <p style={{fontSize:14,color:C.text,margin:'0 0 12px',lineHeight:1.6,fontWeight:500}}>{q.question}</p>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {q.options.map((opt,oi)=>{
              const sel=answers[q.id]===oi;
              const correct=submitted&&oi===q.answer;
              const wrong=submitted&&sel&&oi!==q.answer;
              return(
                <button key={oi} onClick={()=>!submitted&&setAnswers(a=>({...a,[q.id]:oi}))}
                  style={{textAlign:'left',padding:'9px 12px',borderRadius:8,border:`1px solid ${correct?'#4ADE80':wrong?'#F87171':sel?tc:C.b2}`,background:correct?'rgba(74,222,128,0.1)':wrong?'rgba(248,113,113,0.1)':sel?`${tc}12`:'transparent',color:correct?'#4ADE80':wrong?'#F87171':C.text,fontSize:12.5,cursor:submitted?'default':'pointer',fontFamily:'inherit',transition:'all .2s'}}>
                  {opt}
                </button>
              );
            })}
          </div>
          {submitted&&q.explanation&&(
            <div style={{marginTop:10,padding:'12px 14px',background:C.s2,borderRadius:8,borderLeft:`3px solid ${tc}`}}>
              <p style={{fontSize:10.5,fontWeight:700,color:tc,letterSpacing:'0.08em',textTransform:'uppercase',margin:'0 0 5px',fontFamily:"'JetBrains Mono',monospace"}}>Explanation</p>
              <p style={{fontSize:13.5,color:'rgba(237,236,232,0.85)',margin:0,lineHeight:1.65}}>{q.explanation}</p>
            </div>
          )}
          {!submitted&&examMode!=='lockin'&&(
            <div style={{marginTop:8}}>
              {hints[q.id]?(
                <div style={{background:'#FFFFFF',border:`1px solid ${tc}`,borderRadius:8,padding:'12px 14px'}}>
                  <p style={{fontSize:10.5,fontWeight:700,color:tc,letterSpacing:'0.08em',textTransform:'uppercase',margin:'0 0 5px',fontFamily:"'JetBrains Mono',monospace"}}>Hint</p>
                  <p style={{fontSize:13.5,color:'#1A1A1A',margin:0,lineHeight:1.65}}>{hints[q.id]}</p>
                </div>
              ):(
                <button onClick={()=>getHint(q)} disabled={loadingHint[q.id]}
                  style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,fontWeight:600,color:'#080809',background:tc,border:'none',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontFamily:'inherit',opacity:loadingHint[q.id]?0.6:1}}>
                  <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5.5" stroke="#080809" strokeWidth="1.3"/><path d="M5 5a1.5 1.5 0 1 1 2 1.4c-.5.3-.8.6-.8 1.2" stroke="#080809" strokeWidth="1.3" strokeLinecap="round"/><circle cx="6.5" cy="9.3" r="0.6" fill="#080809"/></svg>
                  {loadingHint[q.id]?'Getting hint…':'Get a hint'}
                </button>
              )}
            </div>
          )}
        </div>
      ))}
      </div>
      {!loadingQ&&questions.length>0&&!submitted&&(
        <Btn onClick={submitTest} color={tc} disabled={Object.keys(answers).length<questions.length}>
          Submit
        </Btn>
      )}
      {submitted&&(
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <Btn onClick={startTest} color={accent}>Go again</Btn>
          <Btn onClick={()=>{setSubmitted(false);setQuestions([]);setSecondsLeft(null);setMode('pick');}} variant="secondary">Change it up</Btn>
        </div>
      )}
      </div>
      </div>
    </div>
  );
}

          style={{flex:1,padding:'8px',borderRadius:7,border:'none',background:sel?C.s3:'transparent',color:sel?C.text:C.muted,fontSize:13,fontWeight:sel?600:400,cursor:'pointer',fontFamily:'inherit',transition:'all .15s'}}>
