<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>goat card — demo</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#080809;color:#EDEDE8;font-family:'Geist',system-ui,sans-serif}
  nav{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid #242A24}
  .wm{font-weight:800;letter-spacing:-.04em}.wm b{color:#7BEA5A}
  main{max-width:900px;margin:0 auto;padding:60px 24px}
  h1{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.05;text-transform:lowercase}
  h1 span{color:#7BEA5A}
  p{color:#8C9389;font-weight:300;max-width:52ch}
  .hint{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5D655D}
</style>
</head>
<body>
<nav><div class="wm">knowhere<b>.</b></div></nav>
<main>
  <h1>the shortcut<br/>to knowing<span>.</span></h1>
  <div data-goat-card style="margin:34px 0"></div>
  <p>mock homepage. the card renders into the [data-goat-card] mount above, in the page flow.</p>
  <p class="hint">to replay: localStorage.removeItem('kn_goat_card_v1') then reload — or set showOnce:false in the js while styling.</p>
</main>
<script src="knowhere-goat-card.js?v=1" defer></script>
<script src="./knowhere-mobile-menu.js?v=6" defer></script>
</body>
</html>
